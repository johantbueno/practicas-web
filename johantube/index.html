<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>JohanTube</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--muted:#5b6785;--accent:#0d7377;--line:#dde3f0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--muted:#9aa6c6;--accent:#4fd1c5;--line:#273255}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header h1{font-size:1.15rem;margin:0}
header span{color:var(--muted);font-size:.9rem}
.player{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:858/358;width:100%;position:relative}
video{width:100%;height:100%;display:block;background:#000}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#fff;padding:16px;font-size:1rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.bar label{color:var(--muted);font-size:.9rem}
select,button{font:inherit;font-size:1rem;min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.parts button{min-height:44px}
.parts button[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>▶ JohanTube</h1><span id="titulo"></span></header>
  <div class="player">
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="msg" id="msg"></div>
  </div>
  <div class="bar">
    <button id="ant">◀ Anterior</button>
    <button id="sig" class="primary">Siguiente ▶</button>
    <label>Velocidad
      <select id="vel"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select>
    </label>
    <label>Calidad
      <select id="cal"><option value="-1">Automática</option></select>
    </label>
  </div>
  <div class="parts" id="partes"></div>
  <p class="note">Material de uso exclusivo de clase. No lo descargue ni lo comparta fuera del grupo.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
  var BASE = 'https://johantube.167.88.36.13.sslip.io';
  var VIDEOS = {
    felicidad: { titulo: 'En busca de la felicidad', partes: 12 }
  };
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var key = h.get('k') || '';
  var vid = VIDEOS[q.get('v') || 'felicidad'];
  var vidId = q.get('v') || 'felicidad';
  var parte = Math.min(Math.max(parseInt(q.get('p') || '1', 10) || 1, 1), vid ? vid.partes : 1);
  var t0 = parseFloat(q.get('t') || '0') || 0;
  var el = document.getElementById('v'), msg = document.getElementById('msg');
  var hls = null;

  function aviso(t){ msg.textContent = t; msg.style.display = t ? 'flex' : 'none'; }
  if(!vid || !key){ aviso('Enlace incompleto. Pida a su facilitador el enlace del video.'); return; }

  document.getElementById('titulo').textContent = vid.titulo;
  var cont = document.getElementById('partes');
  for(var i = 1; i <= vid.partes; i++){
    (function(n){
      var b = document.createElement('button'); b.textContent = n; b.setAttribute('aria-label', 'Parte ' + n);
      b.onclick = function(){ cargar(n, 0); };
      cont.appendChild(b);
    })(i);
  }

  function url(n){ return BASE + '/' + key + '/' + vidId + '/parte' + String(n).padStart(2, '0') + '/index.m3u8'; }

  function marcar(){
    Array.prototype.forEach.call(cont.children, function(b, i){ b.setAttribute('aria-current', (i + 1 === parte) ? 'true' : 'false'); });
    document.getElementById('ant').disabled = parte <= 1;
    document.getElementById('sig').disabled = parte >= vid.partes;
  }

  function cargar(n, t){
    parte = n; aviso(''); marcar();
    var u = url(n);
    if(hls){ hls.destroy(); hls = null; }
    var iniciar = function(){ if(t) el.currentTime = t; el.playbackRate = parseFloat(document.getElementById('vel').value); };
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ maxBufferLength: 20 });
      hls.loadSource(u); hls.attachMedia(el);
      hls.on(Hls.Events.MANIFEST_PARSED, function(e, d){
        var sel = document.getElementById('cal'); sel.length = 1;
        d.levels.forEach(function(l, i){ var o = document.createElement('option'); o.value = i; o.textContent = l.height + 'p'; sel.appendChild(o); });
        iniciar();
      });
      hls.on(Hls.Events.ERROR, function(e, d){ if(d.fatal) aviso('No se pudo cargar el video. Revise su conexión o pida un enlace nuevo.'); });
    } else if(el.canPlayType('application/vnd.apple.mpegurl')){
      el.src = u; el.addEventListener('loadedmetadata', iniciar, { once: true });
      el.onerror = function(){ aviso('No se pudo cargar el video. Revise su conexión o pida un enlace nuevo.'); };
    } else { aviso('Este navegador no puede reproducir el video.'); }
  }

  document.getElementById('ant').onclick = function(){ if(parte > 1) cargar(parte - 1, 0); };
  document.getElementById('sig').onclick = function(){ if(parte < vid.partes) cargar(parte + 1, 0); };
  document.getElementById('vel').onchange = function(){ el.playbackRate = parseFloat(this.value); };
  document.getElementById('cal').onchange = function(){ if(hls) hls.currentLevel = parseInt(this.value, 10); };
  el.addEventListener('ended', function(){ if(parte < vid.partes) cargar(parte + 1, 0); });

  // La práctica puede incrustar este reproductor y pedirle saltar a un minuto: {saltar:{parte:3, seg:200}}
  window.addEventListener('message', function(ev){
    var d = ev.data && ev.data.saltar; if(!d) return;
    if(d.parte && d.parte !== parte) cargar(d.parte, d.seg || 0); else { el.currentTime = d.seg || 0; el.play(); }
  });

  cargar(parte, t0);
})();
</script>
</body>
</html>
