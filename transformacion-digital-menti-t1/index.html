<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mentimeter del Tema 1 | Herramientas de Transformación Digital</title>
<meta name="description" content="Actividad interactiva en vivo tipo Mentimeter sobre el Tema 1 (Transformación Digital e IA), en equipo. Vista de equipo para responder y vista de pantalla para el facilitador.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a4a; --navy-dark:#081326; --gold:#c9982f;
  --primary:#0f172a; --secondary:#334155; --muted:#64748b;
  --bg-body:#f4f7fb; --bg-card:#ffffff; --border-light:#e2e8f0; --border-dark:#cbd5e1;
  --green:#16a34a; --green-bg:#f0fdf4; --green-border:#22c55e;
  --amber:#b45309; --amber-bg:#fffbeb; --amber-border:#f59e0b;
  --red:#b91c1c; --red-bg:#fef2f2; --red-border:#ef4444;
  --blue-bg:#eff6ff; --blue-border:#3b82f6;
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.12), 0 4px 6px -4px rgba(0,0,0,.1);
}
[data-theme="dark"]{
  --navy:#5b9bd8; --primary:#f1f5f9; --secondary:#cbd5e1; --muted:#94a3b8;
  --bg-body:#0b1220; --bg-card:#151f2f; --border-light:#283249; --border-dark:#3a4666;
  --green-bg:#0c2417; --amber-bg:#2a2108; --red-bg:#2a1212; --blue-bg:#13233f;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg-body); color:var(--secondary); font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.6; min-height:100vh;}
a{color:var(--navy);}
.wrap{max-width:760px; margin:0 auto; padding:1.75rem 1rem calc(3rem + env(safe-area-inset-bottom));}
.wrap.presenter{max-width:1100px;}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-dark)); color:#fff; border-radius:var(--radius-lg); padding:1.75rem 1.75rem; margin-bottom:1.5rem; box-shadow:var(--shadow-lg);}
.hero .eyebrow{text-transform:uppercase; letter-spacing:.08em; font-size:.75rem; font-weight:700; opacity:.85;}
.hero h1{font-size:1.55rem; font-weight:800; margin:.35rem 0 .3rem;}
.hero p{margin:0; opacity:.92; font-size:.95rem;}
.card{background:var(--bg-card); padding:1.6rem; border-radius:var(--radius-lg); box-shadow:0 1px 2px rgba(0,0,0,.06); border:1px solid var(--border-light); margin-bottom:1.25rem;}
.field{margin-bottom:1rem;}
.field label{display:block; font-weight:700; font-size:.85rem; color:var(--primary); margin-bottom:.4rem;}
input[type=text]{width:100%; padding:.7rem .9rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); font-size:1rem; font-family:inherit; background:var(--bg-card); color:var(--primary);}
input[type=text]:focus{border-color:var(--navy); outline:none;}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-dark)); color:#fff; border:none; padding:.85rem 1.5rem; border-radius:var(--radius-md); font-weight:700; font-size:1rem; cursor:pointer; box-shadow:var(--shadow-md); font-family:inherit; width:100%;}
.btn-primary:disabled{opacity:.55; cursor:not-allowed;}
.btn-secondary{background:var(--bg-body); color:var(--navy); border:1px solid var(--navy); padding:.7rem 1.2rem; border-radius:var(--radius-md); font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit;}
.q-badge{display:inline-flex; align-items:center; gap:.4rem; background:var(--blue-bg); color:var(--navy); border:1px solid var(--blue-border); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; padding:.3rem .7rem; border-radius:999px; margin-bottom:.9rem;}
.q-text{font-size:1.25rem; font-weight:800; color:var(--primary); margin:0 0 1.2rem;}
.presenter .q-text{font-size:2rem; text-align:center;}
.mc-options{display:flex; flex-direction:column; gap:.6rem;}
.mc-opt{display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; border:2px solid var(--border-light); border-radius:var(--radius-md); background:var(--bg-body); cursor:pointer; font-size:1rem; font-weight:600; color:var(--primary); transition:border-color .15s ease, background .15s ease;}
.mc-opt:hover{border-color:var(--navy);}
.mc-opt.selected{border-color:var(--navy); background:var(--blue-bg);}
.mc-opt input{min-width:20px; min-height:20px;}
.wait-box{text-align:center; padding:2rem 1rem; color:var(--muted);}
.wait-box .big{font-size:2.4rem; margin-bottom:.5rem;}
.sent-box{text-align:center; padding:1.75rem 1rem;}
.sent-box .big{font-size:2.4rem; margin-bottom:.5rem;}
.bar-row{margin-bottom:1rem;}
.bar-label{display:flex; justify-content:space-between; font-size:.92rem; font-weight:700; color:var(--primary); margin-bottom:.3rem;}
.bar-track{height:34px; border-radius:8px; background:var(--border-light); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--navy),var(--gold)); border-radius:8px; transition:width .5s ease; display:flex; align-items:center; justify-content:flex-end; padding-right:.5rem; color:#fff; font-weight:800; font-size:.85rem; min-width:2.5rem;}
.cloud{display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; align-items:center; padding:1.5rem 0;}
.cloud-word{font-weight:800; color:var(--navy); line-height:1;}
[data-theme="dark"] .cloud-word{color:#7db8ea;}
.team-list{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.75rem;}
.team-chip{background:var(--blue-bg); color:var(--navy); border:1px solid var(--blue-border); border-radius:999px; padding:.35rem .8rem; font-size:.8rem; font-weight:700;}
.nav-row{display:flex; gap:.7rem; margin-top:1.5rem; flex-wrap:wrap;}
.nav-row button{flex:1; min-width:120px;}
.progress-dots{display:flex; gap:.35rem; justify-content:center; margin:1rem 0;}
.dot{width:9px; height:9px; border-radius:50%; background:var(--border-dark);}
.dot.active{background:var(--navy); width:22px; border-radius:5px;}
.icon-btn{background:none; border:1px solid var(--border-light); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:1rem; color:var(--secondary);}
.top-actions{display:flex; justify-content:flex-end; gap:.5rem; margin-bottom:.75rem;}
.badge-count{font-size:.78rem; color:var(--muted); text-align:center; margin-top:.5rem;}
footer{text-align:center; color:var(--muted); font-size:.78rem; padding:1.5rem 1rem;}
@media (prefers-reduced-motion: reduce){ .bar-fill{transition:none;} }
</style>
</head>
<body>
<div id="app" class="wrap">Cargando…</div>
<footer>INAP · Herramientas de Transformación Digital · Actividad en vivo del Tema 1 · Desarrollado por Johan Tapia, PhD.</footer>

<script>
(function(){
"use strict";
var PREGUNTAS = [{"id": "p1", "tipo": "nube", "texto": "En una palabra: ¿qué es para su equipo la Transformación Digital?"}, {"id": "p2", "tipo": "mc", "texto": "¿Cuál de estos conceptos es el MÁS amplio y profundo?", "opciones": ["Transformación digital", "Digitalización", "Informatización", "Automatización"]}, {"id": "p3", "tipo": "mc", "texto": "¿Qué institución es el ente rector de las TIC en el Poder Ejecutivo dominicano?", "opciones": ["OGTIC", "INDOTEL", "MAP", "DIGEIG"]}, {"id": "p4", "tipo": "nube", "texto": "Mencionen una herramienta de IA generativa que su equipo use o conozca"}, {"id": "p5", "tipo": "mc", "texto": "¿Qué es una \"alucinación\" en un modelo de IA generativa?", "opciones": ["Generar información falsa con apariencia de veracidad", "Procesar imágenes de forma autónoma", "Un error del servidor por sobrecarga", "Un proceso de entrenamiento del modelo"]}, {"id": "p6", "tipo": "escala", "texto": "Del 1 al 5, ¿qué tan preparada está su institución para el Gobierno Inteligente?", "opciones": ["1 · Apenas iniciando", "2", "3", "4", "5 · Muy avanzada"]}, {"id": "p7", "tipo": "mc", "texto": "¿Cuál es la secuencia histórica correcta de evolución tecnológica del Estado?", "opciones": ["Informatización → Digitalización → Gob. electrónico → Gob. digital → Gob. inteligente", "Digitalización → Informatización → Gob. digital → Gob. electrónico → Gob. inteligente", "Gob. electrónico → Informatización → Digitalización → Gob. digital → Gob. inteligente", "Informatización → Gob. electrónico → Digitalización → Gob. inteligente → Gob. digital"]}, {"id": "p8", "tipo": "nube", "texto": "Para cerrar: en una palabra, ¿qué necesita su institución para avanzar en transformación digital?"}];
var CURSO = 'transformacion-digital';
var BASE = 'https://n8n-inap.167.88.36.13.sslip.io/webhook';
var params = new URLSearchParams(location.search);
var esPresentador = params.get('presentador') === '1';

var app = document.getElementById('app');
if(esPresentador) app.classList.add('presenter');

function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
function esc(s){ var d = document.createElement('div'); d.textContent = String(s === undefined || s === null ? '' : s); return d.innerHTML; }

function fetchJSON(url, body){
  return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}

/* ---------- THEME ---------- */
(function(){
  var t = localStorage.getItem('tp_menti_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
})();

/* ============================================================
   VISTA FACILITADOR / PANTALLA
   ============================================================ */
function renderPresentador(){
  var sesion = localStorage.getItem('tp_menti_sesion') || '';
  if(!sesion){
    app.innerHTML =
      '<div class="hero"><p class="eyebrow">Panel del facilitador</p><h1>Iniciar sesión en vivo</h1>' +
      '<p>Elija un código corto para esta sesión (ej. el nombre del grupo). Los equipos deberán escribir el mismo código.</p></div>' +
      '<div class="card"><div class="field"><label for="cod-sesion">Código de la sesión</label>' +
      '<input type="text" id="cod-sesion" placeholder="Ej: PROPEPP-A" autocomplete="off"></div>' +
      '<button class="btn-primary" id="btn-crear-sesion">Iniciar sesión</button></div>';
    document.getElementById('btn-crear-sesion').addEventListener('click', function(){
      var v = document.getElementById('cod-sesion').value.trim();
      if(!v){ alert('Escriba un código para la sesión.'); return; }
      localStorage.setItem('tp_menti_sesion', v);
      renderPresentador();
    });
    return;
  }

  var idx = 0, revelado = false, resultadosTimer = null;

  function shell(){
    app.innerHTML =
      '<div class="hero"><p class="eyebrow">Pantalla del facilitador · Sesión: ' + esc(sesion) + '</p>' +
      '<h1 id="pres-titulo">Tema 1 — Transformación Digital e IA</h1>' +
      '<p>Proyecte esta pantalla. Los equipos responden desde sus celulares con el código <strong>' + esc(sesion) + '</strong>.</p></div>' +
      '<div class="card">' +
        '<span class="q-badge" id="pres-badge">Pregunta 1 / ' + PREGUNTAS.length + '</span>' +
        '<p class="q-text" id="pres-qtext"></p>' +
        '<div id="pres-resultado"></div>' +
        '<p class="badge-count" id="pres-count"></p>' +
      '</div>' +
      '<div class="nav-row">' +
        '<button class="btn-secondary" id="btn-prev">◀ Anterior</button>' +
        '<button class="btn-secondary" id="btn-revelar">👁️ Revelar a los equipos</button>' +
        '<button class="btn-secondary" id="btn-next">Siguiente ▶</button>' +
      '</div>' +
      '<div class="nav-row"><button class="btn-secondary" id="btn-cambiar-sesion">Cambiar código de sesión</button></div>';

    document.getElementById('btn-prev').addEventListener('click', function(){ irA(Math.max(0, idx - 1)); });
    document.getElementById('btn-next').addEventListener('click', function(){ irA(Math.min(PREGUNTAS.length - 1, idx + 1)); });
    document.getElementById('btn-revelar').addEventListener('click', function(){ revelado = !revelado; avanzar(); });
    document.getElementById('btn-cambiar-sesion').addEventListener('click', function(){
      if(confirm('Esto inicia una sesión nueva (código distinto). ¿Continuar?')){
        localStorage.removeItem('tp_menti_sesion');
        renderPresentador();
      }
    });
    pintarPregunta();
    cargarResultados();
    if(resultadosTimer) clearInterval(resultadosTimer);
    resultadosTimer = setInterval(cargarResultados, 2500);
  }

  function irA(n){ idx = n; revelado = false; avanzar(); }
  function avanzar(){
    fetchJSON(BASE + '/inap-menti-avanzar', { curso:CURSO, sesion:sesion, pregunta_actual: idx, revelado: revelado });
    pintarPregunta();
    cargarResultados();
  }
  function pintarPregunta(){
    var q = PREGUNTAS[idx];
    document.getElementById('pres-badge').textContent = 'Pregunta ' + (idx + 1) + ' / ' + PREGUNTAS.length;
    document.getElementById('pres-qtext').textContent = q.texto;
    var revBtn = document.getElementById('btn-revelar');
    revBtn.textContent = revelado ? '🙈 Ocultar de los equipos' : '👁️ Revelar a los equipos';
  }
  function cargarResultados(){
    var q = PREGUNTAS[idx];
    fetchJSON(BASE + '/inap-menti-resultados', { curso:CURSO, sesion:sesion, pregunta_id:q.id }).then(function(data){
      var respuestas = (data && data.respuestas) || [];
      document.getElementById('pres-count').textContent = respuestas.length + ' equipo(s) han respondido';
      var box = document.getElementById('pres-resultado');
      if(q.tipo === 'nube'){
        box.innerHTML = renderNube(respuestas);
      } else {
        box.innerHTML = renderBarras(q, respuestas);
      }
    }).catch(function(){});
  }
  shell();
}

/* ============================================================
   VISTA EQUIPO
   ============================================================ */
function renderEquipo(){
  var sesion = localStorage.getItem('tp_menti_sesion_equipo') || '';
  var equipo = localStorage.getItem('tp_menti_equipo') || '';
  if(!sesion || !equipo){
    app.innerHTML =
      '<div class="hero"><p class="eyebrow">Actividad en vivo · Tema 1</p><h1>Únanse como equipo</h1>' +
      '<p>Trabajo en equipo. Escriban el código de sesión que les dio el facilitador y el nombre de su equipo.</p></div>' +
      '<div class="card">' +
        '<div class="field"><label for="in-sesion">Código de sesión</label><input type="text" id="in-sesion" placeholder="Ej: PROPEPP-A" autocomplete="off"></div>' +
        '<div class="field"><label for="in-equipo">Nombre del equipo</label><input type="text" id="in-equipo" placeholder="Ej: Equipo Innovación" autocomplete="off"></div>' +
        '<button class="btn-primary" id="btn-unirse">Unirse a la sesión</button>' +
      '</div>';
    document.getElementById('btn-unirse').addEventListener('click', function(){
      var s = document.getElementById('in-sesion').value.trim();
      var e = document.getElementById('in-equipo').value.trim();
      if(!s || !e){ alert('Complete el código de sesión y el nombre del equipo.'); return; }
      localStorage.setItem('tp_menti_sesion_equipo', s);
      localStorage.setItem('tp_menti_equipo', e);
      renderEquipo();
    });
    return;
  }

  var estadoTimer = null, lastIdx = -1, lastRevelado = null, respondidoPreguntas = {};
  try{ respondidoPreguntas = JSON.parse(localStorage.getItem('tp_menti_respondido_' + sesion) || '{}'); }catch(e){}

  function guardarRespondido(){
    try{ localStorage.setItem('tp_menti_respondido_' + sesion, JSON.stringify(respondidoPreguntas)); }catch(e){}
  }

  function shell(){
    app.innerHTML =
      '<div class="hero"><p class="eyebrow">Sesión ' + esc(sesion) + ' · Equipo ' + esc(equipo) + '</p>' +
      '<h1>Tema 1 — Transformación Digital e IA</h1>' +
      '<p>Respondan cuando el facilitador muestre la pregunta en la pantalla.</p></div>' +
      '<div class="top-actions"><button class="icon-btn" id="btn-salir" title="Cambiar de equipo">🚪</button></div>' +
      '<div id="q-area" class="card"><div class="wait-box"><div class="big">⏳</div>Esperando al facilitador…</div></div>';
    document.getElementById('btn-salir').addEventListener('click', function(){
      if(confirm('¿Cambiar de equipo o de sesión?')){
        localStorage.removeItem('tp_menti_sesion_equipo');
        localStorage.removeItem('tp_menti_equipo');
        renderEquipo();
      }
    });
    poll();
    if(estadoTimer) clearInterval(estadoTimer);
    estadoTimer = setInterval(poll, 2000);
  }

  function poll(){
    fetchJSON(BASE + '/inap-menti-estado', { curso:CURSO, sesion:sesion }).then(function(data){
      var idx = (data && typeof data.pregunta_actual === 'number') ? data.pregunta_actual : 0;
      var revelado = !!(data && data.revelado);
      if(idx === lastIdx && revelado === lastRevelado) {
        if(revelado) actualizarResultadosSiRevelado(idx);
        return;
      }
      lastIdx = idx; lastRevelado = revelado;
      pintar(idx, revelado);
    }).catch(function(){});
  }

  function pintar(idx, revelado){
    var q = PREGUNTAS[idx];
    var area = document.getElementById('q-area');
    var yaRespondio = !!respondidoPreguntas[q.id];
    var dots = PREGUNTAS.map(function(_, i){ return '<span class="dot' + (i === idx ? ' active' : '') + '"></span>'; }).join('');

    if(yaRespondio){
      area.innerHTML =
        '<div class="progress-dots">' + dots + '</div>' +
        '<span class="q-badge">Pregunta ' + (idx + 1) + ' / ' + PREGUNTAS.length + '</span>' +
        '<p class="q-text">' + esc(q.texto) + '</p>' +
        '<div class="sent-box"><div class="big">✅</div>Ya enviaron su respuesta. Esperando la siguiente pregunta…</div>' +
        (revelado ? '<div id="resultado-equipo"></div>' : '');
      if(revelado) actualizarResultadosSiRevelado(idx);
      return;
    }

    var inner = '<div class="progress-dots">' + dots + '</div>' +
      '<span class="q-badge">Pregunta ' + (idx + 1) + ' / ' + PREGUNTAS.length + '</span>' +
      '<p class="q-text">' + esc(q.texto) + '</p>';

    if(q.tipo === 'mc' || q.tipo === 'escala'){
      inner += '<div class="mc-options" id="mc-options">' + q.opciones.map(function(op, i){
        return '<label class="mc-opt" data-i="' + i + '"><input type="radio" name="mcopt" value="' + esc(op) + '"> ' + esc(op) + '</label>';
      }).join('') + '</div>';
      inner += '<button class="btn-primary" id="btn-enviar" style="margin-top:1.1rem;" disabled>Enviar respuesta del equipo</button>';
    } else {
      inner += '<div class="field"><input type="text" id="in-respuesta" placeholder="Escriban su respuesta…" autocomplete="off" maxlength="60"></div>';
      inner += '<button class="btn-primary" id="btn-enviar">Enviar respuesta del equipo</button>';
    }
    area.innerHTML = inner;

    if(q.tipo === 'mc' || q.tipo === 'escala'){
      var opts = area.querySelectorAll('.mc-opt');
      opts.forEach(function(opt){
        opt.addEventListener('click', function(){
          opts.forEach(function(o){ o.classList.remove('selected'); });
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
          document.getElementById('btn-enviar').disabled = false;
        });
      });
    }

    document.getElementById('btn-enviar').addEventListener('click', function(){
      var respuesta = '';
      if(q.tipo === 'mc' || q.tipo === 'escala'){
        var checked = area.querySelector('input[name="mcopt"]:checked');
        if(!checked) return;
        respuesta = checked.value;
      } else {
        respuesta = document.getElementById('in-respuesta').value.trim();
        if(!respuesta){ alert('Escriban una respuesta antes de enviar.'); return; }
      }
      var btn = document.getElementById('btn-enviar');
      btn.disabled = true; btn.textContent = 'Enviando…';
      fetchJSON(BASE + '/inap-menti-responder', { curso:CURSO, sesion:sesion, pregunta_id:q.id, equipo:equipo, respuesta:respuesta })
        .then(function(){
          respondidoPreguntas[q.id] = true;
          guardarRespondido();
          pintar(idx, revelado);
        }).catch(function(){
          btn.disabled = false; btn.textContent = 'Enviar respuesta del equipo';
          alert('No se pudo enviar. Verifique su conexión e intente de nuevo.');
        });
    });
  }

  function actualizarResultadosSiRevelado(idx){
    var box = document.getElementById('resultado-equipo');
    if(!box) return;
    var q = PREGUNTAS[idx];
    fetchJSON(BASE + '/inap-menti-resultados', { curso:CURSO, sesion:sesion, pregunta_id:q.id }).then(function(data){
      var respuestas = (data && data.respuestas) || [];
      box.innerHTML = (q.tipo === 'nube') ? renderNube(respuestas) : renderBarras(q, respuestas);
    }).catch(function(){});
  }

  shell();
}

/* ---------- RENDER COMPARTIDO: barras y nube ---------- */
function renderBarras(q, respuestas){
  var counts = {};
  q.opciones.forEach(function(op){ counts[op] = 0; });
  respuestas.forEach(function(r){ counts[r.respuesta] = (counts[r.respuesta] || 0) + 1; });
  var total = respuestas.length || 1;
  return q.opciones.map(function(op){
    var n = counts[op] || 0;
    var pct = Math.round((n / total) * 100);
    return '<div class="bar-row"><div class="bar-label"><span>' + esc(op) + '</span><span>' + n + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(pct, n > 0 ? 6 : 0) + '%;">' + (n > 0 ? pct + '%' : '') + '</div></div></div>';
  }).join('');
}
function renderNube(respuestas){
  if(!respuestas.length) return '<p style="text-align:center; color:var(--muted);">Todavía no hay respuestas.</p>';
  var counts = {};
  respuestas.forEach(function(r){
    var w = (r.respuesta || '').trim();
    if(!w) return;
    var key = w.toLowerCase();
    counts[key] = counts[key] || { texto:w, n:0 };
    counts[key].n++;
  });
  var arr = Object.keys(counts).map(function(k){ return counts[k]; }).sort(function(a,b){ return b.n - a.n; });
  var max = arr[0] ? arr[0].n : 1;
  return '<div class="cloud">' + arr.map(function(w){
    var size = 1 + (w.n / max) * 2.2;
    return '<span class="cloud-word" style="font-size:' + size.toFixed(2) + 'rem;">' + esc(w.texto) + (w.n > 1 ? ' <small>(' + w.n + ')</small>' : '') + '</span>';
  }).join('') + '</div>' +
  '<div class="team-list">' + respuestas.map(function(r){ return '<span class="team-chip">' + esc(r.equipo) + '</span>'; }).join('') + '</div>';
}

if(esPresentador){ renderPresentador(); } else { renderEquipo(); }
})();
</script>
</body>
</html>
