<!doctype html>
<html lang="es">
<head>

<title>Calendario de asesor: tutorial paso a paso</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b1a4a;--ac:#E8B010;--tx:#eef2ff;--mut:#9fb0de;--pnl:#101f55;--lin:rgba(255,255,255,.14);--btn:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 38%,color-mix(in srgb,var(--bg) 70%,#3a63d6) 0%,var(--bg) 62%,#050c26 100%)}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:54px;z-index:5}
header img{height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{background:var(--btn);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--mut)}
.cta{background:var(--ac);color:#0b1a4a;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.book{transition:transform .6s ease;will-change:transform}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.page a.lk,#sheet a.lk{position:absolute;display:block;border-radius:3px;background:rgba(232,176,16,.0);transition:background .15s}
.page a.lk:hover,#sheet a.lk:hover{background:rgba(232,176,16,.28);outline:1px solid rgba(232,176,16,.7)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:84px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(255,255,255,.2)}.nav:disabled{opacity:.25;cursor:default}
#prev{left:8px}#next{right:8px}
#zoom{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;z-index:3;display:none}
#zoom.on{display:block}#zoom.drag{cursor:grabbing}
#sheet{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;background:#fff;box-shadow:0 10px 50px rgba(0,0,0,.55)}
#sheet .pp{position:relative;flex:none}
#sheet img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.zinfo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 14px;font-size:13px;z-index:6;display:none;pointer-events:none}
.zinfo.on{display:block}
footer{z-index:5;padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#scrub{width:100%;margin:0;accent-color:var(--ac);height:14px;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px;justify-content:space-between}
.grp{display:flex;align-items:center;gap:6px}
.credito{font-size:12px;color:var(--mut);white-space:nowrap}
.ib{width:42px;height:42px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:rgba(255,255,255,.2)}.ib.act{background:var(--ac);color:#0b1a4a}.ib:disabled{opacity:.3}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--mut);font-size:14px}
.pin input{width:54px;height:38px;border-radius:8px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);text-align:center;font:inherit}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,86vw);background:var(--pnl);border-right:1px solid var(--lin);z-index:8;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.4)}
#panel.on{transform:none}
.tabs{display:flex;border-bottom:1px solid var(--lin)}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 14px inherit;cursor:pointer}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs .x{flex:none;width:44px;font-size:20px}
.cont{flex:1;overflow:auto;padding:10px}
.cont[hidden]{display:none}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer}
.toc a:hover,.toc a.cur{background:var(--btn)}
.toc a span:last-child{color:var(--mut);flex:none}
.toc a.n2{padding-left:26px;font-size:14px}.toc a.n3{padding-left:42px;font-size:13px}
.vacio{color:var(--mut);padding:14px 6px}
.th{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th button{background:none;border:2px solid transparent;border-radius:8px;padding:4px;color:var(--mut);cursor:pointer;font:12px inherit}
.th button img{width:100%;display:block;border-radius:3px;background:#fff}
.th button.cur{border-color:var(--ac);color:var(--tx)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;margin-bottom:8px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--lin);padding:9px 6px;color:var(--tx);cursor:pointer;font:13px/1.4 inherit}
.res:hover{background:var(--btn)}.res b{color:var(--ac)}.res mark{background:var(--ac);color:#0b1a4a;border-radius:2px}
.acerca{border-top:1px solid var(--lin);padding:10px 14px;font-size:12px;color:var(--mut)}
#mas{position:absolute;right:8px;bottom:78px;background:var(--pnl);border:1px solid var(--lin);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#mas.on{display:flex}
#mas button,#mas a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;color:var(--tx);font:14px inherit;cursor:pointer;border-radius:8px;text-decoration:none;white-space:nowrap}
#mas button:hover,#mas a:hover{background:var(--btn)}
#mas svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:999px;z-index:20;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.m-only{display:none}
@media (max-width:640px){
 header{padding:6px 10px;gap:8px;min-height:48px}header h1{font-size:14px}header img{height:28px;max-width:80px}
 .cta{padding:6px 12px;font-size:13px}.d-only{display:none!important}.m-only{display:inline-flex}
 .nav{width:34px;height:64px}.credito{display:none}.ib{width:40px;height:40px}
 header .pg{display:none}.app.zo .nav{display:none}
 .app:not(.zo) #bZout{display:none}.bar,.grp{gap:4px}.ib{width:38px;height:38px}.pin{font-size:13px}.pin input{width:44px;height:36px}
}
:fullscreen header{min-height:44px}
</style>

<script>
"use strict";
const L = {"titulo": "Calendario de asesor: tutorial paso a paso", "autor": "Johan Tapia, PhD", "n": 12, "ratio": 0.70761, "paginas": [{"t": "TUTORIAL PASO A PASO Calendario de asesor de capacitación Aprende a ver quién está libre, asignar sesiones y llevar las horas de tus facilitadores, con capturas de la aplicación real. Con video de apoyo del Prof. Johan Tapia, PhD. Pulsa el botón dorado de arriba a la derecha para verlo. Calendario de asesor de capacitación · Johan Tapia, PhD 1 / 12", "l": []}, {"t": "Antes de empezar Qué es y cómo usar este libro El calendario junta los horarios de tus facilitadores para que no choquen. QUÉ RESUELVE Antes llevabas las horas de cada facilitador en Excel, Word y WhatsApp. Aquí todo queda en un solo lugar: ves quién está libre, asignas sesiones, cuentas horas y exportas sin repetir trabajo. PARA QUIÉN ES Asesores de capacitación (pasos 1 al 8) y facilitadores (página 11). Los datos de las capturas son ficticios. CÓMO LEER CADA PÁGINA Cada paso trae una captura con recuadros numerados en dorado: el número 1 es lo primero que miras o tocas. Debajo encuentras tres bloques fijos: Qué haces: las acciones, en orden. Definición: el término nuevo, explicado simple. ¿Por qué así?: la razón de hacerlo de esa forma. COLORES DEL CALENDARIO Libre · Ocupado (tu asesoría) · Ocupado (otro compromiso) · Bloqueado (Licencia) · Feriado oficial RUTA RECOMENDADA Entra (1) → mira la semana (2) → busca quién está libre (3) → revisa lo programado (4). Los pasos 5 al 8 los usas cuando tengas que crear facilitadores, cursos, cortes de horas o importar un horario. Calendario de asesor de capacitación · Johan Tapia, PhD 2 / 12", "l": []}, {"t": "Paso 1 de 8 Entra al sistema Tu puerta de entrada al calendario. QUÉ HACES 1. Abre el enlace del Calendario de asesor que te entregó tu coordinador. 2. Escribe tu correo o nombre de usuario y tu contraseña. El ojito te deja ver lo que escribes. 3. Pulsa Entrar al sistema. Si es tu primer ingreso, el sistema te pedirá cambiar la contraseña temporal. DEFINICIÓN Contraseña temporal: clave de un solo uso que te da el sistema para entrar la primera vez y que debes cambiar por una tuya. ¿POR QUÉ ASÍ? Cada asesor ve solo a sus facilitadores. Por eso el acceso es personal: nadie más debe usar tu cuenta. 1 Calendario de asesor de capacitación · Johan Tapia, PhD 3 / 12", "l": []}, {"t": "Paso 2 de 8 Semana de todos El horario de todos tus facilitadores en una sola pantalla. QUÉ HACES 1. En el menú de la izquierda pulsa Semana de todos. 2. Lee los colores de la leyenda: verde es Libre, azul Ocupado (tu asesoría), gris Ocupado (otro compromiso), Bloqueado (Licencia) y naranja Feriado oficial. 3. En la cuadrícula, cada día tiene una columna por facilitador y cada fila es una hora. Usa Semana anterior, Hoy y Semana siguiente, o los botones de cada día, para moverte. 4. Haz clic en un hueco + Libre para asignar una sesión. DEFINICIÓN Cuadrícula horaria: tabla con una fila por hora (de 08:00 a 22:00) y una columna por facilitador y día. ¿POR QUÉ ASÍ? Ver a todos juntos evita abrir un horario por persona y te deja detectar de un vistazo dónde hay espacio. 1 2 3 Calendario de asesor de capacitación · Johan Tapia, PhD 4 / 12", "l": []}, {"t": "Paso 3 de 8 ¿Quién está libre? Encuentra al facilitador disponible para una fecha y hora. QUÉ HACES 1. Pulsa ¿Quién está libre? en el menú. 2. Elige la fecha, la hora de inicio y la hora de fin. 3. Pulsa Consultar disponibilidad. 4. A la izquierda aparecen los facilitadores libres; a la derecha, los ocupados. En un facilitador libre pulsa + Asignar. DEFINICIÓN Choque de horario: cuando un facilitador ya tiene otra sesión en la misma franja que quieres asignar. ¿POR QUÉ ASÍ? Es más rápido preguntarle al sistema quién está libre que revisar semana por semana, y evita asignar a alguien que ya está comprometido. 1 2 Calendario de asesor de capacitación · Johan Tapia, PhD 5 / 12", "l": []}, {"t": "Paso 4 de 8 Horas disponibles y asignadas La lista de las sesiones ya programadas. QUÉ HACES 1. Pulsa Horas Disponibles. 2. En Filtros elige las fechas, el facilitador, el curso, el día de la semana, el intervalo y la jornada. Pulsa Aplicar filtros (o Limpiar filtros para empezar de nuevo). 3. Mira las tarjetas de resumen: horas disponibles, horas asignadas, total de horas y días en el rango. 4. Si necesitas llevarlo contigo, usa Exportar Excel, Exportar PDF, Imprimir o Sincronizar Calendario Móvil. DEFINICIÓN Sincronizar con el calendario móvil: publicar tus sesiones en un enlace que el calendario de tu celular lee y mantiene al día. ¿POR QUÉ ASÍ? Tener las sesiones en el celular te avisa a tiempo y evita olvidar una clase. 1 2 3 Calendario de asesor de capacitación · Johan Tapia, PhD 6 / 12", "l": []}, {"t": "Paso 5 de 8 Mis facilitadores Crea cuentas e invita a los facilitadores con quienes trabajas. QUÉ HACES 1. Pulsa Mis facilitadores. 2. Pulsa + Invitar / Crear facilitador: crea su cuenta con contraseña temporal o envía una solicitud si ya está registrado. 3. En la tabla revisa su estado (Activo o Invitación pendiente), sus cursos, sus horas totales y las horas pendientes. 4. Restablecer clave da una contraseña temporal nueva; Retirar termina el vínculo y Reactivar lo recupera. DEFINICIÓN Vínculo: la relación entre un asesor y un facilitador. Un facilitador puede tener varios asesores y debe aceptar la solicitud. ¿POR QUÉ ASÍ? El vínculo protege la privacidad: solo ves el horario de quienes aceptaron trabajar contigo. 1 2 Calendario de asesor de capacitación · Johan Tapia, PhD 7 / 12", "l": []}, {"t": "Paso 6 de 8 Cursos asignados Qué se imparte, quién lo imparte y cuántas horas tiene. QUÉ HACES 1. Pulsa Cursos asignados. 2. Para registrar uno nuevo pulsa + Nuevo curso y completa empresa, código, capacitación, modalidad, fechas, horas y facilitador. 3. Para encontrar uno usa el buscador y los filtros de modalidad y estado. 4. Un curso sin facilitador aparece como Sin asignar. Con Editar lo cambias. DEFINICIÓN Modalidad: la forma en que se imparte el curso, por ejemplo virtual o presencial. ¿POR QUÉ ASÍ? Llevar las fechas y las horas del curso aquí es lo que permite cuadrar después las horas de cada facilitador. 1 2 Calendario de asesor de capacitación · Johan Tapia, PhD 8 / 12", "l": []}, {"t": "Paso 7 de 8 Horas y pagos El control de las horas trabajadas por periodo. QUÉ HACES 1. Pulsa Horas y Pagos. 2. Para cerrar un periodo pulsa + Registrar corte de horas, elige facilitador, fechas de inicio y fin, y escribe una nota. 3. La fila nueva queda como Pendiente hasta que se liquide; entonces cambia su estado. 4. Usa los filtros para ver un facilitador o un estado. DEFINICIÓN Corte de horas: el cierre de un periodo (por ejemplo, un mes) con el total de horas que trabajó un facilitador. ¿POR QUÉ ASÍ? El sistema cuenta solo horas, no montos. Así el control es simple y no se mezclan cálculos de dinero. 1 2 Calendario de asesor de capacitación · Johan Tapia, PhD 9 / 12", "l": []}, {"t": "Paso 8 de 8 Importar y exportar horarios Trae el horario del SNFP sin escribirlo a mano. QUÉ HACES 1. Pulsa Importar / Exportar. 2. Copia la tabla de facilitadores del SNFP y pégala en el cuadro grande. 3. Pulsa Importar horario al sistema. 4. Para sacar tus datos usa Descargar CSV o Exportar enlace iCal (.ics). DEFINICIÓN Importar: copiar datos que ya existen en otro lugar (aquí, el SNFP) para que el sistema los registre solo. ¿POR QUÉ ASÍ? Al importar, el sistema salta los feriados y se detiene al completar las horas del curso, así que no tienes que contarlas a mano. 1 2 3 Calendario de asesor de capacitación · Johan Tapia, PhD 10 / 12", "l": []}, {"t": "Para facilitadores Si eres facilitador Tu cuenta tiene menos menús: solo lo tuyo. QUÉ HACES 1. En Mi horario ves tu semana y los huecos libres u ocupados. 2. En Mis cursos y horas revisas tus cursos y las horas acumuladas. 3. En Mis asesores aceptas o rechazas las solicitudes de vínculo y puedes retirar a un asesor. ¿POR QUÉ ASÍ? Tú decides con qué asesor     const im = document.createElement("img"); im.src = "p/" + pad(p + 1) + ".webp"; im.alt = "Página " + (p + 1);
