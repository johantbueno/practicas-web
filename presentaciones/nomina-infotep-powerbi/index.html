trl+C y Ctrl+V.", "l": []}, {"t": "57 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores y tarjetas (5) Etapa 1 · Segmentadores y tarjetas (6) Figura 12. Página «2. Estructura Salarial», etapa 1: segmentadores y tarjetas/primer visual (Sueldo bruto promedio, Mediana, Percentil 10, Percentil 90, Razón P90 / P10, Coef. de variación). Etapa 2 · Siguientes gráficos (1) 5 Reemplaza el campo por «Medidas > Bruto P10» (pozo «Campos»). 6 Título (Formato > General): «Percentil 10». 7 Tamaño y posición: X 436, Y 108, Ancho 198, Alto 88. 8 Percentil 90: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Bruto P90» (pozo «Campos»). 2 Título (Formato > General): «Percentil 90». 3 Tamaño y posición: X 644, Y 108, Ancho 198, Alto 88. 4 Razón P90 / P10: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Medidas > Razon P90 P10» (pozo «Campos»). 6 Título (Formato > General): «Razón P90 / P10». 7 Tamaño y posición: X 852, Y 108, Ancho 198, Alto 88. 8 Coef. de variación: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Coef Variacion» (pozo «Campos»). 2 Título (Formato > General): «Coef. de variación». 3 Tamaño y posición: X 1060, Y 108, Ancho 198, Alto 88. 4 Sueldo bruto promedio por nivel: En el panel Visualizaciones haz clic en el ícono «Gráfico de columnas agrupadas»; aparece un cuadro vacío en el lienzo. 1", "l": []}, {"t": "58 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 2 · Siguientes gráficos (2) Etapa 2 · Siguientes gráficos (3) Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Eje X». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Eje Y». 3 En Formato > General > Título escribe «Sueldo bruto promedio por nivel». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 204, Ancho 410, Alto 250. 5 Descuentos por nivel (ISR, AFP, SFS, otros): En el panel Visualizaciones haz clic en el ícono «Gráfico de barras apiladas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Eje Y». 2 Del panel Datos abre la tabla «Medidas» y arrastra «ISR Total» al pozo «Eje X». 3 Del panel Datos abre la tabla «Medidas» y arrastra «AFP Total» al pozo «Eje X». 4 Del panel Datos abre la tabla «Medidas» y arrastra «SFS Total» al pozo «Eje X». 5 Del panel Datos abre la tabla «Medidas» y arrastra «Otros Desc Total» al pozo «Eje X». 6 En Formato > General > Título escribe «Descuentos por nivel (ISR, AFP, SFS, otros)». 7 En Formato > General > Propiedades > Tamaño y posición escribe: X 440, Y 204, Ancho 410, Alto 250. 8 Departamentos: tamaño vs sueldo (burbuja = masa): En el panel Visualizaciones haz clic en el ícono «Gráfico de dispersión»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Depto» al pozo «Valores (detalle)». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Eje X». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Eje Y». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Masa Neta» al pozo «Tamaño». 5 En Formato > General > Título escribe «Departamentos: tamaño vs sueldo (burbuja = masa)». 6 En Formato > General > Propiedades > Tamaño y posición escribe: X 860, Y 204, Ancho 400, Alto 250. 7", "l": []}, {"t": "59 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 13. Página «2. Estructura Salarial», etapa 2: se agrega la primera mitad de los gráficos (Sueldo bruto promedio, Mediana, Percentil 10, Percentil 90, Razón P90 / P10, Coef. de variación, Sueldo bruto promedio por nivel, Descuentos por nivel (ISR, AFP, SFS, otros), Departamentos: tamaño vs sueldo (burbuja = masa)). Etapa 3 · Visuales restantes (1) Etapa 3 · Visuales restantes (2) Resumen por área funcional: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Area» al pozo «Columnas». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Mediana Bruto» al pozo «Columnas». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Masa Neta» al pozo «Columnas». 5 En Formato > General > Título escribe «Resumen por área funcional». 6 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 464, Ancho 620, Alto 248. 7 Rango salarial por género: En el panel Visualizaciones haz clic en el ícono «Gráfico de columnas agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Rango_Salarial» al pozo «Eje X». 2 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Leyenda». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Eje Y». 4 En Formato > General > Título escribe «Rango salarial por género». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 464, Ancho 610, Alto 248. 6", "l": []}, {"t": "60 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 14. Página «2. Estructura Salarial» terminada, modo oscuro. Ajustes finales Medir la dispersión El percentil 90 gana 4.5 veces el percentil 10 (137,060 vs 30,600) y el coeficiente de variación es 62.5 %: hay mucha diferencia entre los sueldos de la plantilla. Descuentos apilados El gráfico apila ISR, AFP, SFS y Otros descuentos: la suma de las partes es el descuento total del nivel. Ejercicio: Compara los niveles Con el gráfico «Sueldo bruto promedio por nivel», ¿qué nivel tiene el mayor promedio y cuántos empleados tiene? Pistas: - Usa los segmentadores o el tooltip del gráfico. - Alta Dirección tiene muy pocas personas. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». En «Sueldo bruto promedio por nivel» abre los tres puntos (…) > Ordenar eje > «Nivel» y elige el orden ascendente. 1 En «Rango salarial por género» abre los tres puntos (…) > Ordenar eje > «Rango_Salarial» y elige el orden ascendente. 2", "l": []}, {"t": "61 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · Página 2: Estructura Salarial 16. ¿Qué mide el percentil 90? A. El sueldo que supera al 90 % de los empleados B. El sueldo promedio C. El sueldo máximo 17. ¿Qué representa el tamaño de cada burbuja en el gráfico de dispersión de departamentos? A. La masa neta del departamento B. El número de columnas C. La región 18. ¿Cuál es la razón P90/P10? A. 4.5 veces B. 10 veces C. 1.2 veces Verifica la página 2 P10, P90 y mediana coinciden (31 mil, 137 mil y 86 mil) El gráfico de descuentos tiene 4 series La burbuja del mayor departamento (127 empleados) está a la derecha La tabla por área muestra 6 filas Curso de Power BI : Gráfico de Columnas o Barras✔️ El Tío Tech Refuerza este capítulo con una explicación en video. Gráfico de Dispersión en Power Bi | Curso gratis de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video. Columna Condicional para agrupar Rango de números | Curso de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 48.639, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=Jky6TQ6qda4"}, {"x": 51.18, "y": 48.639, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=-CDYIO77BcQ"}, {"x": 7.311, "y": 68.593, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=gfIzwWBLQOs"}]}, {"t": "62 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página de Equidad de Género paso a paso, mostrando tarjetas, gráficos y tablas que revelen brechas por nivel, área y región. Concepto · Brecha de género salarial Concepto: Es la diferencia entre lo que ganan en promedio las mujeres y los hombres. Definición: La brecha se calcula como (promedio mujeres − promedio hombres) ÷ promedio hombres. Uso: Con todos los datos es +7.5 %: las mujeres ganan RD$ 87,333 y los hombres RD$ 81,268 en promedio. Concepto · Efecto composición (paradoja de Simpson) Concepto: Es cuando el promedio general cuenta una historia distinta a la de cada grupo, porque los grupos tienen tamaños diferentes. Definición: El efecto composición ocurre cuando una tendencia global cambia o se invierte al separar los datos por subgrupos. Uso: Las mujeres son mayoría en cargos profesionales y técnicos (62 %), por eso el promedio global les favorece, aunque en Servicios Generales ganan 17 % menos. Concepto · Barras 100 % apiladas Concepto: Son barras del mismo largo donde solo importa cómo se reparte el 100 %. Definición: Muestran la proporción de cada categoría dentro de cada barra, sumando siempre 100 %. Uso: «Composición por género en cada área»: por ejemplo 70 % mujeres en Ingresos y Admisión. Concepto · Gráfico de cintas Concepto: Son columnas conectadas por cintas que muestran cómo suben o bajan los grupos de un rango a otro. Definición: Un gráfico de cintas ordena las categorías por valor en cada punto del eje y las une con cintas. Uso: «Género por rango salarial» muestra cuántas mujeres y hombres hay en cada rango. Concepto · SVG con DAX Concepto: Es dibujar con texto: una medida escribe las instrucciones de un dibujo y Power BI lo pinta. Definición: SVG es un formato de imágenes vectoriales descrito con texto; una medida DAX puede devolver ese texto y, con categoría «URL de imagen», se muestra como imagen. Uso: Las barras de la tabla, el medidor de % de mujeres y el semáforo de la brecha son medidas SVG. Se usan colores rgb() y funcionan dentro de tablas. Página 3: Equidad de Género Capítulo 7 · 30 min", "l": []}, {"t": "63 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Paso 0 · Crear la página y su título Etapa 1 · Segmentadores y tarjetas (1) Etapa 1 · Segmentadores y tarjetas (2) Etapa 1 · Segmentadores y tarjetas (3) Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «3. Equidad de Género». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Equidad de género en la nómina: brechas por nivel, área y región». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Región: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 410, Alto 66. 5 Nivel jerárquico: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Nivel» (pozo «Campo»). 2 Título (Formato > General): «Nivel jerárquico». 3 Tamaño y posición: X 440, Y 42, Ancho 410, Alto 66. 4 Área funcional: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Area» (pozo «Campo»). 6 Título (Formato > General): «Área funcional». 7 Tamaño y posición: X 860, Y 42, Ancho 400, Alto 66. 8 Mujeres: En el panel Visualizaciones haz clic en el ícono «Tarjeta»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «Mujeres» al pozo «Campos». 2 En Formato > Visual > Valor de globo (callout) pon tamaño 28 pt; apaga «Etiqueta de categoría». El color del número es #F43F8E. 3 En Formato > General > Título escribe «Mujeres». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 108, Ancho 198, Alto 88. 5", "l": []}, {"t": "64 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores y tarjetas (4) Etapa 1 · Segmentadores y tarjetas (5) Etapa 1 · Segmentadores y tarjetas (6) Hombres: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Hombres» (pozo «Campos»). 2 Título (Formato > General): «Hombres». 3 Tamaño y posición: X 228, Y 108, Ancho 198, Alto 88. 4 % Mujeres: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Medidas > Pct Mujeres» (pozo «Campos»). 6 Título (Formato > General): «% Mujeres». 7 Tamaño y posición: X 436, Y 108, Ancho 198, Alto 88. 8 Bruto prom. mujeres: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Bruto Prom Mujeres» (pozo «Campos»). 2 Título (Formato > General): «Bruto prom. mujeres». 3 Tamaño y posición: X 644, Y 108, Ancho 198, Alto 88. 4 Bruto prom. hombres: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Medidas > Bruto Prom Hombres» (pozo «Campos»). 6 Título (Formato > General): «Bruto prom. hombres». 7 Tamaño y posición: X 852, Y 108, Ancho 198, Alto 88. 8 Brecha de género: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Brecha Genero %» (pozo «Campos»). 2 Título (Formato > General): «Brecha de género». 3 Tamaño y posición: X 1060, Y 108, Ancho 198, Alto 88. 4", "l": []}, {"t": "65 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 15. Página «3. Equidad de Género», etapa 1: segmentadores y tarjetas/primer visual (Mujeres, Hombres, % Mujeres, Bruto prom. mujeres, Bruto prom. hombres, Brecha de género). Etapa 2 · Siguientes gráficos (1) Etapa 2 · Siguientes gráficos (2) Etapa 2 · Siguientes gráficos (3) Sueldo bruto promedio por nivel y género: En el panel Visualizaciones haz clic en el ícono «Gráfico de columnas agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Eje X». 2 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Leyenda». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Eje Y». 4 En Formato > General > Título escribe «Sueldo bruto promedio por nivel y género». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 204, Ancho 620, Alto 250. 6 Composición por género en cada área: En el panel Visualizaciones haz clic en el ícono «Gráfico de barras 100 % apiladas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Area» al pozo «Eje Y». 2 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Leyenda». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Eje X». 4 En Formato > General > Título escribe «Composición por género en cada área». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 204, Ancho 610, Alto 250. 6 % de mujeres por región: En el panel Visualizaciones haz clic en el ícono «Gráfico de columnas agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Eje X». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Pct Mujeres» al pozo «Eje Y». 3", "l": []}, {"t": "66 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 16. Página «3. Equidad de Género», etapa 2: se agrega la primera mitad de los gráficos (Mujeres, Hombres, % Mujeres, Bruto prom. mujeres, Bruto prom. hombres, Brecha de género, Sueldo bruto promedio por nivel y género, Composición por género en cada área, % de mujeres por región). Etapa 3 · Visuales restantes (1) Etapa 3 · Visuales restantes (2) Etapa 3 · Visuales restantes (3) En Formato > General > Título escribe «% de mujeres por región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 464, Ancho 410, Alto 248. 5 Género por rango salarial: En el panel Visualizaciones haz clic en el ícono «Gráfico de cintas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Rango_Salarial» al pozo «Eje X». 2 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Leyenda». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Eje Y». 4 En Formato > General > Título escribe «Género por rango salarial». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 440, Y 464, Ancho 410, Alto 248. 6 Participación de mujeres: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «Gauge Mujeres SVG» al pozo «Columnas». 2 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 3 En Formato > General > Título escribe «Participación de mujeres». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 860, Y 464, Ancho 190, Alto 248. 5 Semáforo de equidad: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1", "l": []}, {"t": "67 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 17. Página «3. Equidad de Género» terminada, modo oscuro. Ajustes finales Lee con cuidado La brecha global (+7.5 % a favor de las mujeres) NO significa que ganen más en un mismo cargo: ellas son mayoría en cargos profesionales y técnicos (62 %) y minoría en servicios generales (31 %), donde ellas ganan 17 % menos que ellos. Cargos con género marcado Los 87 choferes son todos hombres y el 75 % de los conserjes son mujeres: esa composición afecta los promedios. Ejercicio: Interpreta la brecha En el gráfico «Sueldo bruto promedio por nivel y género», ¿en qué nivel ganan menos las mujeres que los hombres y en cuál ganan más? Del panel Datos abre la tabla «Medidas» y arrastra «Badge Brecha SVG» al pozo «Columnas». 2 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 3 En Formato > General > Título escribe «Semáforo de equidad». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 1060, Y 464, Ancho 200, Alto 248. 5 En «Participación de mujeres»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 108 px. 1 En «Participación de mujeres»: define el ancho de imagen en 170 px. 2 En «Semáforo de equidad»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 105 px. 3 En «Semáforo de equidad»: define el ancho de imagen en 180 px. 4", "l": []}, {"t": "68 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Pistas: - Compara las columnas rosa (mujeres) y doradas (hombres) de cada nivel. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 3: Equidad de Género 19. ¿Qué es el efecto composición? A. Que el promedio global cambia por la mezcla de grupos, no solo por diferencias dentro de ellos B. Un error de la fórmula C. Un tipo de gráfico 20. ¿Cuál es la brecha de género con todos los datos? A. +7.5 % B. −7.5 % C. 0 % 21. ¿Qué muestra el gráfico de barras 100 % apiladas? A. La composición por género dentro de cada área B. El total de empleados por área C. El sueldo promedio por área Verifica la página 3 Mujeres 1,194, Hombres 993 y % Mujeres 54.6 % Brecha de género +7.5 % El medidor SVG muestra 55 % El semáforo dice «Mujeres 7.5 % más» Gráfico Circular, Columnas, Barras y Tablas Power BI | Curso de POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. Aplicar Formato a las Visualizaciones de Power BI (Gráficos, Tarjetas y Segmentación de datos) El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 67.346, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=zYqYF-9VyCQ"}, {"x": 51.18, "y": 67.346, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=9QDs3RliyjU"}]}, {"t": "69 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página de mapa geográfico que muestra la distribución de empleados por provincia y región, con filtros interactivos y ranking de regiones. Concepto · Azure Maps (mapa de burbujas) Concepto: Es un mapa real con círculos: cuanto más grande el círculo, más personas en ese lugar. Definición: Azure Maps es un visual de mapa que ubica datos por coordenadas o nombres y los dibuja como burbujas o capas. Uso: Cada burbuja es una provincia sede. Para ubicar una sola burbuja por provincia usamos las medidas Lat Sede y Lon Sede (promedio de Latitud y Longitud). Concepto · Categoría de datos Concepto: Es una etiqueta que le explica a Power BI qué significa una columna (por ejemplo, que es una latitud). Definición: La categoría de datos indica el tipo geográfico o de contenido de una columna o medida (Latitud, Longitud, URL de imagen). Uso: Latitud y Longitud tienen categoría geográfica; las medidas SVG tienen categoría «URL de imagen». Concepto · Gráfico de barras Concepto: Son barras horizontales, ideales cuando los nombres de las categorías son largos. Definición: Un gráfico de barras compara medidas entre categorías con barras horizontales. Uso: «Masa salarial neta por área» (página 1) y «Empleados por región» (página 4) comparan categorías con barras horizontales. Paso 0 · Crear la página y su título Página 4: Mapa Geográfico Capítulo 8 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «4. Mapa Geográfico». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Mapa de la plantilla: dónde trabaja el personal del INFOTEP». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5", "l": []}, {"t": "70 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores (1) Etapa 1 · Segmentadores (2) Etapa 1 · Segmentadores (3) Nivel jerárquico: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Nivel jerárquico». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 300, Alto 66. 5 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 2 Título (Formato > General): «Género». 3 Tamaño y posición: X 330, Y 42, Ancho 300, Alto 66. 4 Área funcional: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Area» (pozo «Campo»). 6 Título (Formato > General): «Área funcional». 7 Tamaño y posición: X 640, Y 42, Ancho 300, Alto 66. 8 Región: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Region» (pozo «Campo»). 2 Título (Formato > General): «Región». 3 Tamaño y posición: X 950, Y 42, Ancho 310, Alto 66. 4", "l": []}, {"t": "71 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 18. Página «4. Mapa Geográfico», etapa 1: segmentadores y tarjetas/primer visual (solo segmentadores). Etapa 2 · Siguientes gráficos (1) Etapa 2 · Siguientes gráficos (2) Plantilla por provincia sede (burbuja = empleados): En el panel Visualizaciones haz clic en el ícono «Azure Maps»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Provincia» al pozo «Ubicación». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Lon Sede» al pozo «Longitud». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Lat Sede» al pozo «Latitud». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Tamaño». 5 Del panel Datos abre la tabla «Medidas» y arrastra «Masa Neta» al pozo «Información sobre herramientas». 6 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Información sobre herramientas». 7 En Formato > General > Título escribe «Plantilla por provincia sede (burbuja = empleados)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 114, Ancho 800, Alto 598. 9 Empleados por región: En el panel Visualizaciones haz clic en el ícono «Gráfico de barras agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Eje Y». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Eje X». 3 En Formato > General > Título escribe «Empleados por región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 830, Y 114, Ancho 430, Alto 290. 5", "l": []}, {"t": "72 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 19. Página «4. Mapa Geográfico», etapa 2: se agrega la primera mitad de los gráficos (Plantilla por provincia sede (burbuja = empleados), Empleados por región). Etapa 3 · Visuales restantes Figura 20. Página «4. Mapa Geográfico» terminada, modo oscuro. Ranking de regiones: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Columnas». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Columnas». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Ranking Region» al pozo «Columnas». 5 En Formato > General > Título escribe «Ranking de regiones». 6 En Formato > General > Propiedades > Tamaño y posición escribe: X 830, Y 414, Ancho 430, Alto 298. 7", "l": []}, {"t": "73 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Ajustes finales Ubicaciones aproximadas El Excel no trae ubicación de cada empleado: se asignó la sede aproximada de cada regional y provincia. El mapa muestra dónde se concentran las sedes, no las casas. Medidas para las coordenadas Para dibujar una sola burbuja por provincia sede se crearon las medidas Lat Sede y Lon Sede (promedio de Latitud y Longitud de los empleados de esa provincia). Ver el mapa Si el mapa sale en blanco, comprueba tu conexión a internet y que Azure Maps esté habilitado en las opciones de seguridad. Ejercicio: Lee el mapa ¿Qué región tiene el segundo lugar en cantidad de empleados y cuántos tiene? Pistas: - Mira el gráfico «Empleados por región» o la tabla de ranking. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 4: Mapa Geográfico 22. ¿Por qué existen las medidas Lat Sede y Lon Sede? A. Para obtener una sola coordenada (promedio) por provincia sede B. Para cambiar el color del mapa C. Porque no existen columnas de latitud 23. ¿Qué representa el tamaño de cada burbuja? A. Cantidad de empleados de esa provincia sede B. El sueldo de una persona C. La distancia a Santo Domingo 24. ¿La ubicación del mapa es exacta para cada empleado? A. No, es la sede aproximada de su regional B. Sí, exacta C. Sí, de su casa En «Empleados por región» abre los tres puntos (…) > Ordenar eje > «Total Empleados» y elige el orden descendente. 1 En «Ranking de regiones» abre los tres puntos (…) > Ordenar eje > «Ranking Region» y elige el orden ascendente. 2", "l": []}, {"t": "74 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Verifica la página 4 El mapa muestra burbujas sobre Santo Domingo, Santiago, San Pedro de Macorís, Barahona y otras sedes El ranking de regiones empieza con Sede Nacional (762) El segmentador de Región filtra el mapa Visualización tipo Mapa en Power BI | Curso gratis de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video. Formato a las visualizaciones de tipo Mapa y segmentación (slicer) El Tío Tech Refuerza este capítulo con una explicación en video. Aplicar Formato Condicional a la visualización de Tipo Mapa Power BI El Tío Tech Refuerza este capítulo con una explicación en video. Curso de Power BI: Mapa Coroplético en Power BI Paso a Paso 🌍 El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 19.776, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=Zev9RTtNilU"}, {"x": 51.18, "y": 19.776, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=BdzX_yrXPyE"}, {"x": 7.311, "y": 39.731, "w": 41.725, "h": 18.351, "u": "https://www.youtube.com/watch?v=E4mSBFHStOQ"}, {"x": 51.18, "y": 39.731, "w": 41.725, "h": 18.351, "u": "https://www.youtube.com/watch?v=yGOGaBP4I0M"}]}, {"t": "75 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página de Zonas de Calor con mapas y visuales de Python para analizar la concentración geográfica de la plantilla. Concepto · Mapa de calor (densidad) Concepto: Es un mapa pintado como un termómetro: el color fuerte indica donde se junta mucha gente. Definición: Un mapa de calor estima la densidad de puntos y la colorea según cuántos hay por zona. Uso: La capa Heat Map de Azure Maps y el KDE de Python muestran que la plantilla se concentra en Santo Domingo, Santiago, San Pedro de Macorís y Barahona. Concepto · Visual de Python Concepto: Es un cuadro donde un programa en Python dibuja el gráfico con los datos que le diste. Definición: Un visual de Python ejecuta un script (pandas, matplotlib, seaborn...) sobre las columnas arrastradas y muestra la imagen resultante. Uso: Lo usamos para la densidad geográfica, el mapa de calor Región × Nivel, el PLS, Lorenz y la progresividad. Todos llevan la columna No para que no se eliminen filas repetidas. Concepto · Azure Maps (mapa de burbujas) Concepto: Es un mapa real con círculos: cuanto más grande el círculo, más personas en ese lugar. Definición: Azure Maps es un visual de mapa que ubica datos por coordenadas o nombres y los dibuja como burbujas o capas. Uso: Cada burbuja es una provincia sede. Para ubicar una sola burbuja por provincia usamos las medidas Lat Sede y Lon Sede (promedio de Latitud y Longitud). Paso 0 · Crear la página y su título Página 5: Zonas de Calor Capítulo 9 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «5. Zonas de Calor». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Zonas de calor: concentración geográfica de la plantilla (mapa nativo + Python)». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5", "l": []}, {"t": "76 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores (1) Etapa 1 · Segmentadores (2) Figura 21. Página «5. Zonas de Calor», etapa 1: segmentadores y tarjetas/primer visual (solo segmentadores). Etapa 2 · Siguientes gráficos Nivel jerárquico: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Nivel jerárquico». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 410, Alto 66. 5 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 2 Título (Formato > General): «Género». 3 Tamaño y posición: X 440, Y 42, Ancho 410, Alto 66. 4 Región: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Region» (pozo «Campo»). 6 Título (Formato > General): «Región». 7 Tamaño y posición: X 860, Y 42, Ancho 400, Alto 66. 8 Mapa de calor nativo (capa Heat Map de Azure Maps): En el panel Visualizaciones haz clic en el ícono «Azure Maps»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Ubicación». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Lon Punto» al pozo «Longitud». 3", "l": []}, {"t": "77 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 22. Página «5. Zonas de Calor», etapa 2: se agrega la primera mitad de los gráficos (Mapa de calor nativo (capa Heat Map de Azure Maps)). Etapa 3 · Visuales restantes (1) Etapa 3 · Visuales restantes (2) Del panel Datos abre la tabla «Medidas» y arrastra «Lat Punto» al pozo «Latitud». 4 En Formato > General > Título escribe «Mapa de calor nativo (capa Heat Map de Azure Maps)». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 114, Ancho 620, Alto 598. 6 Densidad geográfica (Python · scipy KDE): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Lat_Punto» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Lon_Punto» al pozo «Valores». 5 En el panel del script pega el contenido del archivo scripts\\py_mapa_calor.py y pulsa «Ejecutar script» (el botón ▶). 6 En Formato > General > Título escribe «Densidad geográfica (Python · scipy KDE)». 7 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 114, Ancho 610, Alto 290. 8 Calor: sueldo promedio Región × Nivel (Python · seaborn): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 6", "l": []}, {"t": "78 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 23. Página «5. Zonas de Calor» terminada, modo oscuro. Ajustes finales Dos formas de ver la densidad A la izquierda, la capa Heat Map de Azure Maps sobre un mapa real; a la derecha, un mapa de calor dibujado con Python (densidad KDE) sobre el contorno de la República Dominicana. Apaga las burbujas Para ver solo el calor, en Formato > Capas apaga la capa de burbujas y enciende la de mapa de calor; son capas independientes. Escala de color En el mapa de Región × Nivel se limita la escala al percentil 85 para que el nivel de Alta Dirección (solo 3 personas) no tape las diferencias. Ejercicio: Zonas calientes Mirando el mapa de calor, nombra las tres concentraciones más fuertes. En el panel del script pega el contenido del archivo scripts\\py_heat_region_nivel.py y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Calor: sueldo promedio Región × Nivel (Python · seaborn)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 414, Ancho 610, Alto 298. 9 En el mapa de calor, abre Formato > Capas: activa la capa «Mapa de calor» y apaga la capa «Burbujas». 1 En la capa de calor, define el radio en 30 píxeles. 2 En la capa de calor, color bajo (azul #1D4ED8). 3 En la capa de calor, color medio (rosa #F43F8E). 4 En la capa de calor, color alto (dorado #FBBF24). 5", "l": []}, {"t": "79 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Pistas: - Busca las manchas más intensas. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 5: Zonas de Calor 25. ¿Qué muestra un mapa de calor? A. Dónde se concentran más puntos B. Solo el relieve del terreno C. El sueldo de cada persona 26. ¿Por qué los visuales de Python incluyen la columna No? A. Para que Power BI no elimine filas repetidas B. Para ordenar alfabéticamente C. Para cambiar el idioma 27. ¿Qué debes hacer para ver los visuales de Python al abrir el archivo? A. Pulsar Habilitar en el aviso de scripts B. Reinstalar Power BI C. Nada, siempre se ven Verifica la página 5 El mapa nativo muestra manchas de calor sobre el mapa El visual de Python dibuja el contorno del país y la densidad La matriz Región × Nivel muestra números dentro de las celdas Los segmentadores filtran los tres visuales Para leer más Mapa de calor en Power BI con Azure Maps (Haufe-Akademie): https://www.haufe-akademie.de/skill- it/blog/power-bi-heatmap-tutorial Capas de Azure Maps: calor, agrupadas y de referencia (Wise Owl): https://www.wiseowl.co.uk/power- bi/blogs/power-bi-desktop/map/heat-clustered-reference-layers Crear visuales de Python en Power BI Desktop (Microsoft Learn): https://learn.microsoft.com/en-us/power- bi/desktop-python-visuals", "l": [{"x": 58.113, "y": 70.464, "w": 26.977, "h": 1.514, "u": "https://www.haufe-akademie.de/skill-it/blog/power-bi-heatmap-tutorial"}, {"x": 12.606, "y": 72.067, "w": 24.834, "h": 1.514, "u": "https://www.haufe-akademie.de/skill-it/blog/power-bi-heatmap-tutorial"}, {"x": 60.76, "y": 74.027, "w": 24.708, "h": 1.514, "u": "https://www.wiseowl.co.uk/power-bi/blogs/power-bi-desktop/map/heat-clustered-reference-layers"}, {"x": 12.606, "y": 75.631, "w": 46.516, "h": 1.514, "u": "https://www.wiseowl.co.uk/power-bi/blogs/power-bi-desktop/map/heat-clustered-reference-layers"}, {"x": 58.87, "y": 77.591, "w": 30.002, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}, {"x": 12.606, "y": 79.194, "w": 18.909, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}]}, {"t": "80 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página de análisis de regresión PLS para explicar el sueldo bruto. Concepto · PLS (mínimos cuadrados parciales) Concepto: Es una receta para predecir algo cuando tienes muchas pistas parecidas entre sí: primero las resume en pocas «ideas» y luego predice con ellas. Definición: La regresión PLS construye componentes latentes (combinaciones de las variables) que maximizan la relación con la variable a predecir. Uso: Predice log(Sueldo_Bruto) con 22 variables (nivel, género, región, área...). Resultado: R² 0.755 y Q² 0.749 con 3 componentes. Concepto · VIP (importancia de la variable) Concepto: Es una nota que dice cuánto pesó cada pista en la predicción. Definición: El VIP (Variable Importance in Projection) resume la importancia de cada variable en el modelo PLS; con VIP ≥ 1 se considera relevante. Uso: El nivel jerárquico tiene VIP 3.4: es el factor número uno para explicar el sueldo. Concepto · R² y Q² Concepto: R² es qué tan bien el modelo explica los datos que ya vio; Q² es qué tan bien predice datos que no vio. Definición: R² es la proporción de variación explicada; Q² la proporción predicha en validación cruzada (10 grupos). Uso: R² = 0.755 y Q² = 0.749: casi iguales, señal de que el modelo no está sobreajustado. Concepto · Componente latente Concepto: Es una «idea resumen» inventada a partir de varias variables, como «tamaño» resumiendo altura y peso. Definición: Un componente latente es una combinación lineal de variables originales que captura variación común. Uso: El gráfico de espacio latente dibuja cada empleado según los componentes 1 y 2; el 1 separa los niveles jerárquicos. Página 6: PLS Regresión Capítulo 10 · 30 min", "l": []}, {"t": "81 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Concepto · Visual de Python Concepto: Es un cuadro donde un programa en Python dibuja el gráfico con los datos que le diste. Definición: Un visual de Python ejecuta un script (pandas, matplotlib, seaborn...) sobre las columnas arrastradas y muestra la imagen resultante. Uso: Lo usamos para la densidad geográfica, el mapa de calor Región × Nivel, el PLS, Lorenz y la progresividad. Todos llevan la columna No para que no se eliminen filas repetidas. Paso 0 · Crear la página y su título Etapa 1 · Segmentadores y tarjetas (1) Etapa 1 · Segmentadores y tarjetas (2) Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «6. PLS Regresión». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Partial Least Squares (PLS): ¿qué factores explican el sueldo bruto?». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Nivel jerárquico: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Nivel jerárquico». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 410, Alto 66. 5 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 2 Título (Formato > General): «Género». 3 Tamaño y posición: X 440, Y 42, Ancho 410, Alto 66. 4 Región: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Region» (pozo «Campo»). 6 Título (Formato > General): «Región». 7 Tamaño y posición: X 860, Y 42, Ancho 400, Alto 66. 8", "l": []}, {"t": "82 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores y tarjetas (3) Etapa 1 · Segmentadores y tarjetas (4) Etapa 1 · Segmentadores y tarjetas (5) Figura 24. Página «6. PLS Regresión», etapa 1: segmentadores y tarjetas/primer visual (R² (ajuste), Q² (validación cruzada 10-fold), Componentes latentes, Variables predictoras). R² (ajuste): En el panel Visualizaciones haz clic en el ícono «Tarjeta»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «R2 PLS» al pozo «Campos». 2 En Formato > Visual > Valor de globo (callout) pon tamaño 28 pt; apaga «Etiqueta de categoría». El color del número es #22D3EE. 3 En Formato > General > Título escribe «R² (ajuste)». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 108, Ancho 300, Alto 88. 5 Q² (validación cruzada 10-fold): Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Q2 PLS» (pozo «Campos»). 2 Título (Formato > General): «Q² (validación cruzada 10-fold)». 3 Tamaño y posición: X 335, Y 108, Ancho 300, Alto 88. 4 Componentes latentes: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Medidas > Componentes PLS» (pozo «Campos»). 6 Título (Formato > General): «Componentes latentes». 7 Tamaño y posición: X 650, Y 108, Ancho 300, Alto 88. 8 Variables predictoras: Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Variables PLS» (pozo «Campos»). 2 Título (Formato > General): «Variables predictoras». 3 Tamaño y posición: X 965, Y 108, Ancho 295, Alto 88. 4", "l": []}, {"t": "83 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 2 · Siguientes gráficos (1) Etapa 2 · Siguientes gráficos (2) Figura 25. Página «6. PLS Regresión», etapa 2: se agrega la primera mitad de los gráficos (R² (ajuste), Q² (validación cruzada 10-fold), Componentes latentes, Variables predictoras, Importancia de variables: VIP (≥ 1 = relevante), Coeficientes de regresión PLS (estandarizados)). Etapa 3 · Visuales restantes (1) Importancia de variables: VIP (≥ 1 = relevante): En el panel Visualizaciones haz clic en el ícono «Gráfico de barras agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «PLS_VIP» y arrastra «Variable» al pozo «Eje Y». 2 Del panel Datos abre la tabla «PLS_VIP» y arrastra «Importante» al pozo «Leyenda». 3 Del panel Datos abre la tabla «Medidas» y arrastra «VIP» al pozo «Eje X». 4 En Formato > General > Título escribe «Importancia de variables: VIP (≥ 1 = relevante)». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 204, Ancho 430, Alto 508. 6 Coeficientes de regresión PLS (estandarizados): En el panel Visualizaciones haz clic en el ícono «Gráfico de barras agrupadas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «PLS_VIP» y arrastra «Variable» al pozo «Eje Y». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Coef PLS» al pozo «Eje X». 3 En Formato > General > Título escribe «Coeficientes de regresión PLS (estandarizados)». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 460, Y 464, Ancho 400, Alto 248. 5 Espacio latente PLS (componentes 1 y 2): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «PLS_T1» al pozo «Valores». 4", "l": []}, {"t": "84 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 3 · Visuales restantes (2) Etapa 3 · Visuales restantes (3) Del panel Datos abre la tabla «Empleados» y arrastra «PLS_T2» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Valores». 6 En el panel del script pega el contenido del archivo scripts\\py_pls_biplot.py y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Espacio latente PLS (componentes 1 y 2)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 460, Y 204, Ancho 400, Alto 250. 9 Observado vs predicho por PLS: En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «PLS_Predicho» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «PLS_Residuo» al pozo «Valores». 6 En el panel del script pega el contenido del archivo scripts\\py_pls_pred.py y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Observado vs predicho por PLS». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 870, Y 204, Ancho 390, Alto 250. 9 Q² por número de componentes (elección del modelo): En el panel Visualizaciones haz clic en el ícono «Gráfico de líneas»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «PLS_Componentes» y arrastra «Componentes» al pozo «Eje X». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Q2 Componente» al pozo «Eje Y». 3 En Formato > General > Título escribe «Q² por número de componentes (elección del modelo)». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 870, Y 464, Ancho 390, Alto 248. 5", "l": []}, {"t": "85 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 26. Página «6. PLS Regresión» terminada, modo oscuro. Ajustes finales Qué se predice El modelo PLS predice el logaritmo del sueldo bruto con 22 variables: nivel jerárquico, género, tamaño del departamento, región, área, si recibe otros ingresos y el % de otros descuentos. Los resultados del PLS son fijos R², Q² y los VIP se calcularon con todos los datos en Python; no cambian con los segmentadores. Los segmentadores solo filtran el espacio latente y el observado vs predicho. Lectura de resultados El nivel jerárquico (VIP 3.4) es el factor más importante. Q² = 0.749 casi igual a R² = 0.755: el modelo predice bien datos nuevos. Ejercicio: Interpreta el VIP En el gráfico de importancia de variables, ¿cuántas variables superan VIP ≥ 1 y cuál es la primera? Pistas: - Mira las barras rosadas. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». En «Importancia de variables: VIP (≥ 1 = relevante)» abre los tres puntos (…) > Ordenar eje > «VIP» y elige el orden descendente. 1 En «Coeficientes de regresión PLS (estandarizados)» abre los tres puntos (…) > Ordenar eje > «Coef PLS» y elige el orden descendente. 2", "l": []}, {"t": "86 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · Página 6: PLS Regresión 28. ¿Qué indica un VIP mayor o igual a 1? A. Que la variable es relevante para el modelo B. Que la variable tiene errores C. Que es una variable de texto 29. ¿Qué mide Q²? A. La capacidad de predecir datos no usados para ajustar el modelo B. El número de componentes C. El error de redondeo 30. ¿Cambian R² y Q² al usar el segmentador de Región? A. No, son resultados calculados con todos los datos B. Sí, siempre C. Solo en modo claro Verifica la página 6 Las tarjetas muestran R² 0.755, Q² 0.749, 3 componentes y 22 variables El gráfico VIP muestra el nivel jerárquico arriba El gráfico de Q² sube hasta 3 componentes y se aplana El espacio latente muestra elipses por nivel Para leer más PLS-SEM paso a paso con SmartPLS (Revista RIDE): https://mail.ride.org.mx/index.php/RIDE/article/view/336/1592 Regresión PLS aplicada a datos (Universidad Nacional de Colombia): https://repositorio.unal.edu.co/handle/unal/57110 Crear visuales de Python en Power BI Desktop (Microsoft Learn): https://learn.microsoft.com/en-us/power- bi/desktop-python-visuals", "l": [{"x": 12.606, "y": 53.36, "w": 44.751, "h": 1.514, "u": "https://mail.ride.org.mx/index.php/RIDE/article/view/336/1592"}, {"x": 12.606, "y": 56.923, "w": 35.927, "h": 1.514, "u": "https://repositorio.unal.edu.co/handle/unal/57110"}, {"x": 58.87, "y": 58.883, "w": 30.002, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}, {"x": 12.606, "y": 60.487, "w": 18.909, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}]}, {"t": "87 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página 7 del dashboard con los visuales de PLS-PM y comprender los conceptos clave. Concepto · PLS-PM (modelo de caminos) Concepto: Es un mapa de flechas que dice «A influye en B, y B influye en C», con un número en cada flecha. Definición: PLS-PM estima relaciones entre constructos latentes (cada uno medido por varios indicadores) y cuantifica cada camino con un coeficiente β. Uso: Cuatro constructos: Posición → Compensación → Carga financiera → Ingreso neto. Concepto · Constructo e indicador Concepto: El constructo es una idea que no se ve directamente (como «posición»); los indicadores son los datos que sí medimos para esa idea. Definición: Un constructo latente se mide con uno o varios indicadores observables. Uso: «Compensación» se mide con log(Sueldo_Bruto) y log(Ingreso_Total); «Posición» con nivel, tamaño del departamento y sede. Concepto · Coeficiente de camino β Concepto: Es el número sobre la flecha: cuánto cambia el destino cuando sube el origen. Definición: El coeficiente β estandarizado mide el efecto directo de un constructo sobre otro (en desviaciones estándar). Uso: Posición → Compensación β = +0.81. Compensación → Ingreso neto = +1.24 y Carga financiera → Ingreso neto = −0.93 (efecto supresor por colinealidad). Concepto · Carga externa Concepto: Dice qué tan bien un dato representa a la idea: cerca de 1 es una buena representación. Definición: La carga externa es la correlación entre un indicador y su constructo. Uso: Compensación: log Bruto 0.98 y log Ingreso total 0.98; Posición: Nivel 0.91, Tamaño de depto −0.58. Paso 0 · Crear la página y su título Página 7: PLS-PM Estructural Capítulo 11 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «7. PLS-PM Estructural». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «PLS-PM: modelo de ecuaciones estructurales (constructos latentes)». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4", "l": []}, {"t": "88 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Primeros visuales Figura 27. Página «7. PLS-PM Estructural», etapa 1: segmentadores y tarjetas/primer visual (Coeficientes de camino y R² por constructo destino). Etapa 2 · Siguientes gráficos En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Coeficientes de camino y R² por constructo destino: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Origen» al pozo «Columnas». 2 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Destino» al pozo «Columnas». 3 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Coeficiente_camino» al pozo «Columnas». 4 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «R2_destino» al pozo «Columnas». 5 En Formato > General > Título escribe «Coeficientes de camino y R² por constructo destino». 6 En Formato > General > Propiedades > Tamaño y posición escribe: X 820, Y 64, Ancho 440, Alto 270. 7 Cargas externas de los indicadores (outer loadings): En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «PLS_Cargas» y arrastra «Constructo» al pozo «Columnas». 2 Del panel Datos abre la tabla «PLS_Cargas» y arrastra «Indicador» al pozo «Columnas». 3 Del panel Datos abre la tabla «PLS_Cargas» y arrastra «Carga» al pozo «Columnas». 4 En Formato > General > Título escribe «Cargas externas de los indicadores (outer loadings)». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 820, Y 344, Ancho 440, Alto 368. 6", "l": []}, {"t": "89 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 28. Página «7. PLS-PM Estructural», etapa 2: se agrega la primera mitad de los gráficos (Coeficientes de camino y R² por constructo destino, Cargas externas de los indicadores (outer loadings)). Etapa 3 · Visuales restantes Figura 29. Página «7. PLS-PM Estructural» terminada, modo oscuro. Diagrama de caminos PLS-PM (β estandarizado, R²): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Origen» al pozo «Valores». 3 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Destino» al pozo «Valores». 4 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «Coeficiente_camino» al pozo «Valores». 5 Del panel Datos abre la tabla «PLS_Caminos» y arrastra «R2_destino» al pozo «Valores». 6 En el panel del script pega el contenido del archivo scripts\\py_pls_camino.py y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Diagrama de caminos PLS-PM (β estandarizado, R²)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 64, Ancho 790, Alto 648. 9", "l": []}, {"t": "90 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD El mapa de caminos Posición → Compensación (β +0.81, R² 0.65); Compensación → Carga financiera (+0.49); Compensación → Ingreso neto (+1.24) y Carga financiera → Ingreso neto (−0.93); R² del Ingreso neto = 0.86. Coeficientes mayores que 1 Los β de 1.24 y −0.93 pasan de 1 porque Compensación y Carga financiera están muy relacionadas (colinealidad): es un efecto supresor, no un error. Interpretación Quien tiene mayor posición cobra más, y a mayor ingreso se descuenta una parte mayor; el ingreso neto resulta de ambos efectos. Ejercicio: Lee un camino ¿Qué indica el coeficiente −0.93 de Carga financiera → Ingreso neto? Pistas: - Un coeficiente negativo indica relación inversa. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 7: PLS-PM Estructural 31. ¿Qué es un constructo latente? A. Una idea no observable directamente que se mide con varios indicadores B. Una columna de la tabla Empleados C. Un tipo de gráfico 32. ¿Cuál es el R² del Ingreso neto? A. 0.86 B. 0.65 C. 0.49 33. ¿Por qué hay coeficientes mayores que 1? A. Por la colinealidad entre constructos (efecto supresor) B. Por un error de carga C. Porque Power BI redondea mal", "l": []}, {"t": "91 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Verifica la página 7 El diagrama muestra 4 cajas y 6 flechas con su β Las cajas muestran R² 0.65, 0.49 y 0.86 La tabla de caminos tiene 6 filas La tabla de cargas tiene 9 filas Para leer más PLS-SEM paso a paso con SmartPLS (Revista RIDE): https://mail.ride.org.mx/index.php/RIDE/article/view/336/1592 Regresión PLS aplicada a datos (Universidad Nacional de Colombia): https://repositorio.unal.edu.co/handle/unal/57110", "l": [{"x": 12.606, "y": 25.388, "w": 44.751, "h": 1.514, "u": "https://mail.ride.org.mx/index.php/RIDE/article/view/336/1592"}, {"x": 12.606, "y": 28.952, "w": 35.927, "h": 1.514, "u": "https://repositorio.unal.edu.co/handle/unal/57110"}]}, {"t": "92 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página 8 con visuales de R que analicen la nómina: violín + caja, correlación Spearman y brecha de género. Concepto · Visual de R Concepto: Igual que el de Python, pero el programa que dibuja está escrito en el lenguaje R. Definición: Un visual de R ejecuta un script de R (por ejemplo con ggplot2) y muestra la imagen. Uso: Violín y caja del sueldo por nivel y género, matriz de correlaciones de Spearman y mancuernas de brecha por área. Concepto · Violín y caja (boxplot) Concepto: El violín es una silueta que se ensancha donde hay más personas; la caja marca la mediana y los cuartiles. Definición: El violín dibuja la densidad de la distribución; la caja muestra mediana, cuartiles y valores atípicos. Uso: Comparan el sueldo de mujeres y hombres dentro de cada nivel en escala logarítmica. Concepto · Correlación de Spearman Concepto: Es un número entre −1 y 1 que dice si dos cosas suben juntas (1), al revés (−1) o no se relacionan (0), mirando solo el orden. Definición: El coeficiente de Spearman mide la relación monótona entre dos variables usando sus rangos. Uso: Sueldo_Bruto y ISR tienen 0.97: a mayor sueldo, mayor ISR. Paso 0 · Crear la página y su título Etapa 1 · Segmentadores (1) Página 8: Analítica con R Capítulo 12 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para
