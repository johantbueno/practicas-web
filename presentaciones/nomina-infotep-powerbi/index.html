n Power BI · Desarrollado por Johan Tapia, PhD Etapa 2 · Visuales restantes (1) Etapa 2 · Visuales restantes (2) Etapa 2 · Visuales restantes (3) Violín + caja del sueldo bruto por nivel y género (R · ggplot2): En el panel Visualizaciones haz clic en el ícono «Visual de script de R (ícono «R»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 6 En el panel del script pega el contenido del archivo scripts\\r_violin_nivel.r y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Violín + caja del sueldo bruto por nivel y género (R · ggplot2)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 110, Ancho 620, Alto 602. 9 Matriz de correlaciones de Spearman (R · ggplot2): En el panel Visualizaciones haz clic en el ícono «Visual de script de R (ícono «R»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Otros_Ingresos» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «ISR» al pozo «Valores». 6 Del panel Datos abre la tabla «Empleados» y arrastra «AFP» al pozo «Valores». 7 Del panel Datos abre la tabla «Empleados» y arrastra «SFS» al pozo «Valores». 8 Del panel Datos abre la tabla «Empleados» y arrastra «Otros_Descuentos» al pozo «Valores». 9 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Neto» al pozo «Valores». 10 Del panel Datos abre la tabla «Empleados» y arrastra «Pct_Descuento» al pozo «Valores». 11 Del panel Datos abre la tabla «Empleados» y arrastra «Tam_Depto» al pozo «Valores». 12 En el panel del script pega el contenido del archivo scripts\\r_correlacion.r y pulsa «Ejecutar script» (el botón ▶). 13 En Formato > General > Título escribe «Matriz de correlaciones de Spearman (R · ggplot2)». 14 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 110, Ancho 610, Alto 300. 15 Brecha de género por área (R · ggplot2): En el panel Visualizaciones haz clic en el ícono «Visual de script de R (ícono «R»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2", "l": []}, {"t": "95 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 31. Página «8. Analítica con R» terminada, modo oscuro. Para qué un visual de R ggplot2 permite gráficos estadísticos finos (violines, mapas de calor de correlación, mancuernas) que no vienen entre los visuales estándar. Filas duplicadas Igual que en Python, Power BI elimina filas repetidas antes de pasar los datos al script; por eso cada visual incluye la columna No. Escala logarítmica Los sueldos van de 30 mil a 718 mil; con escala logarítmica los grupos de menor sueldo no se aplastan. Ejercicio: Lee la correlación En la matriz de Spearman, ¿qué valor tienen Sueldo_Bruto e ISR y qué significa? Pistas: - Busca la celda que cruza ambas variables. Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Area» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Valores». 5 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 6 En el panel del script pega el contenido del archivo scripts\\r_mancuerna.r y pulsa «Ejecutar script» (el botón ▶). 7 En Formato > General > Título escribe «Brecha de género por área (R · ggplot2)». 8 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 420, Ancho 610, Alto 292. 9", "l": []}, {"t": "96 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 8: Analítica con R 34. ¿Qué hace un violín en un gráfico? A. Muestra la forma (densidad) de la distribución de los datos B. Dibuja el promedio exacto C. Cuenta las filas 35. ¿Qué significa una correlación de Spearman cercana a 1? A. Que a mayor valor de una variable, mayor valor de la otra B. Que no hay relación C. Que la relación es inversa 36. ¿Por qué se usa escala logarítmica en el violín? A. Porque los sueldos van de 30 mil a 718 mil B. Para que el gráfico sea más bonito C. Porque R no admite otra escala Verifica la página 8 El violín muestra los 5 niveles con mujeres y hombres La matriz de correlaciones tiene 9 variables El gráfico de mancuernas muestra 6 áreas Los segmentadores actualizan los tres visuales Para leer más Crear y usar visuales de R en Power BI (ExcelDemy): https://www.exceldemy.com/creating-and-using-r- visuals-in-power-bi/", "l": [{"x": 49.667, "y": 66.455, "w": 36.431, "h": 1.514, "u": "https://www.exceldemy.com/creating-and-using-r-visuals-in-power-bi/"}, {"x": 12.606, "y": 68.059, "w": 14.497, "h": 1.514, "u": "https://www.exceldemy.com/creating-and-using-r-visuals-in-power-bi/"}]}, {"t": "97 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Aprender a usar visuales de Python para analizar desigualdad y progresividad en la nómina. Concepto · Curva de Lorenz y Gini Concepto: La curva muestra qué parte del dinero se lleva el grupo más pobre; si fuera igual para todos sería una diagonal recta. Definición: El índice de Gini resume la desigualdad entre 0 (igualdad total) y 1 (un solo individuo tiene todo). Uso: El Gini del sueldo bruto es 0.300: desigualdad moderada. Concepto · Progresividad de los descuentos Concepto: Es que quien gana más aporta una parte mayor de su ingreso. Definición: Un descuento es progresivo si el porcentaje del ingreso que se descuenta crece con el ingreso. Uso: El descuento sube de 29.9 % (30–50 mil) a 40.5 % (120–200 mil). Concepto · Visual de Python Concepto: Es un cuadro donde un programa en Python dibuja el gráfico con los datos que le diste. Definición: Un visual de Python ejecuta un script (pandas, matplotlib, seaborn...) sobre las columnas arrastradas y muestra la imagen resultante. Uso: Lo usamos para la densidad geográfica, el mapa de calor Región × Nivel, el PLS, Lorenz y la progresividad. Todos llevan la columna No para que no se eliminen filas repetidas. Paso 0 · Crear la página y su título Etapa 1 · Segmentadores (1) Página 9: Analítica con Python Capítulo 13 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «9. Analítica con Python». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Analítica avanzada con Python: desigualdad (Lorenz/Gini) y progresividad». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Región: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Campo». 2", "l": []}, {"t": "98 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores (2) Etapa 1 · Segmentadores (3) Figura 32. Página «9. Analítica con Python», etapa 1: segmentadores y tarjetas/primer visual (solo segmentadores). En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 300, Alto 66. 5 Nivel jerárquico: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Nivel» (pozo «Campo»). 2 Título (Formato > General): «Nivel jerárquico». 3 Tamaño y posición: X 330, Y 42, Ancho 300, Alto 66. 4 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 6 Título (Formato > General): «Género». 7 Tamaño y posición: X 640, Y 42, Ancho 300, Alto 66. 8 Área funcional: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Area» (pozo «Campo»). 2 Título (Formato > General): «Área funcional». 3 Tamaño y posición: X 950, Y 42, Ancho 310, Alto 66. 4", "l": []}, {"t": "99 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 2 · Visuales restantes (1) Etapa 2 · Visuales restantes (2) Figura 33. Página «9. Analítica con Python» terminada, modo oscuro. Curva de Lorenz y Gini por género (Python · numpy): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Sueldo_Bruto» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Genero» al pozo «Valores». 5 En el panel del script pega el contenido del archivo scripts\\py_lorenz.py y pulsa «Ejecutar script» (el botón ▶). 6 En Formato > General > Título escribe «Curva de Lorenz y Gini por género (Python · numpy)». 7 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 110, Ancho 620, Alto 602. 8 Progresividad de los descuentos (Python · hexbin): En el panel Visualizaciones haz clic en el ícono «Visual de script de Python (ícono «Py»)»; aparece un cuadro vacío en el lienzo. 1 Si Power BI lo pide, pulsa «Habilitar» (y confirma que Python/R están configurados en Archivo > Opciones). 2 Del panel Datos abre la tabla «Empleados» y arrastra «No» al pozo «Valores». 3 Del panel Datos abre la tabla «Empleados» y arrastra «Ingreso_Total» al pozo «Valores». 4 Del panel Datos abre la tabla «Empleados» y arrastra «Pct_Descuento» al pozo «Valores». 5 En el panel del script pega el contenido del archivo scripts\\py_isr_progresivo.py y pulsa «Ejecutar script» (el botón ▶). 6 En Formato > General > Título escribe «Progresividad de los descuentos (Python · hexbin)». 7 En Formato > General > Propiedades > Tamaño y posición escribe: X 650, Y 110, Ancho 610, Alto 602. 8", "l": []}, {"t": "100 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Qué dice el Gini Gini de 0.300 para el sueldo bruto (mujeres 0.284 y hombres 0.317): desigualdad moderada y algo menor entre las mujeres. Progresividad El % del ingreso que se descuenta sube de 29.9 % (30–50 mil) a 40.5 % (120–200 mil) y 38.4 % (más de 200 mil). Hexbin Cada hexágono cuenta empleados en una zona del gráfico; el color usa escala logarítmica para ver las zonas con pocos empleados. Ejercicio: Compara la desigualdad En la curva de Lorenz, ¿en qué género es menor el Gini? Pistas: - Lee la leyenda del gráfico. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 9: Analítica con Python 37. ¿Qué mide el índice de Gini? A. La desigualdad, de 0 (igualdad total) a 1 (máxima desigualdad) B. El sueldo promedio C. El número de empleados 38. ¿Qué significa que los descuentos sean progresivos? A. Que quien gana más descuenta un porcentaje mayor de su ingreso B. Que todos descuentan lo mismo C. Que los descuentos bajan con el sueldo 39. ¿Qué representa la línea rosada del gráfico de progresividad? A. La mediana móvil del % descontado B. El sueldo mínimo C. El total de empleados Verifica la página 9 La curva de Lorenz muestra Todos, Femenino y Masculino con su Gini El hexbin muestra el % descontado entre 0 y 100 La línea de mediana sube con el ingreso Los segmentadores cambian ambos gráficos", "l": []}, {"t": "101 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Para leer más Crear visuales de Python en Power BI Desktop (Microsoft Learn): https://learn.microsoft.com/en-us/power- bi/desktop-python-visuals", "l": [{"x": 58.87, "y": 8.463, "w": 30.002, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}, {"x": 12.606, "y": 10.155, "w": 18.909, "h": 1.514, "u": "https://learn.microsoft.com/en-us/power-bi/desktop-python-visuals"}]}, {"t": "102 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página 10 con gráficos SVG y un dashboard web interactivo. Concepto · SVG con DAX Concepto: Es dibujar con texto: una medida escribe las instrucciones de un dibujo y Power BI lo pinta. Definición: SVG es un formato de imágenes vectoriales descrito con texto; una medida DAX puede devolver ese texto y, con categoría «URL de imagen», se muestra como imagen. Uso: Las barras de la tabla, el medidor de % de mujeres y el semáforo de la brecha son medidas SVG. Se usan colores rgb() y funcionan dentro de tablas. Concepto · Vínculo (acción) de un visual Concepto: Es decirle a un cuadro: «cuando alguien te toque, haz esto». Definición: La acción de un visual puede navegar a otra página, abrir una dirección web o aplicar un marcador. Uso: El botón «Abrir el dashboard HTML» usa un vínculo web; los botones ☀/☾ usan navegación de página. Concepto · Tabla con imágenes Concepto: Es una tabla donde una de las columnas, en lugar de números, muestra dibujos. Definición: Las tablas pueden mostrar medidas de categoría «URL de imagen» como imágenes dentro de las celdas. Uso: En la página 11 cada cargo muestra una barra dorada con su sueldo promedio. Paso 0 · Crear la página y su título Etapa 1 · Primeros visuales (1) Página 10: HTML y SVG Capítulo 14 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «10. HTML y SVG». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Gráficos vectoriales (SVG con DAX) y dashboard web interactivo (HTML)». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Región: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Campo». 2", "l": []}, {"t": "103 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Primeros visuales (2) Etapa 1 · Primeros visuales (3) Etapa 1 · Primeros visuales (4) En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 410, Alto 66. 5 Nivel jerárquico: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Nivel» (pozo «Campo»). 2 Título (Formato > General): «Nivel jerárquico». 3 Tamaño y posición: X 440, Y 42, Ancho 410, Alto 66. 4 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 6 Título (Formato > General): «Género». 7 Tamaño y posición: X 860, Y 42, Ancho 400, Alto 66. 8 Tabla con barras SVG generadas por una medida DAX: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Columnas». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Columnas». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Barra Masa SVG» al pozo «Columnas». 5 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 6 En Formato > General > Título escribe «Tabla con barras SVG generadas por una medida DAX». 7 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 114, Ancho 720, Alto 380. 8 Medidor SVG: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «Gauge Mujeres SVG» al pozo «Columnas». 2 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 3 En Formato > General > Título escribe «Medidor SVG». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 750, Y 114, Ancho 250, Alto 190. 5", "l": []}, {"t": "104 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 34. Página «10. HTML y SVG», etapa 1: segmentadores y tarjetas/primer visual (Tabla con barras SVG generadas por una medida DAX, Medidor SVG). Etapa 2 · Siguientes gráficos (1) Etapa 2 · Siguientes gráficos (2) Etapa 2 · Siguientes gráficos (3) Semáforo SVG: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «Badge Brecha SVG» al pozo «Columnas». 2 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 3 En Formato > General > Título escribe «Semáforo SVG». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 1010, Y 114, Ancho 250, Alto 190. 5 Empleados filtrados: En el panel Visualizaciones haz clic en el ícono «Tarjeta»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Campos». 2 En Formato > Visual > Valor de globo (callout) pon tamaño 28 pt; apaga «Etiqueta de categoría». El color del número es #22D3EE. 3 En Formato > General > Título escribe «Empleados filtrados». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 750, Y 314, Ancho 250, Alto 90. 5 Masa neta (RD$): Selecciona la primera tarjeta y duplícala con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Medidas > Masa Neta» (pozo «Campos»). 2 Título (Formato > General): «Masa neta (RD$)». 3 Tamaño y posición: X 1010, Y 314, Ancho 250, Alto 90. 4", "l": []}, {"t": "105 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 35. Página «10. HTML y SVG», etapa 2: se agrega la primera mitad de los gráficos (Tabla con barras SVG generadas por una medida DAX, Medidor SVG, Semáforo SVG, Empleados filtrados, Masa neta (RD$)). Ajustes finales Notas y botón de la página Cómo funciona Una medida devuelve texto SVG («data:image/svg+xml;utf8,<svg ...>») con categoría de datos «URL de imagen»; Power BI lo muestra como imagen dentro de la tabla. Usamos colores rgb() para evitar problemas con el símbolo #. En «Tabla con barras SVG generadas por una medida DAX»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 22 px. 1 En «Tabla con barras SVG generadas por una medida DAX»: define el ancho de imagen en 220 px. 2 En «Medidor SVG»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 150 px. 3 En «Medidor SVG»: define el ancho de imagen en 235 px. 4 En «Semáforo SVG»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 150 px. 5 En «Semáforo SVG»: define el ancho de imagen en 235 px. 6 Nota explicativa: Insertar > Cuadro de texto, escribe el texto de la nota y colócalo en X 750, Y 414, Ancho 510, Alto 80. 1 En la cinta Insertar > Botones > En blanco. En Formato > Estilo escribe el texto «ABRIR EL DASHBOARD HTML INTERACTIVO» y pon el relleno cian #22D3EE. 2 En Formato > Acción activa la acción, tipo «Dirección URL web» y pega la ruta del archivo html\\nomina_interactivo.html (file:///...). 3 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 508, Ancho 720, Alto 70. 4 Nota explicativa: Insertar > Cuadro de texto, escribe el texto de la nota y colócalo en X 20, Y 590, Ancho 1240, Alto 122. 5", "l": []}, {"t": "106 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Dónde funcionan Las imágenes SVG de medidas se ven en tablas y matrices; en las tarjetas nuevas no se dibujan (solo aparece el texto), por eso el medidor y el semáforo van dentro de una tabla de una sola celda. El botón del HTML En clase usa un Botón (Insertar > Botones > En blanco) con Formato > Acción de tipo «Dirección URL web» apuntando al archivo html\\nomina_interactivo.html. En el archivo terminado se hizo con un cuadro de texto con vínculo, que funciona igual. Ejercicio: Cambia el color Edita la medida Gauge Mujeres SVG para que el arco use verde (rgb(52,211,153)) en lugar del rosado. Pistas: - Busca stroke='rgb(244,63,142)' en la segunda ruta (path). Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 10: HTML y SVG 40. ¿Qué categoría de datos necesita una medida SVG? A. URL de imagen B. Texto C. Latitud 41. ¿Qué devuelve una medida SVG? A. Un texto con las instrucciones del dibujo B. Un número C. Una fecha 42. ¿Qué hace el botón de la página? A. Abre el dashboard HTML en el navegador B. Cierra Power BI C. Aplica un segmentador Verifica la página 10 La tabla muestra barras cian junto a cada región El medidor muestra 55 % El semáforo muestra «Mujeres 7.5 % más» El botón abre el HTML", "l": []}, {"t": "107 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Para leer más Cómo crear medidas DAX con SVG en Power BI (Chandoo): https://chandoo.org/wp/how-to-svg-dax- measures-power-bi", "l": [{"x": 55.214, "y": 8.463, "w": 29.876, "h": 1.514, "u": "https://chandoo.org/wp/how-to-svg-dax-measures-power-bi"}, {"x": 12.606, "y": 10.155, "w": 13.993, "h": 1.514, "u": "https://chandoo.org/wp/how-to-svg-dax-measures-power-bi"}]}, {"t": "108 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página «11. Detalle por Cargo» paso a paso, mostrando la plantilla, sueldos y descuentos por cargo y la matriz de plantilla por región y nivel. Concepto · Tabla y matriz Concepto: La tabla es una lista ordenada; la matriz es una tabla de doble entrada, como una tabla de multiplicar. Definición: Una tabla lista columnas y medidas; una matriz cruza categorías en filas y columnas. Uso: Cargos (tabla) y Región × Nivel (matriz) en las páginas 1 y 11. Concepto · Tabla con imágenes Concepto: Es una tabla donde una de las columnas, en lugar de números, muestra dibujos. Definición: Las tablas pueden mostrar medidas de categoría «URL de imagen» como imágenes dentro de las celdas. Uso: En la página 11 cada cargo muestra una barra dorada con su sueldo promedio. Concepto · Medida Concepto: Es una calculadora guardada: no es un dato fijo, sino una fórmula que da un resultado distinto según lo que filtres. Definición: Una medida DAX es una fórmula que se evalúa en el contexto de filtro de cada visual y devuelve un valor. Uso: Total Empleados (2,187) y Masa Neta (RD$ 136.6 millones) son medidas de la tabla Medidas. Paso 0 · Crear la página y su título Etapa 1 · Segmentadores (1) Página 11: Detalle por Cargo Capítulo 15 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «11. Detalle por Cargo». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Detalle por cargo y matriz de plantilla (sin datos personales)». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Región: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1", "l": []}, {"t": "109 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 1 · Segmentadores (2) Etapa 1 · Segmentadores (3) Figura 36. Página «11. Detalle por Cargo», etapa 1: segmentadores y tarjetas/primer visual (solo segmentadores). Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 300, Alto 66. 5 Nivel jerárquico: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Nivel» (pozo «Campo»). 2 Título (Formato > General): «Nivel jerárquico». 3 Tamaño y posición: X 330, Y 42, Ancho 300, Alto 66. 4 Género: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 5 Reemplaza el campo por «Empleados > Genero» (pozo «Campo»). 6 Título (Formato > General): «Género». 7 Tamaño y posición: X 640, Y 42, Ancho 300, Alto 66. 8 Área funcional: Selecciona el primer segmentador y duplícalo con Ctrl+C y Ctrl+V. 1 Reemplaza el campo por «Empleados > Area» (pozo «Campo»). 2 Título (Formato > General): «Área funcional». 3 Tamaño y posición: X 950, Y 42, Ancho 310, Alto 66. 4", "l": []}, {"t": "110 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 2 · Siguientes gráficos Figura 37. Página «11. Detalle por Cargo», etapa 2: se agrega la primera mitad de los gráficos (Cargos: plantilla, sueldos y descuentos). Etapa 3 · Visuales restantes Cargos: plantilla, sueldos y descuentos: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Cargo» al pozo «Columnas». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Columnas». 4 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Neto Prom» al pozo «Columnas». 5 Del panel Datos abre la tabla «Medidas» y arrastra «Pct Descuento» al pozo «Columnas». 6 Del panel Datos abre la tabla «Medidas» y arrastra «Barra Bruto SVG» al pozo «Columnas». 7 En el panel Datos selecciona la medida SVG y en Herramientas de medición pon «Categoría de datos: URL de imagen»; en Formato > Cuadrícula define alto y ancho de imagen. 8 En Formato > General > Título escribe «Cargos: plantilla, sueldos y descuentos». 9 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 110, Ancho 740, Alto 602. 10 Matriz de plantilla: región × nivel: En el panel Visualizaciones haz clic en el ícono «Matriz»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Filas». 2 Del panel Datos abre la tabla «Empleados» y arrastra «Nivel» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Valores». 4 En Formato > General > Título escribe «Matriz de plantilla: región × nivel». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 770, Y 110, Ancho 490, Alto 602. 6", "l": []}, {"t": "111 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 38. Página «11. Detalle por Cargo» terminada, modo oscuro. Ajustes finales Sin datos personales Esta página agrupa por cargo; no muestra nombres de empleados (el modelo no los incluye) para respetar la privacidad. Ordenar Haz clic en el encabezado de una columna para ordenar, o usa los tres puntos (…) > Ordenar eje. Ejercicio: Cargo más numeroso ¿Qué cargo tiene más empleados y cuántos? ¿Cuál es su sueldo bruto promedio? Pistas: - Ordena la tabla por Total Empleados. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». En «Cargos: plantilla, sueldos y descuentos» abre los tres puntos (…) > Ordenar eje > «Total Empleados» y elige el orden descendente. 1 En «Cargos: plantilla, sueldos y descuentos»: en el cuadro de búsqueda del panel Formato escribe «imagen» y define el alto de imagen en 22 px. 2 En «Cargos: plantilla, sueldos y descuentos»: define el ancho de imagen en 220 px. 3", "l": []}, {"t": "112 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · Página 11: Detalle por Cargo 43. ¿Qué diferencia hay entre tabla y matriz? A. La matriz cruza categorías en filas y columnas B. No hay diferencia C. La matriz no admite medidas 44. ¿Qué cargo es el más numeroso? A. Auxiliar Operativo (237) B. Chofer C. Abogado 45. ¿Por qué no se muestran nombres de empleados? A. Para proteger la privacidad B. Porque no caben C. Porque Power BI no puede mostrarlos Verifica la página 11 La tabla lista 386 cargos ordenados por plantilla La matriz Región × Nivel muestra totales La barra dorada acompaña cada cargo Visualización de datos tipo Tabla y Matriz en Power BI | Curso de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video. Aplicando Formato Condicional a Una Tabla o Matriz de Power BI El Tío Tech Refuerza este capítulo con una explicación en video. Filtros Top N en Power BI | Mostrar los Mejores Y Peores Valores 🔥 El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 46.234, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=Oe5c1E5kKhE"}, {"x": 51.18, "y": 46.234, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=HUZk7b6Rmwc"}, {"x": 7.311, "y": 66.188, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=qySv5-xbO54"}]}, {"t": "113 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página 12 con las 20 conclusiones de la nómina, usando cuadros de texto, segmentadores y medidas DAX. Concepto · Cuadro de texto Concepto: Es una nota pegada sobre el tablero donde tú escribes lo que quieras. Definición: El cuadro de texto es un elemento del lienzo con formato libre (fuente, color, fondo, borde y vínculo). Uso: Las 20 tarjetas de conclusiones y los botones de modo son cuadros de texto formateados. Concepto · Correlación no es causalidad Concepto: Que dos cosas pasen juntas no significa que una cause la otra. Definición: Dos variables pueden estar relacionadas por azar, por un tercer factor o por la composición de los grupos. Uso: Que el nivel jerárquico explique el sueldo (VIP 3.4) no dice por qué las mujeres ganan 7.5 % más en promedio global: ahí actúa el efecto composición. Concepto · Efecto composición (paradoja de Simpson) Concepto: Es cuando el promedio general cuenta una historia distinta a la de cada grupo, porque los grupos tienen tamaños diferentes. Definición: El efecto composición ocurre cuando una tendencia global cambia o se invierte al separar los datos por subgrupos. Uso: Las mujeres son mayoría en cargos profesionales y técnicos (62 %), por eso el promedio global les favorece, aunque en Servicios Generales ganan 17 % menos. Paso 0 · Crear la página y su título Página 12: Conclusiones Capítulo 16 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «12. Conclusiones». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Conclusiones: 20 hallazgos interesantes de la nómina». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5", "l": []}, {"t": "114 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Crear las 20 tarjetas de conclusiones Figura 39. Página «12. Conclusiones» terminada, modo oscuro. Cómo se calcularon Cada cifra salió de los datos: por ejemplo, Pct Mujeres (54.6 %), Brecha Genero % (+7.5 %), Pct Descuento (35.6 %) y Razon P90 P10 (4.5); las demás se calcularon con pandas en el script conclusiones.py y se pegaron en los cuadros de texto. Lectura crítica Describe lo que muestran los datos; no inventes causas. La brecha global a favor de las mujeres se explica por la composición de cargos. Duplicar tarjetas Crea una tarjeta, dale formato y duplícala con Ctrl+C y Ctrl+V; solo cambia el texto, el color del borde y la posición. En la cinta Insertar elige «Cuadro de texto». Escribe la primera línea: «1. Una nómina de peso» (12 pt, negrita, color de acento). 1 Pulsa Enter y escribe la cifra o explicación (10 pt, color claro). Los 20 textos están en el capítulo y en datos\\conclusiones.json. 2 En Formato > Efectos > Fondo: color #111C33, transparencia 0 %; en Borde: activa, color de acento, radio 10. 3 En Formato > General > Tamaño y posición: Ancho 302, Alto 110. Posición de la tarjeta n (1 a 20): X = 20 + columna × 310 e Y = 48 + fila × 116, con 4 columnas y 5 filas. 4 Copia la tarjeta con Ctrl+C y Ctrl+V, cambia el texto, el color de acento y la posición. Repite hasta tener 20. 5 Al final agrega un cuadro de texto pequeño (X 20, Y 636, Ancho 1240, Alto 40) con la nota de fuente y el crédito. 6", "l": []}, {"t": "115 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Las 20 conclusiones 1. Una nómina de peso: 2,187 empleados fijos reciben una masa neta mensual de RD$ 136.6 mill. (bruta: RD$ 185.0 mill.). 2. Todo se concentra: La Sede Nacional y la Metropolitana reúnen el 52.0 % del personal. Solo la Sede Nacional: 34.8 % de la gente y 41.2 % de la masa neta. 3. Plantilla femenina: El 54.6 % son mujeres: 69.6 % en Ingresos y Admisión, 69.1 % en Servicios a Empresas y 48.7 % en Tecnología. 4. Paradoja de género: Ellas ganan en promedio 7.5 % más que ellos (RD$ 87,333 vs 81,268); en la mediana, 27.9 % más. 5. Pero por nivel cambia: En Servicios Generales ellas ganan 17.0 % menos; en Apoyo Administrativo 5.0 % menos; en Directivos 5.6 % más. 6. Cargos con género marcado: 87 de 87 choferes son hombres; 98.8 % de los oficiales de seguridad; 75.3 % de los conserjes son mujeres. 7. Efecto composición: La brecha global favorece a las mujeres porque hay más en cargos profesionales y técnicos, no porque ganen más en igual cargo (paradoja de Simpson). 8. Tres cargos, uno de cada cinco: Auxiliar Operativo (237), Conserje (150) y Chofer (87) suman el 21.7 % de la plantilla. 9. Desigualdad moderada: El índice de Gini del sueldo bruto es 0.300: hay diferencias, pero lejos de los extremos. 10. La cima: El 10 % mejor pagado se lleva el 23.2 % de la masa bruta; el 1 % más alto, el 4.4 %. 11. De 30 mil a 718 mil: El sueldo bruto va de RD$ 30,600 a RD$ 718,640: 23.5 veces. El percentil 90 gana 4.5 veces el percentil 10. 12. Jefe vs servicios: Un directivo gana en promedio 4.3 veces lo que un empleado de servicios generales (RD$ 152,615 vs 35,634). 13. Dos mundos salariales: El 23.8 % gana menos de RD$ 50 mil, mientras el 35.8 % gana RD$ 100 mil o más. 14. Lo que se descuenta: Los descuentos suman RD$ 75.6 mill.: el 35.6 % del ingreso total de la nómina. 15. El gran descuento: Los «otros descuentos» (fuera de ISR, AFP y SFS) son el 56.5 % de todos los descuentos; ISR solo el 29.2 %. 16. Casi la mitad del ingreso: Para 463 empleados (21.2 %) los descuentos superan la mitad de lo que ganan; el máximo llega a 98.0 %. 17. Sin ISR: El 15.4 % de la plantilla no tiene ISR descontado: su sueldo bruto promedio es RD$ 33,323 frente a RD$ 93,883 del resto. 18. Ingresos extra: El 50.8 % recibe otros ingresos (promedio RD$ 24,537); en 293 casos el neto supera al sueldo bruto. 19. Descuentos progresivos: El descuento sube de 29.9 % del ingreso (30–50 mil) a 40.5 % (120–200 mil): quien más gana, más aporta. 20. Lo que explica el PLS: El nivel jerárquico es el factor número uno (VIP 3.4); con 3 componentes el modelo explica 75.5 % (R²) y predice con Q² = 0.749. Ejercicio: Conclusión número 21 Escribe una conclusión nueva (título + cifra) con un dato del dashboard que no esté entre las 20.", "l": []}, {"t": "116 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Pistas: - Verifica la cifra con una tarjeta antes de escribirla. - Ejemplo de tema: el % de directivos. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 12: Conclusiones 46. ¿Por qué la brecha global favorece a las mujeres? A. Por la composición de cargos (más mujeres en cargos profesionales) B. Porque ganan más en todos los cargos C. Por un error de Power BI 47. ¿Qué porcentaje de los empleados ve su ingreso reducido en más de la mitad por descuentos? A. 21.2 % (463 empleados) B. 2 % C. 50 % 48. ¿Qué advertencia debes hacer al leer una correlación? A. Que no prueba causalidad B. Que siempre es falsa C. Que solo vale en modo oscuro Verifica la página 12 Hay 20 tarjetas ordenadas en 4 columnas Cada una tiene título de color y cifra El pie cita la fuente y el crédito", "l": []}, {"t": "117 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Crear un tema oscuro, páginas gemelas y un botón que cambia entre modo oscuro y claro en Power BI. Concepto · Tema de informe (JSON) Concepto: Es el «traje» del informe: colores, fuentes y fondos definidos en un archivo. Definición: Un tema es un archivo JSON con colores de datos, clases de texto y estilos de visuales que se aplica a todo el informe. Uso: NominaDark.json da el modo oscuro: fondo de visuales #111C33, texto claro y paleta cian, rosa, dorado, verde y violeta. Concepto · Páginas gemelas (modo claro) Concepto: Son dos copias de la misma página, una oscura y otra clara, que el botón intercambia. Definición: Una página gemela repite los visuales con otro formato; se oculta de las pestañas y se llega a ella con un botón de navegación. Uso: Las 12 páginas claras están ocultas; cada página tiene el botón ☀ Modo claro y su gemela el botón ☾ Modo oscuro. Concepto · Vínculo (acción) de un visual Concepto: Es decirle a un cuadro: «cuando alguien te toque, haz esto». Definición: La acción de un visual puede navegar a otra página, abrir una dirección web o aplicar un marcador. Uso: El botón «Abrir el dashboard HTML» usa un vínculo web; los botones ☀/☾ usan navegación de página. Concepto · Segmentadores sincronizados Concepto: Es que el filtro que eliges en una página se «recuerda» en las demás. Definición: Sincronizar segmentadores aplica la misma selección en varias páginas (Ver > Sincronizar segmentadores). Uso: Al pasar de modo oscuro a claro conservas Región, Nivel, Género y Área elegidos. Crear el modo oscuro (tema) Modo oscuro y claro con un botón Capítulo 17 · 25 min En la cinta Ver abre la galería de temas y elige «Examinar temas» para importar el archivo NominaDark.json. 1 En cada página, en Formato > Página > Fondo de lienzo, usa el color #0A1222. 2 Comprueba que los visuales toman el fondo #111C33 y el texto claro del tema. 3", "l": []}, {"t": "118 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Crear las páginas gemelas Crear el botón de modo Figura 40. Página «12. Conclusiones» en modo claro. Cómo funciona el cambio Power BI no tiene un interruptor global claro/oscuro: se logra con dos versiones de cada página y un botón que salta a la otra. Los segmentadores sincronizados mantienen tu selección. Páginas ocultas Las páginas claras están marcadas como ocultas: quien solo lee el informe no las ve en las pestañas, pero se llega a ellas con el botón; en Power BI Desktop las ves todas mientras editas. Para ocultar una página: clic derecho en la pestaña > Ocultar página. Duplica una página: clic derecho en la pestaña > Duplicar página. 1 Cambia el nombre agregando «(claro)». 2 En la página duplicada pon el fondo de lienzo #EEF2F8 y, en cada visual, fondo blanco, borde #D5DEEC y texto oscuro #0F1B33. 3 Clic derecho en la pestaña de la página clara > Ocultar página. 4 En la cinta Insertar > Botones > En blanco. Colócalo arriba a la derecha (X 1125, Y 2, Ancho 135, Alto 38). 1 En Formato > Estilo activa el texto y escribe «☀ Modo claro»; relleno dorado y borde blanco. 2 En Formato > Acción activa la acción, tipo «Navegación de página» y elige como destino la página clara. 3 Copia el botón a la página clara, cámbialo a «☾ Modo oscuro» y cambia el destino a la página oscura. 4 Ver > Sincronizar segmentadores: asigna el mismo grupo a los segmentadores de ambas páginas. 5 Prueba el botón con Ctrl+clic en modo edición. 6", "l": []}, {"t": "119 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Formato por visual En las páginas claras cada visual lleva su propio fondo blanco, borde gris y texto oscuro; el tema oscuro sigue siendo el base del informe. Ejercicio: Haz tu gemela Duplica la página 1, conviértela al modo claro y crea el botón de ida y vuelta. Pistas: - Recuerda ocultar la página clara. - No olvides sincronizar los segmentadores. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Modo oscuro y claro con un botón 49. ¿Cómo se logra el cambio de modo en este proyecto? A. Con páginas gemelas y un botón de navegación B. Con un ajuste de Archivo > Opciones > Apariencia C. Con un marcador de color 50. ¿Para qué sincronizar los segmentadores? A. Para conservar la selección al cambiar de página B. Para acelerar Power BI C. Para ocultar páginas 51. ¿Qué archivo define el modo oscuro? A. El tema NominaDark (JSON) B. empleados.csv C. El script de Python Verifica el modo claro Cada página tiene su botón de modo Las páginas claras están ocultas Los segmentadores conservan la selección Los visuales de Python/R se ven bien en claro", "l": []}, {"t": "120 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Cómo Crear y Configurar Botones en Power BI | Tutorial Paso a Paso El Tío Tech Refuerza este capítulo con una explicación en video. Marcadores (Bookmarks) en Power BI: Cómo Usarlos para Crear Informes Interactivos El Tío Tech Refuerza este capítulo con una explicación en video. 🔗 Power BI: Cómo Insertar Vínculos en Tus Reportes 🚀 El Tío Tech Refuerza este capítulo con una explicación en video. Crea un fondo Personalizado para tu DASHBOARD en POWER BI 😱 (Clonar Fondo) El Tío Tech Refuerza este capítulo con una explicación en video. Para leer más Crear temas personalizados de informe (Microsoft Learn): https://learn.microsoft.com/en-gb/power- bi/create-reports/report-themes-create-custom", "l": [{"x": 7.311, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=koXWjiRZAQk"}, {"x": 51.18, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=JjxXKIH7J7U"}, {"x": 7.311, "y": 25.388, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=L5J3gy_cVAU"}, {"x": 51.18, "y": 25.388, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=0USL6Va7TfE"}, {"x": 54.079, "y": 48.104, "w": 30.254, "h": 1.514, "u": "https://learn.microsoft.com/en-gb/power-bi/create-reports/report-themes-create-custom"}, {"x": 12.606, "y": 49.708, "w": 34.162, "h": 1.514, "u": "https://learn.microsoft.com/en-gb/power-bi/create-reports/report-themes-create-custom"}]}, {"t": "121 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Aprender a guardar tu proyecto, exportar a PDF, publicar en Power BI Service y compartir el informe sin exponer datos personales. Concepto · Publicar y compartir Concepto: Es subir tu tablero a la nube para que otros lo vean desde el navegador. Definición: Publicar envía el informe al servicio Power BI (cuenta de trabajo o estudio) donde se puede compartir. Uso: Los visuales de Python y R necesitan configuración adicional en el servicio; el HTML independiente funciona en cualquier navegador. Guardar y compartir El HTML independiente El archivo html\\nomina_interactivo.html muestra los mismos datos con filtros, mapa de calor y las 20 conclusiones; funciona en cualquier navegador con internet (usa la biblioteca Plotly). Python y R en el servicio Para ver los visuales de Python y R en el Servicio de Power BI se necesita configuración adicional; para clases es más sencillo mostrar el archivo en Power BI Desktop. Privacidad El informe no contiene nombres de empleados; verifica siempre que no compartes datos personales. Ejercicio: Entrega tu trabajo Exporta tu informe a PDF y guarda tu proyecto en una carpeta con tu nombre. Pistas: - Archivo > Exportar > Exportar a PDF. Guardar, publicar y compartir Capítulo 18 · 15 min Archivo > Guardar como: guarda el proyecto (.pbip) o un archivo .pbix. 1 Archivo > Exportar > Exportar a PDF para entregar una copia impresa. 2 Para publicar: Inicio > Publicar y elige un área de trabajo (requiere cuenta de trabajo o estudio). 3 Para el HTML: abre html\\nomina_interactivo.html en el navegador o compártelo por la plataforma del curso. 4", "l": []}, {"t": "122 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Guardar, publicar y compartir 52. ¿Qué necesitas para publicar en el Servicio de Power BI? A. Una cuenta de trabajo o estudio B. Nada C. Una cuenta bancaria 53. ¿Qué muestra el HTML independiente? A. Los mismos datos con filtros y mapa de calor B. Solo la portada C. El código DAX 54. ¿Qué debes verificar antes de compartir? A. Que no haya datos personales B. Que haya muchos colores C. Que sea modo oscuro Verifica antes de entregar Guardé el proyecto Exporté el PDF No hay datos personales Probé el HTML Publicar y Compartir Informes, Dashboards de Power Bi (Con Link 🔗) El Tío Tech Refuerza este capítulo con una explicación en video. Diferencia entre Power Bi Desktop y Power BI Service El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=0q3UhU0A3Ew"}, {"x": 51.18, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=xlEDiKxTNzY"}]}, {"t": "123 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Aplicar todo lo aprendido con tres retos y una rúbrica Ejercicio: Reto 1 · La medida Pct Directivos Crea la medida «Pct Directivos» que calcule qué porcentaje de la plantilla tiene Nivel «2-Directivo» y muéstrala en una tarjeta de la página 1. Pistas: - Usa CALCULATE con el filtro Empleados[Nivel] = \"2-Directivo\" sobre [Total Empleados]. - Divide entre [Total Empleados] con DIVIDE para evitar errores. - Dale formato porcentaje en Herramientas de medición. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Ejercicio: Reto 2 · Mapa de masa neta Crea una página nueva con un mapa de burbujas donde el tamaño de cada burbuja sea la Masa Neta de la provincia sede. Pistas: - Usa el visual Azure Maps. - La ubicación es la columna Provincia; la latitud y la longitud son las medidas Lat Sede y Lon Sede (una coordenada promedio por provincia). - Apaga la capa de calor si estuviera activa. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Ejercicio: Reto 3 · Tu conclusión número 21 Escribe una conclusión nueva con un dato del dashboard, con el mismo formato de la página 12 (título corto + cifra), y calcula la cifra con una medida o con una tarjeta. Pistas: - Elige un dato que no esté entre las 20 conclusiones. Ejercicios integradores Capítulo 19 · 40 min", "l": []}, {"t": "124 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD - Comprueba la cifra con una tarjeta antes de escribirla. - Evita afirmar causas: describe lo que muestran los datos. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Ejercicios integradores 55. ¿Por qué el mapa de burbujas usa las medidas Lat Sede y Lon Sede? A. Para obtener una sola coordenada (promedio) por provincia sede B. Porque las columnas Latitud y Longitud no existen C. Porque las medidas son más rápidas que las columnas 56. ¿Qué hace DIVIDE en Pct Directivos? A. Divide y evita el error si el denominador es cero B. Suma dos medidas C. Filtra por nivel 57. Si la brecha global favorece a las mujeres, ¿qué debes revisar antes de concluir? A. La composición por nivel y cargo (efecto composición) B. Nada, el promedio basta C. El color del gráfico Rúbrica de evaluación (20 puntos) Modelo: carga correcta de los CSV con RutaDatos y tipos de datos (3 puntos) Medidas: al menos 10 medidas en la tabla Medidas, con formato (4 puntos) Páginas: al menos 5 páginas completas con segmentadores y tarjetas (4 puntos) Mapa o zona de calor funcionando (2 puntos) Un visual de Python o R funcionando (2 puntos) Modo claro/oscuro con botón de navegación (2 puntos) Conclusión propia bien redactada y verificada con datos (3 puntos)", "l": []}, {"t": "125 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Términos del manual en orden alfabético. Archivo CSV CSV (valores separados por comas) es un formato de texto que casi cualquier programa puede leer. Azure Maps (mapa de burbujas) Azure Maps es un visual de mapa que ubica datos por coordenadas o nombres y los dibuja como burbujas o capas. Barras 100 % apiladas Muestran la proporción de cada categoría dentro de cada barra, sumando siempre 100 %. Brecha de género salarial La brecha se calcula como (promedio mujeres − promedio hombres) ÷ promedio hombres. Carga externa La carga externa es la correlación entre un indicador y su constructo. Categoría de datos La categoría de datos indica el tipo geográfico o de contenido de una columna o medida (Latitud, Longitud, URL de imagen). Cerrar y aplicar Aplica los pasos de Power Query y carga las tablas resultantes al modelo de datos. Coeficiente de camino β El coeficiente β estandarizado mide el efecto directo de un constructo sobre otro (en desviaciones estándar). Columna calculada Una columna calculada se evalúa al cargar los datos y agrega un dato fijo a cada fila. Componente latente Un componente latente es una combinación lineal de variables originales que captura variación común. Constructo e indicador Un constructo latente se mide con uno o varios indicadores observables. Contexto de filtro El contexto de filtro es el conjunto de filtros activos que determinan qué filas ve una medida cuando se evalúa. Correlación de Spearman El coeficiente de Spearman mide la relación monótona entre dos variables usando sus rangos. Correlación no es causalidad Dos variables pueden estar relacionadas por azar, por un tercer factor o por la composición de los grupos. Cuadro de texto El cuadro de texto es un elemento del lienzo con formato libre (fuente, color, fondo, borde y vínculo). Curva de Lorenz y Gini El índice de Gini resume la desigualdad entre 0 (igualdad total) y 1 (un solo individuo tiene todo). Efecto composición (paradoja de Simpson) El efecto composición ocurre cuando una tendencia global cambia o se invierte al separar los datos por subgrupos. Gráfico de anillos (dona) Un gráfico de anillos muestra la proporción de cada categoría respecto al total. Gráfico de barras Un gráfico de barras compara medidas entre categorías con barras horizontales. Gráfico de barras apiladas Un gráfico apilado divide cada barra en partes que se suman. Gráfico de cintas Un gráfico de cintas ordena las categorías por valor en cada punto del eje y las une con cintas. Gráfico de columnas Un gráfico de columnas agrupadas compara el valor de una medida entre categorías. Gráfico de dispersión Un gráfico de dispersión ubica cada elemento según dos medidas (X e Y); el tamaño de la burbuja puede mostrar una tercera. Informe, página y visual Un informe contiene páginas; una página contiene visuales (tarjetas, gráficos, tablas, mapas) y segmentadores. Glosario Anexo", "l": []}, {"t": "126 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Mapa de calor (densidad) Un mapa de calor estima la densidad de puntos y la colorea según cuántos hay por zona. Medida Una medida DAX es una fórmula que se evalúa en el contexto de filtro de cada visual y devuelve un valor. Medida vs. columna calculada Una medida DAX se evalúa en el contexto de filtro del visual y devuelve un valor. Una columna calculada se evalúa fila por fila al cargar los datos y se guarda en la tabla. Modelo plano Un modelo plano usa una tabla principal sin relaciones; los filtros funcionan porque todas las columnas están en la misma tabla. Parámetro RutaDatos Un parámetro es un valor guardado que las consultas reutilizan; RutaDatos guarda la carpeta donde están los CSV. Percentil y mediana La mediana es el percentil 50: divide los datos en dos mitades. El percentil P es el valor bajo el cual queda el P % de las observaciones. PLS (mínimos cuadrados parciales) La regresión PLS construye componentes latentes (combinaciones de las variables) que maximizan la relación con la variable a predecir. PLS-PM (modelo de caminos) PLS-PM estima relaciones entre constructos latentes (cada uno medido por varios indicadores) y cuantifica cada camino con un coeficiente β. Power BI Desktop Aplicación de escritorio de Windows para conectar datos, modelarlos y crear informes interactivos. Power Query Editor que guarda una lista de pasos aplicados (lenguaje M) para transformar los datos de origen antes de cargarlos al modelo. Progresividad de los descuentos Un descuento es progresivo si el porcentaje del ingreso que se descuenta crece con el ingreso. Publicar y compartir Publicar envía el informe al servicio Power BI (cuenta de trabajo o estudio) donde se puede compartir. Páginas gemelas (modo claro) Una página gemela repite los visuales con otro formato; se oculta de las pestañas y se llega a ella con un botón de navegación. R² y Q² R² es la proporción de variación explicada; Q² la proporción predicha en validación cruzada (10 grupos). Segmentador Un segmentador filtra los visuales de la página según los valores de una columna elegida. Segmentadores sincronizados Sincronizar segmentadores aplica la misma selección en varias páginas (Ver > Sincronizar segmentadores). SVG con DAX SVG es un formato de imágenes vectoriales descrito con texto; una medida DAX puede devolver ese texto y, con categoría «URL de imagen», se muestra como imagen. Tabla con imágenes Las tablas pueden mostrar medidas de categoría «URL de imagen» como imágenes dentro de las celdas. Tabla y columna Una tabla organiza datos en filas (registros) y columnas (campos con un solo tipo de dato). Tabla y matriz Una tabla lista columnas y medidas; una matriz cruza categorías en filas y columnas. Tarjeta Una tarjeta muestra el valor de una medida o campo como indicador clave (KPI). Tema de informe (JSON) Un tema es un archivo JSON con colores de datos, clases de texto y estilos de visuales que se aplica a todo el informe. Tipo de dato El tipo de dato define cómo Power BI interpreta una columna (texto, entero, decimal, fecha...). Treemap Un treemap representa categorías como rectángulos cuya área es proporcional al valor. Violín y caja (boxplot) El violín dibuja la densidad de la distribución; la caja muestra mediana, cuartiles y valores atípicos. VIP (importancia de la variable) El VIP (Variable Importance in Projection) resume la importancia de cada variable en el modelo PLS; con VIP ≥ 1 se considera relevante. Visual de Python Un visual de Python ejecuta un script (pandas, matplotlib, seaborn...) sobre las columnas arrastradas y muestra la imagen resultante.", "l": []}, {"t": "127 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Visual de R Un visual de R ejecuta un script de R (por ejemplo con ggplot2) y muestra la imagen. Visual de script (Python y R) Un visual de script ejecuta código de Python o R sobre las columnas que arrastras y muestra la imagen que el código dibuja. Vínculo (acción) de un visual La acción de un visual puede navegar a otra página, abrir una dirección web o aplicar un marcador.", "l": []}, {"t": "128 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Soluciones de los ejercicios y de las autoevaluaciones. Inténtalo primero sin mirar. Caso: Ejercicio: Reconoce la pantalla Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». El informe tiene 24 páginas: 12 en modo oscuro y 12 gemelas en modo claro (marcadas como ocultas, así que no aparecen para quien solo lee el informe). Autoevaluación · Antes de empezar 1. ¿Para qué sirve un visual de Python en Power BI? A) Para dibujar un gráfico con un programa de Python sobre las columnas que arrastras. Por qué: Ejecuta un script y muestra la imagen resultante. 2. ¿Qué contiene un informe de Power BI? A) Páginas con visuales y segmentadores. Por qué: Un informe se compone de páginas y cada página de visuales. 3. ¿Qué debes pulsar al abrir el archivo para ver los gráficos de Python y R? A) Habilitar. Por qué: Es el aviso de seguridad de los visuales de script. Caso: Ejercicio: Comprueba la carga Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». 2,187 filas y 31 columnas. Autoevaluación · Preparar y conectar los datos 4. ¿Qué es Power Query? A) El editor donde aplicas pasos para limpiar y preparar los datos. Por qué: Guarda cada transformación como un paso aplicado. 5. ¿Para qué sirve el parámetro RutaDatos? A) Para guardar la carpeta de los CSV y poder cambiarla en un solo lugar. Por qué: Las consultas reutilizan el valor del parámetro. 6. ¿Qué haces cuando terminas de revisar la consulta? A) Cerrar y aplicar. Por qué: Carga las tablas al modelo. Caso: Ejercicio: Lee el modelo Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Sí: la columna No (un número único por empleado, de 1 a 2,187). Se usa como clave en los visuales de Python y R para que no se eliminen filas repetidas; no hace falta relacionarla con otra tabla. Respuestas Anexo", "l": []}, {"t": "129 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · El modelo de datos 7. ¿Por qué las tablas PLS_* no tienen relación con Empleados? A) Porque no comparten una columna clave y son resultados del análisis. Por qué: Son tablas de resultados independientes. 8. ¿Cuál es la diferencia entre una medida y una columna calculada? A) La medida se recalcula según los filtros; la columna calculada guarda un valor fijo por fila. Por qué: La medida depende del contexto de filtro. 9. ¿Qué hace la categoría de datos de Latitud? A) Indica a Power BI que la columna es una coordenada geográfica. Por qué: Así el visual de mapa la reconoce. Caso: Ejercicio: Tu primera medida Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Pct Hombres = DIVIDE([Hombres], [Total Empleados]) Autoevaluación · Las medidas DAX paso a paso 10. ¿Qué hace COUNTROWS(Empleados)? A) Cuenta las filas de la tabla. Por qué: Cuenta cuántas filas hay en el contexto actual. 11. ¿Por qué usamos DIVIDE en lugar de /? A) Evita errores si el divisor es cero. Por qué: DIVIDE devuelve vacío en vez de error. 12. ¿Cuándo prefieres una medida a una columna calculada? A) Cuando el valor debe cambiar con los filtros. Por qué: Las medidas se recalculan según el contexto. Caso: Ejercicio: Un indicador nuevo Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». 993 (y Mujeres = 1,194). Autoevaluación · Página 1: Resumen Ejecutivo 13. ¿Qué visual muestra un solo número grande? A) Tarjeta. Por qué: Presenta el valor de una medida. 14. ¿Qué región tiene más empleados? A) Sede Nacional (762). Por qué: Es la columna más alta de «Empleados por región». 15. Si eliges «Femenino» en el segmentador Género, ¿qué cambia? A) Cambian los valores de los visuales de la página que dependen del género. Por qué: Un segmentador filtra los visuales de la página. Caso: Ejercicio: Compara los niveles Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». 1-Alta Dirección tiene el mayor promedio (RD$ 438 mil) pero solo 3 personas; entre los demás, 2-Directivo (RD$ 152 mil, 390 personas). Autoevaluación · Página 2: Estructura Salarial 16. ¿Qué mide el percentil 90? A) El sueldo que supera al 90 % de los empleados. Por qué: Es el valor bajo el cual queda el 90 % de los datos. 17. ¿Qué representa el tamaño de cada burbuja en el gráfico de dispersión de departamentos? A) La masa neta del departamento. Por qué: Está asignada al pozo Tamaño. 18. ¿Cuál es la razón P90/P10? A) 4.5 veces. Por qué: 137,060 ÷ 30,600 ≈ 4.5.", "l": []}, {"t": "130 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Caso: Ejercicio: Interpreta la brecha Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Ganan menos en 4-Apoyo Administrativo (−5.0 %) y 5- Servicios Generales (−17.0 %); ganan más en 2-Directivo (+5.6 %) y 3-Profesional/Técnico (+3.9 %). Autoevaluación · Página 3: Equidad de Género 19. ¿Qué es el efecto composición? A) Que el promedio global cambia por la mezcla de grupos, no solo por diferencias dentro de ellos. Por qué: Es la paradoja de Simpson. 20. ¿Cuál es la brecha de género con todos los datos? A) +7.5 %. Por qué: (87,333 − 81,268) ÷ 81,268. 21. ¿Qué muestra el gráfico de barras 100 % apiladas? A) La composición por género dentro de cada área. Por qué: Cada barra suma 100 %. Caso: Ejercicio: Lee el mapa Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Metropolitana, con 376 empleados (Sede Nacional es la primera con 762). Autoevaluación · Página 4: Mapa Geográfico 22. ¿Por qué existen las medidas Lat Sede y Lon Sede? A) Para obtener una sola coordenada (promedio) por provincia sede. Por qué: Se calculan con AVERAGE de Latitud y Longitud. 23. ¿Qué representa el tamaño de cada burbuja? A) Cantidad de empleados de esa provincia sede. Por qué: Está en el pozo Tamaño con Total Empleados. 24. ¿La ubicación del mapa es exacta para cada empleado? A) No, es la sede aproximada de su regional. Por qué: Los datos no traen ubicación individual. Caso: Ejercicio: Zonas calientes Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Santo Domingo (Distrito Nacional), Santiago y San Pedro de Macorís (con Barahona y Puerto Plata como focos menores). Autoevaluación · Página 5: Zonas de Calor 25. ¿Qué muestra un mapa de calor? A) Dónde se concentran más puntos. Por qué: Colorea la densidad de puntos. 26. ¿Por qué los visuales de Python incluyen la columna No? A) Para que Power BI no elimine filas repetidas. Por qué: Los visuales de script quitan duplicados. 27. ¿Qué debes hacer para ver los visuales de Python al abrir el archivo? A) Pulsar Habilitar en el aviso de scripts. Por qué: Es un aviso de seguridad. Caso: Ejercicio: Interpreta el VIP Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Cinco variables superan 1 (barras rosadas); la primera es «Nivel jerárquico (ordinal)» con VIP 3.4.", "l": []}, {"t": "131 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · Página 6: PLS Regresión 28. ¿Qué indica un VIP mayor o igual a 1? A) Que la variable es relevante para el modelo. Por qué: Es el criterio habitual. 29. ¿Qué mide Q²? A) La capacidad de predecir datos no usados para ajustar el modelo. Por qué: Se calcula con validación cruzada de 10 grupos. 30. ¿Cambian R² y Q² al usar el segmentador de Región? A) No, son resultados calculados con todos los datos. Por qué: Vienen de la tabla PLS_Resumen. Caso: Ejercicio: Lee un camino Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Que, manteniendo constante la compensación, una carga financiera mayor (más descuentos) reduce el ingreso neto: casi una desviación estándar por cada desviación estándar de aumento. Autoevaluación · Página 7: PLS-PM Estructural 31. ¿Qué es un constructo latente? A) Una idea no observable directamente que se mide con varios indicadores. Por qué: Por ejemplo «Posición» se mide con nivel, tamaño y sede. 32. ¿Cuál es el R² del Ingreso neto? A) 0.86. Por qué: Está en la tabla de caminos. 33. ¿Por qué hay coeficientes mayores que 1? A) Por la colinealidad entre constructos (efecto supresor). Por qué: Compensación y Carga financiera están muy correlacionadas. Caso: Ejercicio: Lee la correlación Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Aproximadamente 0.97: casi perfecta y positiva; quien gana más sueldo bruto paga más ISR. Autoevaluación · Página 8: Analítica con R 34. ¿Qué hace un violín en un gráfico? A) Muestra la forma (densidad) de la distribución de los datos. Por qué: Se ensancha donde hay más personas. 35. ¿Qué significa una correlación de Spearman cercana a 1? A) Que a mayor valor de una variable, mayor valor de la otra. Por qué: Relación creciente. 36. ¿Por qué se usa escala logarítmica en el violín? A) Porque los sueldos van de 30 mil a 718 mil. Por qué: Evita que los sueldos bajos se aplasten. Caso: Ejercicio: Compara la desigualdad Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». En las mujeres (0.284 frente a 0.317 de los hombres): sus sueldos están menos dispersos. Autoevaluación · Página 9: Analítica con Python 37. ¿Qué mide el índice de Gini? A) La desigualdad, de 0 (igualdad total) a 1 (máxima desigualdad). Por qué: Resume la curva de Lorenz. 38. ¿Qué significa que los descuentos sean progresivos? A) Que quien gana más descuenta un porcentaje mayor de su ingreso. Por qué: El % sube con el ingreso.", "l": []}, {"t": "132 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD 39. ¿Qué representa la línea rosada del gráfico de progresividad? A) La mediana móvil del % descontado. Por qué: Se calcula por tramos de ingreso. Caso: Ejercicio: Cambia el color Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Reemplaza rgb(244,63,142) por rgb(52,211,153) en la ruta del arco de valor. Autoevaluación · Página 10: HTML y SVG 40. ¿Qué categoría de datos necesita una medida SVG? A) URL de imagen. Por qué: Así Power BI la interpreta como imagen. 41. ¿Qué devuelve una medida SVG? A) Un texto con las instrucciones del dibujo. Por qué: SVG se escribe con texto. 42. ¿Qué hace el botón de la página? A) Abre el dashboard HTML en el navegador. Por qué: Usa un vínculo web. Caso: Ejercicio: Cargo más numeroso Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Auxiliar Operativo con 237 empleados y sueldo bruto promedio de RD$ 52,279. Autoevaluación · Página 11: Detalle por Cargo 43. ¿Qué diferencia hay entre tabla y matriz? A) La matriz cruza categorías en filas y columnas. Por qué: La tabla solo lista. 44. ¿Qué cargo es el más numeroso? A) Auxiliar Operativo (237). Por qué: Es el primero al ordenar por plantilla. 45. ¿Por qué no se muestran nombres de empleados? A) Para proteger la privacidad. Por qué: El modelo no los incluye. Caso: Ejercicio: Conclusión número 21 Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Ejemplo válido: «21. Plantilla directiva: 390 personas (17.8 %) tienen nivel Directivo». Calcula con DIVIDE(CALCULATE([Total Empleados], Empleados[Nivel]=\"2-Directivo\"), [Total Empleados]). Autoevaluación · Página 12: Conclusiones 46. ¿Por qué la brecha global favorece a las mujeres? A) Por la composición de cargos (más mujeres en cargos profesionales). Por qué: Es el efecto composición. 47. ¿Qué porcentaje de los empleados ve su ingreso reducido en más de la mitad por descuentos? A) 21.2 % (463 empleados). Por qué: Es una de las conclusiones. 48. ¿Qué advertencia debes hacer al leer una correlación? A) Que no prueba causalidad. Por qué: Pueden influir otros factores.", "l": []}, {"t": "133 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Caso: Ejercicio: Haz tu gemela Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Se debe poder ir de la página 1 a su gemela clara y volver con los botones, conservando los filtros de los segmentadores. Autoevaluación · Modo oscuro y claro con un botón 49. ¿Cómo se logra el cambio de modo en este proyecto? A) Con páginas gemelas y un botón de navegación. Por qué: No existe un interruptor global. 50. ¿Para qué sincronizar los segmentadores? A) Para conservar la selección al cambiar de página. Por qué: Comparten el mismo filtro. 51. ¿Qué archivo define el modo oscuro? A) El tema NominaDark (JSON). Por qué: Define colores y estilos. Caso: Ejercicio: Entrega tu trabajo Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Un PDF del informe y la carpeta del proyecto (.pbip) con los CSV. Autoevaluación · Guardar, publicar y compartir 52. ¿Qué necesitas para publicar en el Servicio de Power BI? A) Una cuenta de trabajo o estudio. Por qué: Es un requisito del Servicio. 53. ¿Qué muestra el HTML independiente? A) Los mismos datos con filtros y mapa de calor. Por qué: Funciona en el navegador. 54. ¿Qué debes verificar antes de compartir? A) Que no haya datos personales. Por qué: El modelo no incluye nombres. Caso: Ejercicio: Reto 1 · La medida Pct Directivos Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Pct Directivos = DIVIDE(CALCULATE([Total Empleados], Empleados[Nivel] = \"2-Directivo\"), [Total Empleados]). Con todos los datos debe dar 17.8 % (390 de 2,187 empleados). Caso: Ejercicio: Reto 2 · Mapa de masa neta Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Azure Maps con: Ubicación = Empleados > Provincia; Longitud = Medidas > Lon Sede; Latitud = Medidas > Lat Sede; Tamaño = Medidas > Masa Neta. Debes ver una burbuja grande sobre Santo Domingo/Distrito Nacional. Caso: Ejercicio: Reto 3 · Tu conclusión número 21 Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Ejemplo: «21. Plantilla directiva: el 17.8 % de la plantilla (390 personas) tiene nivel Directivo» (usa la medida Pct Directivos del Reto 1).", "l": []}, {"t": "134 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Autoevaluación · Ejercicios integradores 55. ¿Por qué el mapa de burbujas usa las medidas Lat Sede y Lon Sede? A) Para obtener una sola coordenada (promedio) por provincia sede. Por qué: Así cada provincia se dibuja con una sola burbuja. 56. ¿Qué hace DIVIDE en Pct Directivos? A) Divide y evita el error si el denominador es cero. Por qué: DIVIDE devuelve vacío en lugar de error. 57. Si la brecha global favorece a las mujeres, ¿qué debes revisar antes de concluir? A) La composición por nivel y cargo (efecto composición). Por qué: La paradoja de Simpson: el promedio global puede ocultar diferencias por nivel.", "l": []}, {"t": "135 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Los videos y lecturas son de acceso libre. Los videos de El Tío Tech se usan con su autorización. 1. El Tío Tech. (s. f.). ¿Qué es Power Bi? | Capítulo 1 | CURSO DE POWER BI [Video]. YouTube. https://www.youtube.com/watch?v=6VKJXQoGvxc 2. El Tío Tech. (s. f.). Descargar e Instalación de Power Bi Gratis [Video]. YouTube. https://www.youtube.
