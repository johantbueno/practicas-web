<style>
:root{--bg:#0b1a4a;--ac:#E8B010;--tx:#eef2ff;--mut:#9fb0de;--pnl:#101f55;--lin:rgba(255,255,255,.14);--btn:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 38%,color-mix(in srgb,var(--bg) 70%,#3a63d6) 0%,var(--bg) 62%,#050c26 100%)}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:54px;z-index:5}
header img{height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{background:var(--btn);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--mut)}
.cta{background:var(--ac);color:#0b1a4a;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.book{transition:transform .6s ease;will-change:transform}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.page a.lk,#sheet a.lk{position:absolute;display:block;border-radius:3px;background:rgba(232,176,16,.0);transition:background .15s}
.page a.lk:hover,#sheet a.lk:hover{background:rgba(232,176,16,.28);outline:1px solid rgba(232,176,16,.7)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:84px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(255,255,255,.2)}.nav:disabled{opacity:.25;cursor:default}
#prev{left:8px}#next{right:8px}
#zoom{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;z-index:3;display:none}
#zoom.on{display:block}#zoom.drag{cursor:grabbing}
#sheet{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;background:#fff;box-shadow:0 10px 50px rgba(0,0,0,.55)}
#sheet .pp{position:relative;flex:none}
#sheet img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.zinfo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 14px;font-size:13px;z-index:6;display:none;pointer-events:none}
.zinfo.on{display:block}
footer{z-index:5;padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#scrub{width:100%;margin:0;accent-color:var(--ac);height:14px;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px;justify-content:space-between}
.grp{display:flex;align-items:center;gap:6px}
.credito{font-size:12px;color:var(--mut);white-space:nowrap}
.ib{width:42px;height:42px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:rgba(255,255,255,.2)}.ib.act{background:var(--ac);color:#0b1a4a}.ib:disabled{opacity:.3}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--mut);font-size:14px}
.pin input{width:54px;height:38px;border-radius:8px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);text-align:center;font:inherit}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,86vw);background:var(--pnl);border-right:1px solid var(--lin);z-index:8;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.4)}
#panel.on{transform:none}
.tabs{display:flex;border-bottom:1px solid var(--lin)}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 14px inherit;cursor:pointer}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs .x{flex:none;width:44px;font-size:20px}
.cont{flex:1;overflow:auto;padding:10px}
.cont[hidden]{display:none}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer}
.toc a:hover,.toc a.cur{background:var(--btn)}
.toc a span:last-child{color:var(--mut);flex:none}
.toc a.n2{padding-left:26px;font-size:14px}.toc a.n3{padding-left:42px;font-size:13px}
.vacio{color:var(--mut);padding:14px 6px}
.th{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th button{background:none;border:2px solid transparent;border-radius:8px;padding:4px;color:var(--mut);cursor:pointer;font:12px inherit}
.th button img{width:100%;display:block;border-radius:3px;background:#fff}
.th button.cur{border-color:var(--ac);color:var(--tx)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;margin-bottom:8px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--lin);padding:9px 6px;color:var(--tx);cursor:pointer;font:13px/1.4 inherit}
.res:hover{background:var(--btn)}.res b{color:var(--ac)}.res mark{background:var(--ac);color:#0b1a4a;border-radius:2px}
.acerca{border-top:1px solid var(--lin);padding:10px 14px;font-size:12px;color:var(--mut)}
#mas{position:absolute;right:8px;bottom:78px;background:var(--pnl);border:1px solid var(--lin);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#mas.on{display:flex}
#mas button,#mas a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;color:var(--tx);font:14px inherit;cursor:pointer;border-radius:8px;text-decoration:none;white-space:nowrap}
#mas button:hover,#mas a:hover{background:var(--btn)}
#mas svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:999px;z-index:20;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.m-only{display:none}
@media (max-width:640px){
 header{padding:6px 10px;gap:8px;min-height:48px}header h1{font-size:14px}header img{height:28px;max-width:80px}
 .cta{padding:6px 12px;font-size:13px}.d-only{display:none!important}.m-only{display:inline-flex}
 .nav{width:34px;height:64px}.credito{display:none}.ib{width:40px;height:40px}
 header .pg{display:none}.app.zo .nav{display:none}
 .app:not(.zo) #bZout{display:none}.bar,.grp{gap:4px}.ib{width:38px;height:38px}.pin{font-size:13px}.pin input{width:44px;height:36px}
}
:fullscreen header{min-height:44px}
</style>

const L = {"titulo": "Manual paso a paso: Dashboard de Nómina en Power BI", "autor": "Johan Tapia, PhD", "n": 137, "ratio": 0.70667, "paginas": [{"t": "MANUAL PASO A PASO PARA PRINCIPIANTES Dashboard de Nómina en Power BI Del Excel al análisis completo: DAX, mapas, PLS, R, Python y HTML Power BI · INFOTEP 12 páginas · modo oscuro y claro · con videos gratuitos, ejercicios y conclusiones Johan Tapia, PhD Datos ilustrativos de la nómina de personal fijo (septiembre 2026)", "l": []}, {"t": "2 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Contenido Antes de empezar 4 Preparar y conectar los datos 8 El modelo de datos 12 Las medidas DAX paso a paso 18 Página 1: Resumen Ejecutivo 47 Página 2: Estructura Salarial 55 Página 3: Equidad de Género 62 Página 4: Mapa Geográfico 69 Página 5: Zonas de Calor 75 Página 6: PLS Regresión 80 Página 7: PLS-PM Estructural 87 Página 8: Analítica con R 92 Página 9: Analítica con Python 97 Página 10: HTML y SVG 102 Página 11: Detalle por Cargo 108 Página 12: Conclusiones 113 Modo oscuro y claro con un botón 117 Guardar, publicar y compartir 121 Ejercicios integradores 123 Glosario 125", "l": []}, {"t": "3 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Respuestas 128 Referencias y créditos 135", "l": []}, {"t": "4 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Conocer el proyecto, instalar lo necesario y recorrer la pantalla de Power BI Desktop. Concepto · Power BI Desktop Concepto: Es como un taller gratuito de Microsoft donde conviertes tablas de números en tableros que se pueden mirar y filtrar. Definición: Aplicación de escritorio de Windows para conectar datos, modelarlos y crear informes interactivos. Uso: Aquí construimos el dashboard de la nómina del personal fijo: 12 páginas con tarjetas, gráficos, mapas y visuales de Python y R. Concepto · Informe, página y visual Concepto: Un informe es como un cuaderno; cada página es una hoja del cuaderno; cada visual es un dibujo o un número pegado en la hoja. Definición: Un informe contiene páginas; una página contiene visuales (tarjetas, gráficos, tablas, mapas) y segmentadores. Uso: Nuestro informe tiene 12 páginas y cada una tiene sus visuales; las pestañas están abajo. Concepto · Visual de script (Python y R) Concepto: Es un cuadro donde, en lugar de arrastrar un gráfico ya hecho, escribes un programa corto que dibuja el gráfico. Definición: Un visual de script ejecuta código de Python o R sobre las columnas que arrastras y muestra la imagen que el código dibuja. Uso: Lo usamos para el mapa de calor, el PLS, la curva de Lorenz y los gráficos de ggplot2. Al abrir el archivo hay que pulsar «Habilitar». Concepto · Tabla y columna Concepto: Una tabla es una hoja de cuadrícula; cada columna es un tipo de dato (por ejemplo, el cargo) y cada fila es un empleado. Definición: Una tabla organiza datos en filas (registros) y columnas (campos con un solo tipo de dato). Uso: La tabla Empleados tiene 2,187 filas (una por empleado) y 31 columnas. Instalar y comprobar el entorno Antes de empezar Capítulo 1 · 20 min Descarga e instala Power BI Desktop desde la tienda de Microsoft o desde el sitio oficial (es gratis). 1 Instala Python 3.11 y, en una terminal, ejecuta: pip install pandas matplotlib seaborn scikit-learn scipy xlrd. 2 Instala R 4.3.1 y, en R, ejecuta: install.packages(c(\"ggplot2\", \"dplyr\", \"scales\")). 3", "l": []}, {"t": "5 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 1. Cinta «Inicio» de Power BI Desktop: Obtener datos, Transformar datos, Actualizar, Nueva medida. Figura 2. Aviso «Habilitar objetos visuales de script» al abrir el archivo. Qué vas a construir Un dashboard de 12 páginas sobre la nómina del personal fijo de septiembre 2026 (2,187 empleados): resumen, estructura salarial, equidad de género, mapas, zonas de calor, análisis PLS, R, Python, gráficos SVG, detalle por cargo y 20 conclusiones. Todo en modo oscuro y modo claro. Instala antes de empezar Power BI Desktop (gratis, Windows), Python 3.11 con pandas, matplotlib, seaborn, scikit-learn y scipy, y R 4.3.1 con ggplot2. En Archivo > Opciones y configuración > Opciones > Creación de scripts de Python escribe la carpeta de Python (por ejemplo C:\\Program Files\\Python311). Autoría Desarrollado por Johan Tapia, PhD Ejercicio: Reconoce la pantalla Abre el archivo terminado y localiza: la cinta, el lienzo, el panel Filtros, el panel Visualizaciones, el panel Datos y las pestañas de página. ¿Cuántas páginas tiene el informe en total (mira «Página 1 de …» abajo) y por qué? Pistas: - Mira el indicador «Página 1 de …» abajo a la izquierda. - Piensa en el modo claro y oscuro. En Power BI Desktop abre Archivo > Opciones y configuración > Opciones > Creación de scripts de Python y escribe la carpeta de Python. 4 Abre la carpeta del proyecto y haz doble clic en «Nomina INFOTEP Sep2026.pbip» para ver el resultado final. 5 Cuando aparezca «Habilitar objetos visuales de script» pulsa Habilitar para que se vean los gráficos de Python y R. 6", "l": []}, {"t": "6 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Antes de empezar 1. ¿Para qué sirve un visual de Python en Power BI? A. Para dibujar un gráfico con un programa de Python sobre las columnas que arrastras B. Para conectar el informe a un servidor de correo C. Para traducir el informe a otro idioma 2. ¿Qué contiene un informe de Power BI? A. Páginas con visuales y segmentadores B. Solo una tabla de datos C. Solo medidas DAX 3. ¿Qué debes pulsar al abrir el archivo para ver los gráficos de Python y R? A. Habilitar B. Cancelar C. Revisión Verifica antes de seguir Tengo Power BI Desktop instalado Python 3.11 y R 4.3.1 instalados Configuré la carpeta de Python en las opciones Abrí el archivo final y habilité los scripts ¿Qué es Power Bi? | Capítulo 1 | CURSO DE POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. Descargar e Instalación de Power Bi Gratis El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=6VKJXQoGvxc"}, {"x": 51.18, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=SEqRPD7kyww"}]}, {"t": "7 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Conoce La Interfase de Power BI | CURSO DE POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. Formato de Página en Power Bi | Modificar el tamaño, alto, ancho, Imagen de fondo El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=ksAixZ7iY28"}, {"x": 51.18, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=ZIieZqev6lQ"}]}, {"t": "8 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Convertir la hoja de nómina de Excel a CSV limpios con Python y cargarlos en Power BI usando Power Query. Concepto · Archivo CSV Concepto: Es una hoja de cálculo guardada como texto simple, con los valores separados por comas. Definición: CSV (valores separados por comas) es un formato de texto que casi cualquier programa puede leer. Uso: preparar_datos.py convierte el Excel de la nómina en empleados.csv y en cinco CSV de resultados del PLS (pls_vip, pls_componentes, pls_resumen y los dos del modelo de caminos, plspm_caminos y plspm_cargas, que se cargan como las tablas PLS_Caminos y PLS_Cargas). Concepto · Power Query Concepto: Es la lavandería de los datos: recibe la tabla sucia, aplica pasos (quitar, cambiar, ordenar) y entrega la tabla limpia. Definición: Editor que guarda una lista de pasos aplicados (lenguaje M) para transformar los datos de origen antes de cargarlos al modelo. Uso: Con Transformar datos vemos la consulta Empleados con sus pasos Origen, Encabezados y Tipos. Concepto · Parámetro RutaDatos Concepto: Es una etiqueta con la dirección de la carpeta de los archivos; si cambias de computadora solo cambias la etiqueta. Definición: Un parámetro es un valor guardado que las consultas reutilizan; RutaDatos guarda la carpeta donde están los CSV. Uso: En Inicio > Transformar datos > Administrar parámetros (dentro del Editor de Power Query) cambias RutaDatos por tu carpeta (terminada en \\). Concepto · Tipo de dato Concepto: Es como decirle a cada columna si contiene texto, números enteros o números con decimales. Definición: El tipo de dato define cómo Power BI interpreta una columna (texto, entero, decimal, fecha...). Uso: Sueldo_Bruto es decimal; Region y Nivel son texto; No es entero. Con el tipo incorrecto la medida SUM no funciona. Concepto · Cerrar y aplicar Concepto: Es el botón que dice «ya terminé de limpiar, súbelo al tablero». Definición: Aplica los pasos de Power Query y carga las tablas resultantes al modelo de datos. Uso: Después de cargar los CSV pulsas Cerrar y aplicar y aparecen las tablas en el panel Datos. Preparar y conectar los datos Capítulo 2 · 30 min", "l": []}, {"t": "9 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Preparar los CSV con Python Cargar los CSV en Power BI Figura 3. Menú desplegable «Obtener datos» con la opción «Texto o CSV». Abre una terminal en la carpeta del proyecto. 1 Ejecuta: python preparar_datos.py 2 Comprueba que la carpeta datos contiene empleados.csv, pls_vip.csv, pls_componentes.csv, pls_resumen.csv, plspm_caminos.csv y plspm_cargas.csv. 3 En la cinta Inicio abre el menú «Obtener datos» y elige «Texto o CSV». 1 Selecciona empleados.csv y pulsa «Transformar datos» (no «Cargar»). 2 En el editor de Power Query comprueba los pasos aplicados: Origen, Encabezados y Tipos. 3 Revisa que Sueldo_Bruto, Sueldo_Neto, ISR, AFP y SFS sean números decimales y que Region, Nivel y Genero sean texto. 4 Repite con los otros cinco CSV (PLS_VIP, PLS_Componentes, PLS_Resumen, PLS_Caminos, PLS_Cargas). 5 Opcional: en el Editor de Power Query (Inicio > Transformar datos) abre Administrar parámetros > Nuevo parámetro y crea RutaDatos con la carpeta de los CSV y úsalo en la ruta de cada consulta. 6 Pulsa «Cerrar y aplicar». 7", "l": []}, {"t": "10 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 4. Editor de Power Query (Transformar datos): consultas a la izquierda, pasos aplicados a la derecha. De dónde vienen los datos El Excel «Nomina-Personal-Fijo-septiembre-2026.xls» (hoja Transparencia, encabezado en la fila 4) se limpia con el script preparar_datos.py: quita las comas de miles, separa el código del departamento, asigna región y provincia aproximadas, clasifica el nivel por cargo, calcula descuentos y corre el PLS. El resultado son seis CSV en la carpeta datos. Cuida la ruta RutaDatos debe terminar en una barra invertida (\\). Si Power BI no encuentra los archivos, revisa que la ruta sea la de TU carpeta de datos. Actualizar Si cambias un CSV, pulsa Inicio > Actualizar para recargar las tablas. Ejercicio: Comprueba la carga Después de cargar, ¿cuántas filas tiene la tabla Empleados y cuántas columnas? Compruébalo en la Vista de tabla. Pistas: - Mira la barra inferior de la Vista de tabla: «Tabla: Empleados (… filas)». - Cuenta las columnas en el panel Datos. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Preparar y conectar los datos 4. ¿Qué es Power Query? A. El editor donde aplicas pasos para limpiar y preparar los datos B. Un tipo de gráfico C. Un lenguaje para dibujar mapas", "l": []}, {"t": "11 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD 5. ¿Para qué sirve el parámetro RutaDatos? A. Para guardar la carpeta de los CSV y poder cambiarla en un solo lugar B. Para filtrar por región C. Para calcular el sueldo promedio 6. ¿Qué haces cuando terminas de revisar la consulta? A. Cerrar y aplicar B. Cerrar sin guardar C. Eliminar la consulta Verifica antes de seguir Existen los seis CSV en la carpeta datos La consulta Empleados muestra los pasos Origen, Encabezados y Tipos Los tipos de datos son correctos Las siete tablas aparecen en el panel Datos IMPORTAR DATOS DESDE ARCHIVO CSV y EXCEL | Curso de Microsoft Power BI El Tío Tech Refuerza este capítulo con una explicación en video. Preparando datos en Power Query | Curso de POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. Cambiar Configuración regional de Origen en Power Query El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 37.414, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=p2ewyOKQS7w"}, {"x": 51.18, "y": 37.414, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=C47X8Vr74lo"}, {"x": 7.311, "y": 57.369, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=Yj296tRLnQI"}]}, {"t": "12 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Entender las tablas, la tabla Medidas y por qué no hay relaciones. Concepto · Tabla y columna Concepto: Una tabla es una hoja de cuadrícula; cada columna es un tipo de dato (por ejemplo, el cargo) y cada fila es un empleado. Definición: Una tabla organiza datos en filas (registros) y columnas (campos con un solo tipo de dato). Uso: La tabla Empleados tiene 2,187 filas (una por empleado) y 31 columnas. Concepto · Modelo plano Concepto: Es una sola mesa grande con todos los datos en lugar de muchas mesas conectadas. Definición: Un modelo plano usa una tabla principal sin relaciones; los filtros funcionan porque todas las columnas están en la misma tabla. Uso: Empleados es la tabla principal. Las tablas PLS_* guardan resultados del análisis y no se relacionan con ella porque no comparten una columna clave. Concepto · Medida Concepto: Es una calculadora guardada: no es un dato fijo, sino una fórmula que da un resultado distinto según lo que filtres. Definición: Una medida DAX es una fórmula que se evalúa en el contexto de filtro de cada visual y devuelve un valor. Uso: Total Empleados (2,187) y Masa Neta (RD$ 136.6 millones) son medidas de la tabla Medidas. Concepto · Columna calculada Concepto: Es una columna nueva que se llena fila por fila con una fórmula y se queda guardada. Definición: Una columna calculada se evalúa al cargar los datos y agrega un dato fijo a cada fila. Uso: Sirve para clasificar filas, por ejemplo agrupar sueldos en rangos (en este proyecto Rango_Salarial lo creó el script de Python, pero también podrías crearlo en DAX). Para totales y porcentajes usamos medidas. Concepto · Categoría de datos Concepto: Es una etiqueta que le explica a Power BI qué significa una columna (por ejemplo, que es una latitud). Definición: La categoría de datos indica el tipo geográfico o de contenido de una columna o medida (Latitud, Longitud, URL de imagen). Uso: Latitud y Longitud tienen categoría geográfica; las medidas SVG tienen categoría «URL de imagen». El modelo de datos Capítulo 3 · 20 min", "l": []}, {"t": "13 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Explorar el modelo Figura 5. Vista de Modelo: las tablas Empleados, Medidas y PLS_* como cajas. Figura 6. Vista de Datos: la tabla Empleados con sus columnas. Haz clic en el ícono de Vista de modelo (barra izquierda, tercer ícono). 1 Observa las siete tablas: Empleados, Medidas, PLS_VIP, PLS_Componentes, PLS_Resumen, PLS_Caminos y PLS_Cargas; no hay líneas de relación. 2 Haz clic en el ícono de Vista de tabla (segundo ícono de la barra izquierda) para ver los 2,187 empleados. 3 Vuelve a la Vista de informe (primer ícono). 4 Abre el panel Datos y despliega Empleados: verás las 31 columnas; Latitud y Longitud llevan un globo (categoría geográfica). 5", "l": []}, {"t": "14 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD", "l": []}, {"t": "15 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD", "l": []}, {"t": "16 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Figura 7. Panel «Datos» (a la derecha) con las tablas y la tabla Medidas desplegada. Por qué no hay relaciones El modelo es plano: toda la información de la nómina está en la tabla Empleados. Las tablas PLS_* guardan resultados del análisis (importancia de variables, caminos...) y no comparten una columna clave con Empleados, por eso no se relacionan. La tabla Medidas Guardar todas las medidas en una tabla propia (sin datos, con una columna oculta «_») las ordena en un solo lugar; en el panel Datos se reconocen por el ícono de calculadora. Las carpetas de visualización las agrupan por tema. Cuidado al renombrar tablas Si cambias el nombre de una tabla o de una columna, revisa que las medidas que la usan sigan funcionando; si no, aparecerá un error en los visuales. Ejercicio: Lee el modelo Mira la tabla Empleados en la Vista de tabla. ¿Hay alguna columna con un valor distinto en cada fila (clave)? ¿Cuál? Pistas: - Busca una columna numérica que vaya de 1 a 2187. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · El modelo de datos 7. ¿Por qué las tablas PLS_* no tienen relación con Empleados? A. Porque no comparten una columna clave y son resultados del análisis B. Porque son tablas ocultas C. Porque Power BI no permite relacionar más de dos tablas 8. ¿Cuál es la diferencia entre una medida y una columna calculada? A. La medida se recalcula según los filtros; la columna calculada guarda un valor fijo por fila B. La medida es siempre un número entero C. No hay diferencia 9. ¿Qué hace la categoría de datos de Latitud? A. Indica a Power BI que la columna es una coordenada geográfica B. Cambia el color de la columna C. Convierte la columna en texto", "l": []}, {"t": "17 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Verifica antes de seguir Veo las siete tablas en la Vista de modelo Sé que Empleados tiene 2,187 filas Entiendo la diferencia entre medida y columna calculada Sé dónde está la tabla Medidas El Modelo de Datos en Power BI | CURSO BASICO DE POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. El Modelos de Datos en Power BI (Modelo en Estrella) El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 20.667, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=Vox4UcyBscg"}, {"x": 51.18, "y": 20.667, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=raEYVjnmqTw"}]}, {"t": "18 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Crear las 48 medidas del dashboard entendiendo cada fórmula Cómo crear CUALQUIER medida (siempre igual) Figura 8. Barra de fórmulas al elegir Modelado > Nueva medida, con una fórmula DAX escrita. Concepto · Medida vs. columna calculada Concepto: Una medida es una fórmula que se calcula al vuelo según lo que filtres; una columna calculada agrega un dato fijo a cada fila. Definición: Una medida DAX se evalúa en el contexto de filtro del visual y devuelve un valor. Una columna calculada se evalúa fila por fila al cargar los datos y se guarda en la tabla. Uso: Usa medidas para totales, promedios y porcentajes (cambian con los segmentadores); usa columnas para clasificar filas (por ejemplo, rango salarial). Las medidas DAX paso a paso Capítulo 4 · 120 min En el panel Datos, haz clic en la tabla «Medidas» (la que tiene solo medidas). 1 En la cinta, elige Modelado > Nueva medida (o clic derecho en la tabla > Nueva medida). 2 Aparece la barra de fórmulas con «Medida =». Borra «Medida» y escribe el nombre de la medida. 3 Escribe el signo = y luego la fórmula que se muestra en cada ficha de este capítulo. 4 Pulsa Enter. Aparece en el panel Datos con el ícono de calculadora. 5 En la cinta Herramientas de medición elige el formato (número, porcentaje, moneda) y la carpeta de visualización. 6 Arrastra la medida a un visual (por ejemplo una tarjeta) y comprueba que el resultado coincide con el de la ficha. 7", "l": []}, {"t": "19 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Concepto · Contexto de filtro Concepto: Es el «recorte» de datos con que Power BI calcula cada número: lo que eliges en segmentadores, filas y columnas del visual. Definición: El contexto de filtro es el conjunto de filtros activos que determinan qué filas ve una medida cuando se evalúa. Uso: Por eso la misma medida Total Empleados da 2,187 en una tarjeta y 762 en la barra de Sede Nacional. Carpeta 1. Plantilla En esta carpeta de la tabla Medidas están 7 medidas: Total Empleados, Mujeres, Hombres, Pct Mujeres, Participacion Empleados %, Con Otros Ingresos, Pct Con Otros Ingresos. Medida: Total Empleados ¿Para qué sirve? Cuenta cuántos empleados hay en la tabla. Fórmula: COUNTROWS(Empleados) La fórmula, pieza por pieza Parte Qué hace COUNTROWS Indica que se va a contar filas. (Empleados) Especifica la tabla donde se cuentan las filas. Resultado esperado Con todos los datos: 2,187. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis final Medida: Mujeres ¿Para qué sirve? Cuenta cuántas personas en la tabla Empleados son mujeres. Fórmula: CALCULATE([Total Empleados], Empleados[Genero] = \"Femenino\")", "l": []}, {"t": "20 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace CALCULATE Cambia el contexto de cálculo para aplicar filtros o modificar la forma en que se evalúa la medida. [Total Empleados] Es la medida que cuenta todos los empleados sin filtros. Empleados[Genero] = \"Femenino\" Filtra la tabla Empleados para incluir solo filas donde el género sea femenino. Resultado esperado Con todos los datos: 1,194. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis final o usar el nombre de columna incorrecto (por ejemplo, \"Genero\" en lugar de \"Género\"). Medida: Hombres ¿Para qué sirve? Cuenta cuántos empleados son hombres. Fórmula: CALCULATE([Total Empleados], Empleados[Genero] = \"Masculino\") La fórmula, pieza por pieza Parte Qué hace CALCULATE Indica que el cálculo debe hacerse con un contexto modificado. [Total Empleados] Es la medida que cuenta todos los empleados. Empleados[Genero] = \"Masculino\" Filtra la tabla para incluir solo filas donde el género sea masculino. Resultado esperado Con todos los datos: 993. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis de CALCULATE o usar comillas simples en lugar de dobles. Medida: Pct Mujeres ¿Para qué sirve? Calcula el porcentaje de mujeres dentro del total de empleados. Fórmula: DIVIDE([Mujeres], [Total Empleados])", "l": []}, {"t": "21 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace DIVIDE Divide el valor de la medida de mujeres por el valor de la medida de total de empleados, manejando el caso de división por cero sin error. [Mujeres] Representa la medida que cuenta cuántas filas de la tabla Empleados tienen Genero = 'Femenino'. [Total Empleados] Representa la medida que cuenta todas las filas de la tabla Empleados, sin filtrar por género. Resultado esperado Con todos los datos: 54.6 %. Sin ningún filtro puesto (todos los empleados). Error común Usar la sintaxis / en lugar de DIVIDE, lo que provoca un error cuando el total de empleados es cero. Medida: Participacion Empleados % ¿Para qué sirve? Calcular la participación de un grupo de empleados dentro del total Fórmula: DIVIDE([Total Empleados], CALCULATE([Total Empleados], ALLSELECTED(Empleados))) La fórmula, pieza por pieza Parte Qué hace DIVIDE Divide el numerador por el denominador y devuelve BLANK si el denominador es 0, evitando errores de división por cero. [Total Empleados] Es una medida que cuenta cuántos empleados hay en el contexto actual (por ejemplo, en un departamento o región). CALCULATE Cambia el contexto de filtro de la medida que sigue, permitiendo aplicar filtros adicionales o eliminar algunos. ALLSELECTED(Empleados) Mantiene todos los filtros que el usuario ha seleccionado en la visualización, excepto el filtro que se está evaluando, para obtener el total de empleados en el contexto global. Resultado esperado Con todos los datos: 100.0 %. Sin filtros vale 1 o 100 %; cambia al poner una región o un segmentador. Error común Olvidar usar ALLSELECTED y obtener 1 % en lugar de 10 % porque el filtro de la visualización se elimina.", "l": []}, {"t": "22 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Con Otros Ingresos ¿Para qué sirve? Cuenta cuántos empleados tienen ingresos adicionales mayores a cero. Fórmula: CALCULATE([Total Empleados], Empleados[Otros_Ingresos] > 0) La fórmula, pieza por pieza Parte Qué hace CALCULATE Función que cambia el contexto de cálculo y aplica filtros adicionales. [Total Empleados] Medida que devuelve el número total de empleados sin filtros. Empleados[Otros_Ingresos] > 0 Condición que filtra solo a los empleados cuyo campo Otros_Ingresos es mayor que cero. Resultado esperado Con todos los datos: 1,112. Sin ningún filtro puesto (todos los empleados). Error común Olvidar que CALCULATE necesita un filtro; usar la medida sin el filtro devuelve el total de todos los empleados. Medida: Pct Con Otros Ingresos ¿Para qué sirve? Calcular el porcentaje de empleados con ingresos adicionales respecto al total de empleados. Fórmula: DIVIDE([Con Otros Ingresos], [Total Empleados]) La fórmula, pieza por pieza Parte Qué hace DIVIDE Función que divide el primer valor por el segundo, evitando errores de división por cero. [Con Otros Ingresos] Mide cuántos empleados tienen ingresos adicionales. [Total Empleados] Cuenta el total de empleados en la tabla. Resultado esperado Con todos los datos: 50.8 %. Sin ningún filtro puesto (todos los empleados). Error común Olvidar usar corchetes alrededor de los nombres de medida, escribiendo Con Otros Ingresos en lugar de [Con Otros Ingresos].", "l": []}, {"t": "23 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Carpeta 2. Masa salarial En esta carpeta de la tabla Medidas están 5 medidas: Masa Bruta, Masa Neta, Masa Ingreso Total, Participacion Masa %, Ranking Region. Medida: Masa Bruta ¿Para qué sirve? Calcula el total de sueldos brutos de todos los empleados. Fórmula: SUM(Empleados[Sueldo_Bruto]) La fórmula, pieza por pieza Parte Qué hace SUM Indica que se va a sumar valores. (Empleados[Sueldo_Bruto]) Selecciona la columna Sueldo_Bruto de la tabla Empleados y la suma. Resultado esperado Con todos los datos: 184,974,270. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis o escribir la columna con mayúsculas incorrectas. Medida: Masa Neta ¿Para qué sirve? Calcula el total de sueldos netos de todos los empleados Fórmula: SUM(Empleados[Sueldo_Neto]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma valores (Empleados[Sueldo_Neto]) Indica que se suman los valores de la columna Sueldo_Neto de la tabla Empleados Resultado esperado Con todos los datos: 136,628,447. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis o usar la columna incorrecta", "l": []}, {"t": "24 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Masa Ingreso Total ¿Para qué sirve? Calcula la suma total de los ingresos de todos los empleados. Fórmula: SUM(Empleados[Ingreso_Total]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma todos los valores de una columna. Empleados[Ingreso_Total] Referencia a la columna Ingreso_Total de la tabla Empleados. Resultado esperado Con todos los datos: 212,259,542. Sin ningún filtro puesto (todos los empleados). Error común Escribir la fórmula sin los corchetes, por ejemplo SUM(Empleados Ingreso_Total). Medida: Participacion Masa % ¿Para qué sirve? Calcula el porcentaje de la masa neta de un subconjunto de empleados respecto a la masa neta total de los empleados seleccionados. Fórmula: DIVIDE([Masa Neta], CALCULATE([Masa Neta], ALLSELECTED(Empleados))) La fórmula, pieza por pieza Parte Qué hace DIVIDE Función que divide el numerador por el denominador y evita errores de división por cero. [Masa Neta] Valor total de sueldos netos del subconjunto actual. CALCULATE Cambia el contexto de cálculo para el denominador. ALLSELECTED(Empleados) Elimina filtros de la tabla Empleados, manteniendo solo los filtros de selección del informe. Resultado esperado Con todos los datos: 100.0 %. Sin filtros vale 1 o 100 %; cambia al poner una región o un segmentador. Error común Usar la división directa (/) en lugar de DIVIDE, lo que provoca errores cuando el denominador es cero.", "l": []}, {"t": "25 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Ranking Region ¿Para qué sirve? Clasifica cada región (entre las seleccionadas) según su masa neta total: 1 es la región con mayor masa neta, 2 la segunda, y así sucesivamente. Fórmula: RANKX(ALLSELECTED(Empleados[Region]), [Masa Neta], , DESC) La fórmula, pieza por pieza Parte Qué hace RANKX Evalúa una lista de valores y devuelve el rango de cada uno dentro de esa lista. ALLSELECTED(Empleados[Region]) Define la lista de valores como todas las regiones visibles en el filtro actual, sin limitarse a la fila actual. [Masa Neta] Es el valor que se compara para dar el rango: la masa salarial neta total de cada región. DESC Indica que el rango se asigna de mayor a menor (el mayor valor recibe 1). Resultado esperado Con todos los datos: 1. Sin filtros vale 1 o 100 %; cambia al poner una región o un segmentador. Error común Olvidar usar ALLSELECTED y, por tanto, el ranking se calcula sobre todas las regiones en lugar de por región. Carpeta 3. Distribucion En esta carpeta de la tabla Medidas están 8 medidas: Sueldo Bruto Prom, Sueldo Neto Prom, Mediana Bruto, Bruto P10, Bruto P90, Razon P90 P10, Coef Variacion, Sueldo Maximo. Medida: Sueldo Bruto Prom ¿Para qué sirve? Calcula el sueldo bruto promedio de todos los empleados. Fórmula: AVERAGE(Empleados[Sueldo_Bruto]) La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que toma una lista de números y devuelve su media aritmética. Empleados[Sueldo_Bruto] Referencia a la columna que contiene el sueldo bruto de cada empleado. Resultado esperado Con todos los datos: 84,579. Sin ningún filtro puesto (todos los empleados).", "l": []}, {"t": "26 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Error común Confundir SUM con AVERAGE y obtener el total en vez del promedio. Medida: Sueldo Neto Prom ¿Para qué sirve? Calcular el promedio del sueldo neto de todos los empleados. Fórmula: AVERAGE(Empleados[Sueldo_Neto]) La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que toma una columna y devuelve el valor medio de sus números. Empleados[Sueldo_Neto] Especifica la columna que contiene el sueldo neto de cada empleado. Resultado esperado Con todos los datos: 62,473. Sin ningún filtro puesto (todos los empleados). Error común Usar SUM en lugar de AVERAGE, lo que devuelve el total en vez del promedio. Medida: Mediana Bruto ¿Para qué sirve? Calcula el sueldo bruto que divide a los empleados en dos grupos iguales. Fórmula: MEDIAN(Empleados[Sueldo_Bruto]) La fórmula, pieza por pieza Parte Qué hace MEDIAN Función que devuelve la mediana de un conjunto de valores. ( Abre la lista de argumentos de la función. Empleados[Sueldo_Bruto] Selecciona la columna Sueldo_Bruto de la tabla Empleados. ) Cierra la lista de argumentos y finaliza la función. Resultado esperado Con todos los datos: 85,900. Sin ningún filtro puesto (todos los empleados). Error común Olvidar usar corchetes alrededor de la columna, escribiendo Empleados.Sueldo_Bruto en vez de Empleados[Sueldo_Bruto].", "l": []}, {"t": "27 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Bruto P10 ¿Para qué sirve? Calcula el sueldo bruto que separa el 10 % inferior de los empleados del resto. Fórmula: PERCENTILE.INC(Empleados[Sueldo_Bruto], 0.1) La fórmula, pieza por pieza Parte Qué hace PERCENTILE.INC Función que devuelve el percentil de un conjunto de valores. Empleados[Sueldo_Bruto] Lista de sueldos brutos de todos los empleados. 0.1 Indica que queremos el percentil 10 % (el 10 % inferior). Resultado esperado Con todos los datos: 30,600. Sin ningún filtro puesto (todos los empleados). Error común Usar 0.10 en lugar de 0.1, o confundir con 10 (que daría el percentil 1000 %). Medida: Bruto P90 ¿Para qué sirve? Calcula el sueldo bruto que marca el 90 % de los empleados con sueldos menores o iguales a él. Fórmula: PERCENTILE.INC(Empleados[Sueldo_Bruto], 0.9) La fórmula, pieza por pieza Parte Qué hace PERCENTILE.INC Función que devuelve el percentil de una lista de valores. Empleados[Sueldo_Bruto] Columna que contiene los sueldos brutos de todos los empleados. 0.9 Indica que queremos el percentil 90, es decir, el valor por debajo del cual cae el 90 % de los sueldos. Resultado esperado Con todos los datos: 137,060. Sin ningún filtro puesto (todos los empleados). Error común Confundir 0.9 con 90 o usar el percentil 0 en lugar del 90.", "l": []}, {"t": "28 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Razon P90 P10 ¿Para qué sirve? Calcula la relación entre el percentil 90 y el percentil 10 del sueldo bruto. Fórmula: DIVIDE([Bruto P90], [Bruto P10]) La fórmula, pieza por pieza Parte Qué hace DIVIDE Función que divide dos valores y evita errores por división por cero. [Bruto P90] Medida que devuelve el valor del percentil 90 del sueldo bruto. [Bruto P10] Medida que devuelve el valor del percentil 10 del sueldo bruto. Resultado esperado Con todos los datos: 4.5 veces. Sin ningún filtro puesto (todos los empleados). Error común Olvidar que DIVIDE necesita dos argumentos y usar una medida que no exista, provocando error de referencia. Medida: Coef Variacion ¿Para qué sirve? Mide la dispersión relativa de los sueldos brutos respecto a su promedio. Fórmula: DIVIDE(STDEV.P(Empleados[Sueldo_Bruto]), [Sueldo Bruto Prom]) La fórmula, pieza por pieza Parte Qué hace DIVIDE( Inicia la función que divide el numerador por el denominador y evita errores de división por cero. STDEV.P(Empleados[Sueldo_Bruto]) Calcula la desviación estándar poblacional de la columna Sueldo_Bruto, mostrando cuánto varían los sueldos. [Sueldo Bruto Prom]) Es la medida que devuelve el sueldo bruto promedio de todos los empleados, sirviendo como denominador. Resultado esperado Con todos los datos: 62.5 %. Sin ningún filtro puesto (todos los empleados). Error común Olvidar usar DIVIDE y dividir directamente, lo que provoca un error si el promedio es cero.", "l": []}, {"t": "29 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Sueldo Maximo ¿Para qué sirve? Muestra el sueldo bruto más alto de todos los empleados. Fórmula: MAX(Empleados[Sueldo_Bruto]) La fórmula, pieza por pieza Parte Qué hace MAX Función que busca el valor máximo dentro de un conjunto. Empleados[Sueldo_Bruto] Selecciona la columna Sueldo_Bruto de la tabla Empleados. Resultado esperado Con todos los datos: 718,640. Sin ningún filtro puesto (todos los empleados). Error común Escribir MIN en vez de MAX. Carpeta 4. Descuentos En esta carpeta de la tabla Medidas están 6 medidas: Descuentos Totales, ISR Total, AFP Total, SFS Total, Otros Desc Total, Pct Descuento. Medida: Descuentos Totales ¿Para qué sirve? Calcula la suma total de los descuentos de todos los empleados. Fórmula: SUM(Empleados[Descuentos_Total]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma valores numéricos. ( Abre la lista de argumentos de la función. Empleados[Descuentos_Total] Selecciona la columna que contiene los descuentos de cada empleado. ) Cierra la función SUM. Resultado esperado Con todos los datos: 75,631,094. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis al escribir la fórmula.", "l": []}, {"t": "30 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: ISR Total ¿Para qué sirve? Calcula el total de ISR pagado por todos los empleados Fórmula: SUM(Empleados[ISR]) La fórmula, pieza por pieza Parte Qué hace SUM Indica que se va a sumar valores ( Abre la lista de argumentos de la función Empleados[ISR] Selecciona la columna ISR de la tabla Empleados ) Cierra la función SUM Resultado esperado Con todos los datos: 22,092,046. Sin ningún filtro puesto (todos los empleados). Error común Olvidar colocar la función SUM y escribir simplemente Empleados[ISR] como medida, lo que provoca un error de sintaxis. Medida: AFP Total ¿Para qué sirve? Calcula el total de aportes a la AFP de todos los empleados. Fórmula: SUM(Empleados[AFP]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma todos los valores de una columna. Empleados[AFP] Referencia a la columna AFP de la tabla Empleados. Resultado esperado Con todos los datos: 5,291,069. Sin ningún filtro puesto (todos los empleados). Error común Olvidar que la medida debe estar en la tabla de Medidas y no en la tabla Empleados.", "l": []}, {"t": "31 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: SFS Total ¿Para qué sirve? Calcula el total de los valores de la columna SFS en la tabla Empleados. Fórmula: SUM(Empleados[SFS]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma todos los valores de una columna o expresión. Empleados[SFS] Referencia a la columna SFS dentro de la tabla Empleados. Resultado esperado Con todos los datos: 5,494,747. Sin ningún filtro puesto (todos los empleados). Error común Olvidar los corchetes alrededor de la columna, escribiendo SUM(Empleados.SFS) en lugar de SUM(Empleados[SFS]). Medida: Otros Desc Total ¿Para qué sirve? Calcula la suma total de los descuentos adicionales de todos los empleados. Fórmula: SUM(Empleados[Otros_Descuentos]) La fórmula, pieza por pieza Parte Qué hace SUM Función que suma valores numéricos. Empleados[Otros_Descuentos] Referencia a la columna que contiene los descuentos adicionales de cada empleado. SUM(Empleados[Otros_Descuentos]) Combina la función SUM con la columna para obtener el total de descuentos. Resultado esperado Con todos los datos: 42,753,233. Sin ningún filtro puesto (todos los empleados). Error común Olvidar los corchetes alrededor de la columna, escribiendo SUM(Empleados.Otros_Descuentos) en lugar de SUM(Empleados[Otros_Descuentos]).", "l": []}, {"t": "32 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Pct Descuento ¿Para qué sirve? Calcula el porcentaje de descuentos sobre el ingreso total Fórmula: DIVIDE([Descuentos Totales], [Masa Ingreso Total]) La fórmula, pieza por pieza Parte Qué hace DIVIDE Función que divide dos valores y evita errores de división por cero ([Descuentos Totales], Primer argumento: suma de todos los descuentos aplicados [Masa Ingreso Total]) Segundo argumento: suma del ingreso total de todos los empleados Resultado esperado Con todos los datos: 35.6 %. Sin ningún filtro puesto (todos los empleados). Error común Usar la barra de división (/) en lugar de DIVIDE, lo que provoca error cuando el ingreso total es cero Carpeta 5. Equidad En esta carpeta de la tabla Medidas están 3 medidas: Bruto Prom Mujeres, Bruto Prom Hombres, Brecha Genero %. Medida: Bruto Prom Mujeres ¿Para qué sirve? Calcula el sueldo bruto promedio solo de las mujeres. Fórmula: CALCULATE([Sueldo Bruto Prom], Empleados[Genero] = \"Femenino\") La fórmula, pieza por pieza Parte Qué hace CALCULATE Cambia el contexto de cálculo para aplicar filtros adicionales. [Sueldo Bruto Prom] Es la medida que ya devuelve el promedio del sueldo bruto de todos los empleados. Empleados[Genero] = \"Femenino\" Filtra la tabla Empleados para que solo se consideren las filas donde el género sea femenino. Resultado esperado Con todos los datos: 87,333. Sin ningún filtro puesto (todos los empleados).", "l": []}, {"t": "33 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Error común Olvidar cerrar el paréntesis final o usar comillas incorrectas en \"Femenino\". Medida: Bruto Prom Hombres ¿Para qué sirve? Calcular el promedio del sueldo bruto solo de los hombres. Fórmula: CALCULATE([Sueldo Bruto Prom], Empleados[Genero] = \"Masculino\") La fórmula, pieza por pieza Parte Qué hace CALCULATE( Inicia la función que permite cambiar el contexto de cálculo. [Sueldo Bruto Prom] Es la medida que ya calcula el promedio del sueldo bruto de todos los empleados. Empleados[Genero] = \"Masculino\" Filtra la tabla para que solo se consideren filas donde el género sea masculino. ) Cierra la función CALCULATE. Resultado esperado Con todos los datos: 81,268. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis de CALCULATE o usar comillas simples en lugar de dobles. Medida: Brecha Genero % ¿Para qué sirve? Calcular la brecha de género en porcentaje entre el sueldo bruto promedio de mujeres y hombres. Fórmula: DIVIDE([Bruto Prom Mujeres] - [Bruto Prom Hombres], [Bruto Prom Hombres]) La fórmula, pieza por pieza Parte Qué hace [Bruto Prom Mujeres] - [Bruto Prom Hombres] Obtiene la diferencia absoluta entre el sueldo bruto promedio de las mujeres y el de los hombres. DIVIDE(…, [Bruto Prom Hombres]) Divide la diferencia por el sueldo bruto promedio de los hombres, evitando errores de división por cero. DIVIDE([Bruto Prom Mujeres] - [Bruto Prom Hombres], [Bruto Prom Hombres]) Resultado final: la brecha de género expresada como porcentaje del sueldo bruto promedio masculino.", "l": []}, {"t": "34 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Resultado esperado Con todos los datos: 7.5 %. Sin ningún filtro puesto (todos los empleados). Error común Usar el operador / en lugar de DIVIDE, lo que puede generar un error cuando el sueldo promedio de hombres sea cero. Carpeta 6. SVG En esta carpeta de la tabla Medidas están 5 medidas: Barra Masa SVG, Barra Bruto SVG, Barra Area SVG, Gauge Mujeres SVG, Badge Brecha SVG. Medida: Barra Masa SVG ¿Para qué sirve? Dibuja una barra horizontal cuyo largo es la participación de cada región en la masa neta, comparada con la región más grande. Fórmula: VAR _p = [Participacion Masa %] VAR _mx = MAXX(ALLSELECTED(Empleados[Region]), [Participacion Masa %]) VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) RETURN \"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'; width='210' height='22'><rect x='0' y='5' width='\" & _w & \"' height='12' rx='4' fill='rgb(34,211,238)'/><text x='\" & (_w + 6) & \"' y='16' font-size='11' font-family='Segoe UI' fill='rgb(143,163,199)'>\" & FORMAT(_p, \"0.0%\") & \"<\/text><\/svg>\" La fórmula, pieza por pieza Parte Qué hace VAR _p = [Participacion Masa %] Guarda en una variable la participación de la región en la masa neta (por ejemplo 41.2 % para Sede Nacional). VAR _mx = MAXX(ALLSELECTED(Empleados[Region]), [Participacion Masa %]) Calcula cuál es la participación más alta entre todas las regiones; sirve de «100 %» de la barra. VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) Convierte la proporción en un ancho en píxeles (máximo 150). RETURN \"data:image/svg+xml;utf8,<svg ...><rect width=\" & _w & \" .../>\" Devuelve un texto SVG: un rectángulo del ancho calculado y un texto con el porcentaje. Con categoría de datos «URL de imagen» Power BI lo dibuja. Resultado esperado Una imagen vectorial (texto SVG), no un número: se ve como barra, medidor o semáforo dentro de la tabla o tarjeta. Error común Olvidar usar ALLSELECTED y la barra se calcula con todos los datos, no con la selección.", "l": [{"x": 40.339, "y": 41.958, "w": 24.203, "h": 1.336, "u": "http://www.w3.org/2000/svg'"}]}, {"t": "35 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Barra Bruto SVG ¿Para qué sirve? Dibuja una barra dorada con el sueldo bruto promedio de cada cargo, comparado con el cargo mejor pagado. Fórmula: VAR _p = [Sueldo Bruto Prom] VAR _mx = MAXX(ALLSELECTED(Empleados[Cargo]), [Sueldo Bruto Prom]) VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) RETURN \"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'; width='210' height='22'><rect x='0' y='5' width='\" & _w & \"' height='12' rx='4' fill='rgb(251,191,36)'/><text x='\" & (_w + 6) & \"' y='16' font-size='11' font-family='Segoe UI' fill='rgb(143,163,199)'>\" & FORMAT(_p, \"#,0\") & \"<\/text><\/svg>\" La fórmula, pieza por pieza Parte Qué hace VAR _p = [Sueldo Bruto Prom] Sueldo bruto promedio del cargo de la fila. VAR _mx = MAXX(ALLSELECTED(Empleados[Cargo]), [Sueldo Bruto Prom]) El mayor sueldo promedio entre los cargos visibles; es el largo máximo de la barra. VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) Largo de la barra en píxeles. RETURN \"data:image/svg+xml;utf8,<svg ...>\" Texto SVG con el rectángulo y la etiqueta del sueldo. Resultado esperado Una imagen vectorial (texto SVG), no un número: se ve como barra, medidor o semáforo dentro de la tabla o tarjeta. Error común Olvidar usar ALLSELECTED y la barra se calcula con todos los empleados, no solo con el cargo seleccionado. Medida: Barra Area SVG ¿Para qué sirve? Dibuja una barra violeta con el sueldo bruto promedio de cada área funcional. Fórmula: VAR _p = [Sueldo Bruto Prom] VAR _mx = MAXX(ALLSELECTED(Empleados[Area]), [Sueldo Bruto Prom]) VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) RETURN \"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'; width='210' height='22'><rect x='0' y='5' width='\" & _w & \"' height='12' rx='4' fill='rgb(167,139,250)'/><text x='\" & (_w + 6) & \"' y='16' font-size='11' font-family='Segoe UI' fill='rgb(143,163,199)'>\" & FORMAT(_p, \"#,0\") & \"<\/text><\/svg>\"", "l": [{"x": 13.488, "y": 17.727, "w": 24.203, "h": 1.336, "u": "http://www.w3.org/2000/svg'"}, {"x": 13.488, "y": 76.254, "w": 24.203, "h": 1.336, "u": "http://www.w3.org/2000/svg'"}]}, {"t": "36 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace VAR _p = [Sueldo Bruto Prom] Sueldo bruto promedio del área. VAR _mx = MAXX(ALLSELECTED(Empleados[Area]), [Sueldo Bruto Prom]) El mayor promedio entre las áreas. VAR _w = ROUND(DIVIDE(_p, _mx) * 150, 0) Largo de la barra. RETURN \"data:image/svg+xml;utf8, <svg ...>\" Texto SVG con el dibujo. Resultado esperado Una imagen vectorial (texto SVG), no un número: se ve como barra, medidor o semáforo dentro de la tabla o tarjeta. Error común Olvidar cerrar la comilla en la cadena SVG, lo que provoca un error de sintaxis. Medida: Gauge Mujeres SVG ¿Para qué sirve? Dibuja un medidor semicircular que muestra el porcentaje de mujeres en la plantilla. Fórmula: (medida SVG: genera una imagen vectorial; ver DAX completo en construir.py) La fórmula, pieza por pieza Parte Qué hace VAR _p = [Pct Mujeres] Porcentaje de mujeres (54.6 % con todos los datos). VAR _a = PI() * (1 - _p) Convierte el porcentaje en un ángulo del semicírculo (0 % = 180°, 100 % = 0°). VAR _x = FORMAT(100 + 80 * COS(_a), \"0.0\", \"en- US\") y VAR _y = FORMAT(100 - 80 * SIN(_a), \"0.0\", \"en-US\") Calculan el punto final del arco con seno y coseno; FORMAT con «en-US» evita comas decimales. RETURN \"data:image/svg+xml;utf8, <svg ...><path d='M20 100 A80 80 0 0 1 \" & _x & \" \" & _y & \"' .../>\" Dibuja el arco gris de fondo, el arco rosado hasta el punto calculado y el texto con el porcentaje.", "l": []}, {"t": "37 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Resultado esperado Una imagen vectorial (texto SVG), no un número: se ve como barra, medidor o semáforo dentro de la tabla o tarjeta. Error común Olvidar cerrar la función RETURN o usar comillas simples en lugar de dobles dentro del SVG, lo que provoca un error de sintaxis. Medida: Badge Brecha SVG ¿Para qué sirve? Dibuja un semáforo con la brecha salarial de género: verde si es menor de 5 %, ámbar si es menor de 15 % y rosa si es mayor. Fórmula: (medida SVG: genera una imagen vectorial; ver DAX completo en construir.py) La fórmula, pieza por pieza Parte Qué hace VAR _b = [Brecha Genero %] Brecha entre el sueldo bruto promedio de mujeres y hombres (+7.5 % con todos los datos). VAR _c = IF(ABS(_b) < 0.05, \"rgb(52,211,153)\", IF(ABS(_b) < 0.15, \"rgb(251,191,36)\", \"rgb(244,63,142)\")) Elige el color según el tamaño de la brecha (valor absoluto). VAR _t = IF(_b < 0, \"Mujeres ... menos\", \"Mujeres ... mas\") Arma el texto «Mujeres 7.5 % más» o «menos» según el signo. RETURN \"data:image/svg+xml;utf8, <svg ...>\" Texto SVG con el círculo de color, el símbolo ⚖ y el texto. Resultado esperado Una imagen vectorial (texto SVG), no un número: se ve como barra, medidor o semáforo dentro de la tabla o tarjeta. Error común Olvidar usar el operador & para concatenar texto con variables dentro del RETURN. Carpeta 8. Mapas En esta carpeta de la tabla Medidas están 4 medidas: Lat Sede, Lon Sede, Lat Punto, Lon Punto.", "l": []}, {"t": "38 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Medida: Lat Sede ¿Para qué sirve? Calcula el promedio de la latitud de los empleados en una sede. Fórmula: AVERAGE(Empleados[Latitud]) La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que devuelve el valor medio de una columna. Empleados[Latitud] Referencia a la columna de latitud dentro de la tabla Empleados. Resultado esperado Con todos los datos: 18.626. Sin ningún filtro puesto (todos los empleados). Error común Usar SUM en lugar de AVERAGE, lo que devuelve la suma total de latitudes. Medida: Lon Sede ¿Para qué sirve? Calcula el promedio de la longitud de los empleados en la tabla Empleados. Fórmula: AVERAGE(Empleados[Longitud]) La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que devuelve el valor medio de una columna. Empleados[Longitud] Referencia a la columna Longitud dentro de la tabla Empleados. Resultado esperado Con todos los datos: -70.058. Sin ningún filtro puesto (todos los empleados). Error común Escribir la fórmula sin paréntesis o usar un nombre de columna incorrecto, por ejemplo AVERAGE(Empleados.Longitud). Medida: Lat Punto ¿Para qué sirve? Calcula el promedio de la latitud de los empleados Fórmula: AVERAGE(Empleados[Lat_Punto])", "l": []}, {"t": "39 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que devuelve el valor medio de una columna Empleados[Lat_Punto] Referencia a la columna que contiene la latitud de cada empleado Lat_Punto Columna que almacena la latitud (en grados) de cada punto de ubicación Resultado esperado Con todos los datos: 18.624. Sin ningún filtro puesto (todos los empleados). Error común Usar SUM en lugar de AVERAGE, lo que devuelve la suma total de latitudes Medida: Lon Punto ¿Para qué sirve? Calcula el promedio de los valores de Lon_Punto en la tabla Empleados Fórmula: AVERAGE(Empleados[Lon_Punto]) La fórmula, pieza por pieza Parte Qué hace AVERAGE Función que devuelve el valor medio de una columna Empleados[Lon_Punto] Referencia a la columna Lon_Punto dentro de la tabla Empleados () Paréntesis que indican que la función recibe un argumento Resultado esperado Con todos los datos: -70.058. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis final Carpeta 7. PLS En esta carpeta de la tabla Medidas están 10 medidas: R2 PLS, Q2 PLS, Componentes PLS, Variables PLS, VIP, Coef PLS, Q2 Componente, Beta Camino…. Medida: R2 PLS ¿Para qué sirve? Muestra el mayor valor de R² del modelo PLS Fórmula: MAX(PLS_Resumen[R2])", "l": []}, {"t": "40 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace MAX Selecciona el valor más alto de una columna o expresión PLS_Resumen[R2] Hace referencia a la columna R2 dentro de la tabla PLS_Resumen, que contiene los coeficientes R² de cada modelo Resultado esperado Con todos los datos: 0.755. Sin ningún filtro puesto (todos los empleados). Error común Olvidar que la medida devuelve un número y no una tabla Medida: Q2 PLS ¿Para qué sirve? Encuentra el valor más alto de la columna Q2 en la tabla PLS_Resumen. Fórmula: MAX(PLS_Resumen[Q2]) La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el número mayor entre todos los valores de una columna. PLS_Resumen[Q2] Referencia a la columna Q2 dentro de la tabla PLS_Resumen. Resultado esperado Con todos los datos: 0.749. Sin ningún filtro puesto (todos los empleados). Error común Usar MAX en lugar de MAXX cuando la columna contiene valores nulos o se necesita un cálculo por fila. Medida: Componentes PLS ¿Para qué sirve? Encuentra el valor más alto de la columna Componentes en la tabla PLS_Resumen Fórmula: MAX(PLS_Resumen[Componentes])", "l": []}, {"t": "41 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el número mayor entre todos los valores de una columna o expresión PLS_Resumen[Componentes] Columna Componentes de la tabla PLS_Resumen: indica cuántos componentes (variables latentes) usa el modelo PLS. Resultado esperado Con todos los datos: 3. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis de MAX o escribir el nombre de la tabla/columna con mayúsculas/minúsculas incorrectas Medida: Variables PLS ¿Para qué sirve? Encuentra el valor más alto de la columna Variables en la tabla PLS_Resumen Fórmula: MAX(PLS_Resumen[Variables]) La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el número mayor entre los valores que recibe PLS_Resumen Nombre de la tabla donde se busca la columna [Variables] La columna que contiene los valores a comparar Resultado esperado Con todos los datos: 22. Sin ningún filtro puesto (todos los empleados). Error común Escribir la columna sin los corchetes, por ejemplo PLS_Resumen.Variables en lugar de PLS_Resumen[Variables] Medida: VIP ¿Para qué sirve? Encuentra el valor más alto de la columna VIP en la tabla PLS_VIP. Fórmula: MAX(PLS_VIP[VIP])", "l": []}, {"t": "42 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el número mayor entre los valores que le entregues. PLS_VIP Tabla de resultados del PLS que guarda, por variable, su importancia VIP (Variable Importance in Projection) y su coeficiente; no contiene empleados. [VIP] La columna que contiene los valores que queremos comparar. Resultado esperado Con todos los datos: 3.44. Sin ningún filtro puesto (todos los empleados). Error común Escribir la fórmula sin los corchetes, por ejemplo MAX(PLS_VIP.VIP) en lugar de MAX(PLS_VIP[VIP]) Medida: Coef PLS ¿Para qué sirve? Obtiene el valor máximo del coeficiente de PLS para usarlo en análisis de nómina. Fórmula: MAX(PLS_VIP[Coeficiente]) La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el mayor valor de una columna o expresión. PLS_VIP[Coeficiente] Referencia a la columna 'Coeficiente' dentro de la tabla 'PLS_VIP', que contiene los valores calculados de la regresión PLS. Resultado esperado Con todos los datos: 0.771. Sin ningún filtro puesto (todos los empleados). Error común Olvidar que la medida devuelve un solo número y no un rango; usarla como si fuera una columna. Medida: Q2 Componente ¿Para qué sirve? Encuentra el valor más alto de la columna Q2_validacion_cruzada en la tabla PLS_Componentes. Fórmula: MAX(PLS_Componentes[Q2_validacion_cruzada])", "l": []}, {"t": "43 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el valor máximo entre los valores de una columna o expresión. PLS_Componentes[Q2_validacion_cruzada] Referencia a la columna Q2_validacion_cruzada dentro de la tabla PLS_Componentes. Resultado esperado Con todos los datos: 0.750. Sin ningún filtro puesto (todos los empleados). Error común Usar MAX en una columna con datos no numéricos, lo que genera un error de tipo. Medida: Beta Camino ¿Para qué sirve? Encuentra el valor máximo de Coeficiente_camino en la tabla PLS_Caminos. Fórmula: MAX(PLS_Caminos[Coeficiente_camino]) La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el mayor número de un conjunto. PLS_Caminos[Coeficiente_camino] Referencia a la columna Coeficiente_camino dentro de la tabla PLS_Caminos. Resultado esperado Con todos los datos: 1.24. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis de MAX o usar comillas en lugar de corchetes. Medida: R2 Destino ¿Para qué sirve? Obtiene el valor más alto de la columna R2_destino en la tabla PLS_Caminos. Fórmula: MAX(PLS_Caminos[R2_destino])", "l": []}, {"t": "44 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el número máximo de un conjunto de valores. ( Indica el inicio de los argumentos de la función. PLS_Caminos[R2_destino] Especifica la columna R2_destino dentro de la tabla PLS_Caminos. ) Cierra la lista de argumentos de la función. Resultado esperado Con todos los datos: 0.86. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar el paréntesis o usar comillas en lugar de corchetes para la columna. Medida: Carga Indicador ¿Para qué sirve? Encuentra el valor máximo de la columna Carga en la tabla PLS_Cargas. Fórmula: MAX(PLS_Cargas[Carga]) La fórmula, pieza por pieza Parte Qué hace MAX Función que devuelve el mayor valor de una lista o columna. PLS_Cargas[Carga] Referencia a la columna Carga dentro de la tabla PLS_Cargas. Resultado esperado Con todos los datos: 0.98. Sin ningún filtro puesto (todos los empleados). Error común Olvidar cerrar los corchetes o usar comillas en la referencia, por ejemplo escribir PLS_Cargas[Carga] sin el corchete final. Ejercicio: Tu primera medida Crea la medida «Pct Hombres» que dé el porcentaje de hombres en la plantilla y muéstrala en una tarjeta. Pistas: - Usa CALCULATE como en Mujeres - Divide con DIVIDE entre [Total Empleados]", "l": []}, {"t": "45 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Las medidas DAX paso a paso 10. ¿Qué hace COUNTROWS(Empleados)? A. Cuenta las filas de la tabla B. Suma los sueldos C. Promedia las edades 11. ¿Por qué usamos DIVIDE en lugar de /? A. Evita errores si el divisor es cero B. Es más rápido siempre C. Porque / no existe en DAX 12. ¿Cuándo prefieres una medida a una columna calculada? A. Cuando el valor debe cambiar con los filtros B. Cuando necesito clasificar cada fila C. Nunca Verifica antes de seguir Existe la tabla Medidas con ícono de calculadora Total Empleados muestra 2,187 Las medidas están en carpetas Entiendo la diferencia entre medida y columna Funciones Dax para Principantes | Curso gratis de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video. Recomendaciones para Medidas DAX que todos deberían conocer | Power BI El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=2ztgPMxFeBQ"}, {"x": 51.18, "y": 63.337, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=_ZQzqIXtSAk"}]}, {"t": "46 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Las Funciones SUM & SUMX en Power BI (Ejercicios) | Curso Power Bi El Tío Tech Refuerza este capítulo con una explicación en video. Como usar la Función CountRows en Power BI El Tío Tech Refuerza este capítulo con una explicación en video. Para leer más Cómo crear medidas DAX con SVG en Power BI (Chandoo): https://chandoo.org/wp/how-to-svg-dax- measures-power-bi", "l": [{"x": 7.311, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=KL3BoCW4r04"}, {"x": 51.18, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=lZuXqvV50Hg"}, {"x": 55.214, "y": 28.15, "w": 29.876, "h": 1.514, "u": "https://chandoo.org/wp/how-to-svg-dax-measures-power-bi"}, {"x": 12.606, "y": 29.753, "w": 13.993, "h": 1.514, "u": "https://chandoo.org/wp/how-to-svg-dax-measures-power-bi"}]}, {"t": "47 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página de resumen ejecutivo de la nómina de septiembre 2026 con tarjetas de KPI, gráficos de distribución y una tabla de cargos, usando segmentadores para filtrar por región, nivel y género. Concepto · Segmentador Concepto: Es un control de la pantalla, como un menú de opciones, que filtra todo lo demás. Definición: Un segmentador filtra los visuales de la página según los valores de una columna elegida. Uso: Región, Nivel jerárquico, Género y Área funcional son segmentadores desplegables; están sincronizados entre las páginas. Concepto · Tarjeta Concepto: Es un cuadro que muestra un solo número grande, como el marcador de un partido. Definición: Una tarjeta muestra el valor de una medida o campo como indicador clave (KPI). Uso: En la página 1: Empleados fijos 2,187; Masa neta 137 mill.; Sueldo bruto promedio 85 mil; Mediana 86 mil; % Mujeres 54.6 %. Concepto · Gráfico de columnas Concepto: Son barras verticales; cuanto más alta la barra, mayor el valor. Definición: Un gráfico de columnas agrupadas compara el valor de una medida entre categorías. Uso: «Empleados por región»: Sede Nacional tiene la columna más alta (762 empleados). Concepto · Gráfico de anillos (dona) Concepto: Es una pizza con un hueco al centro: cada trozo es la parte de un todo. Definición: Un gráfico de anillos muestra la proporción de cada categoría respecto al total. Uso: «Plantilla por nivel jerárquico»: el nivel 3-Profesional/Técnico es el trozo más grande (823 personas). Concepto · Gráfico de barras Concepto: Son barras horizontales, ideales cuando los nombres de las categorías son largos. Definición: Un gráfico de barras compara medidas entre categorías con barras horizontales. Uso: «Masa salarial neta por área» (página 1) y «Empleados por región» (página 4) comparan categorías con barras horizontales. Página 1: Resumen Ejecutivo Capítulo 5 · 30 min", "l": []}, {"t": "48 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Concepto · Treemap Concepto: Son rectángulos de distinto tamaño, como un mapa de propiedades: el rectángulo grande pesa más. Definición: Un treemap representa categorías como rectángulos cuya área es proporcional al valor. Uso: «Plantilla por área funcional»: Administrativo y Apoyo ocupa el rectángulo mayor (1,112 empleados). Concepto · Tabla y matriz Concepto: La tabla es una lista ordenada; la matriz es una tabla de doble entrada, como una tabla de multiplicar. Definición: Una tabla lista columnas y medidas; una matriz cruza categorías en filas y columnas. Uso: Cargos (tabla) y Región × Nivel (matriz) en las páginas 1 y 11. Paso 0 · Crear la página y su título Etapa 1 · Segmentadores y tarjetas (1) Etapa 1 · Segmentadores y tarjetas (2) Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «1. Resumen Ejecutivo». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «Nómina del Personal Fijo · Septiembre 2026 · Resumen ejecutivo». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4 En Formato > General > Propiedades > Tamaño y posición: X 20, Y 0, Ancho 1090, Alto 42. 5 Región: En el panel Visualizaciones haz clic en el ícono «Segmentación de datos»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Region» al pozo «Campo». 2 En Formato > Segmentación de datos > Opciones elige el estilo «Desplegable»; apaga el «Encabezado de segmentación». 3 En Formato > General > Título escribe «Región». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 20, Y 42, Ancho 300, Alto 66. ómina en Power BI · Desarrollado por Johan Tapia, PhD Etapa 3 · Visuales restantes (3) Figura 11. Página «1. Resumen Ejecutivo» terminada, modo oscuro. Ajustes finales Regla de los segundos Pon los segmentadores y las tarjetas arriba: en 3 segundos el lector ve los indicadores; en 30 segundos entiende la distribución; en más tiempo explora el detalle. En Formato > General > Título escribe «Plantilla por área funcional». 4 En Formato > General > Propiedades > Tamaño y posición escribe: X 440, Y 464, Ancho 400, Alto 248. 5 Cargos: plantilla y sueldo promedio: En el panel Visualizaciones haz clic en el ícono «Tabla»; aparece un cuadro vacío en el lienzo. 1 Del panel Datos abre la tabla «Empleados» y arrastra «Cargo» al pozo «Columnas». 2 Del panel Datos abre la tabla «Medidas» y arrastra «Total Empleados» al pozo «Columnas». 3 Del panel Datos abre la tabla «Medidas» y arrastra «Sueldo Bruto Prom» al pozo «Columnas». 4 En Formato > General > Título escribe «Cargos: plantilla y sueldo promedio». 5 En Formato > General > Propiedades > Tamaño y posición escribe: X 850, Y 464, Ancho 410, Alto 248. 6 En «Cargos: plantilla y sueldo promedio» abre los tres puntos (…) > Ordenar eje > «Total Empleados» y elige el orden descendente. 1 En «Masa salarial neta por área (RD$)» abre los tres puntos (…) > Ordenar eje > «Masa Neta» y elige el orden descendente. 2 En «Empleados por región» abre los tres puntos (…) > Ordenar eje > «Total Empleados» y elige el orden descendente. 3 En «Empleados por rango salarial (bruto)» abre los tres puntos (…) > Ordenar eje > «Rango_Salarial» y elige el orden ascendente. 4", "l": []}, {"t": "53 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Alinear Selecciona varios visuales con Ctrl+clic y usa Formato > Alinear para dejarlos en fila. Ejercicio: Un indicador nuevo Agrega una tarjeta «Hombres» con la medida Hombres. ¿Qué valor debe mostrar con todos los datos? Pistas: - Arrastra Medidas > Hombres al pozo Campos de una tarjeta. Preguntas de análisis 1. Resuélvelo en tu archivo y compara tu resultado con la solución del anexo «Respuestas». Autoevaluación · Página 1: Resumen Ejecutivo 13. ¿Qué visual muestra un solo número grande? A. Tarjeta B. Treemap C. Matriz 14. ¿Qué región tiene más empleados? A. Sede Nacional (762) B. Costa Norte C. Cibao Sur 15. Si eliges «Femenino» en el segmentador Género, ¿qué cambia? A. Cambian los valores de los visuales de la página que dependen del género B. Nada, solo es decorativo C. Solo cambia el título Verifica la página 1 Las cuatro segmentaciones filtran todos los visuales Las seis tarjetas muestran 2,187 / 137 mill. / 85 mil / 86 mil / 54.6 % / 35.6 % El treemap muestra 6 áreas La tabla de cargos está ordenada por plantilla", "l": []}, {"t": "54 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Gráfico Circular, Columnas, Barras y Tablas Power BI | Curso de POWER BI El Tío Tech Refuerza este capítulo con una explicación en video. Insertar Tarjetas y Filtros Slicers (Segmentación de Datos) | Curso de Power BI El Tío Tech Refuerza este capítulo con una explicación en video. Aplicar Formato a las Visualizaciones de Power BI (Gráficos, Tarjetas y Segmentación de datos) El Tío Tech Refuerza este capítulo con una explicación en video. Visualización de tipo TreeMap de Power BI | Curso gratis de Power Bi El Tío Tech Refuerza este capítulo con una explicación en video.", "l": [{"x": 7.311, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=zYqYF-9VyCQ"}, {"x": 51.18, "y": 5.434, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=N8a1xZnAYWc"}, {"x": 7.311, "y": 25.388, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=9QDs3RliyjU"}, {"x": 51.18, "y": 25.388, "w": 41.725, "h": 18.44, "u": "https://www.youtube.com/watch?v=ouCKI9PqoVw"}]}, {"t": "55 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD Construir la página «2. Estructura Salarial» paso a paso, mostrando cómo se distribuyen los sueldos y los descuentos. Concepto · Percentil y mediana Concepto: La mediana es el sueldo del que queda justo en el medio si los pones en fila; el percentil 90 es el sueldo que supera al 90 % de la gente. Definición: La mediana es el percentil 50: divide los datos en dos mitades. El percentil P es el valor bajo el cual queda el P % de las observaciones. Uso: Bruto P10 = 30,600 y Bruto P90 = 137,060: el percentil 90 gana 4.5 veces el percentil 10. Concepto · Gráfico de barras apiladas Concepto: Son barras donde cada color es un pedacito del total. Definición: Un gráfico apilado divide cada barra en partes que se suman. Uso: «Descuentos por nivel» apila ISR, AFP, SFS y Otros descuentos. Concepto · Gráfico de dispersión Concepto: Es un plano con puntos: cada punto es un grupo y su posición dice dos cosas a la vez. Definición: Un gráfico de dispersión ubica cada elemento según dos medidas (X e Y); el tamaño de la burbuja puede mostrar una tercera. Uso: Cada burbuja es un departamento: X = empleados, Y = sueldo bruto promedio, tamaño = masa neta. Concepto · Gráfico de columnas Concepto: Son barras verticales; cuanto más alta la barra, mayor el valor. Definición: Un gráfico de columnas agrupadas compara el valor de una medida entre categorías. Uso: «Empleados por región»: Sede Nacional tiene la columna más alta (762 empleados). Paso 0 · Crear la página y su título Página 2: Estructura Salarial Capítulo 6 · 30 min Haz clic en el «+» junto a las pestañas de página (abajo) para insertar una página nueva. 1 Clic derecho en la pestaña > Cambiar nombre > escribe «2. Estructura Salarial». 2 Con la página seleccionada, en el panel Formato abre «Página > Fondo de lienzo»: color #0A1222 y transparencia 0 %. 3 En la cinta Insertar elige «Cuadro de texto» y escribe: «¿Cómo se distribuyen los sueldos? Estructura salarial y descuentos». Fuente Segoe UI Semibold, 17 pt, negrita, color blanco. 4", "l": []}, {"t": "56 Dashboard de Nómina en Power BI · Desarrollado por Johan Tapia, PhD
