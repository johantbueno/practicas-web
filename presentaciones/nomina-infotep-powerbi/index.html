function medir() {
  const r = stage.getBoundingClientRect();
  const aw = r.width - (r.width > 700 ? 120 : 16), ah = r.height - 16; // los lados dejan sitio a las flechas
  two = aw >= ah * 1.05 && r.width >= 640;
  let h = two ? Math.min(ah, aw / 2 / ratio) : Math.min(ah, aw / ratio);
  ph = Math.floor(h); pw = Math.floor(h * ratio);
}
function build(start) {
  if (pf) { try { pf.destroy(); } catch (e) {} pf = null; }
  medir();
  const el = document.createElement("div"); el.className = "book";
  el.style.width = (two ? 2 * pw : pw) + "px"; el.style.height = ph + "px";
  stage.insertBefore(el, stage.firstChild);
  const pages = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement("div"); d.className = "page";
    d.dataset.density = (i === 0 || i === N - 1) ? "hard" : "soft";
    const im = document.createElement("img"); im.src = "p/" + pad(i + 1) + ".webp"; im.alt = "Página " + (i + 1); im.draggable = false;
    d.appendChild(im); linksHtml(i, d); pages.push(d);
  }
  pf = new St.PageFlip(el, { width: pw, height: ph, size: "fixed", showCover: true, usePortrait: true, autoSize: false,
    maxShadowOpacity: 0.45, flippingTime: 750, mobileScrollSupport: false, disableFlipByClick: true, clickEventForward: true,
    swipeDistance: 25, startPage: izq(start) });
  pf.loadFromHTML(pages);
  pf.on("flip", (e) => { idx = e.data; actualizar(); });
  pf.on("changeState", (e) => { if (e.data === "flipping") snd(); });
  idx = pf.getCurrentPageIndex();
  el.addEventListener("dblclick", (ev) => { if (!ev.target.closest("a")) abrirZoom(ev.clientX, ev.clientY); });
  actualizar();
}
function actualizar() {
  const v = visibles(idx), a = v[0] + 1, b = v[v.length - 1] + 1;
  $("#pgInd").textContent = (a === b ? "pág. " + a : "págs. " + a + "–" + b) + " de " + N;
  $("#pgIn").value = a; $("#scrub").value = a;
  $("#prev").disabled = idx <= 0; $("#next").disabled = v[v.length - 1] >= N - 1;
  const el = stage.querySelector(".book");
  if (el && !zoomOn) { // centrar la portada y la contraportada cuando están solas
    let tx = 0;
    if (two && idx === 0) tx = -25; else if (two && N % 2 === 0 && v[0] === N - 1) tx = 25;
    el.style.transform = tx ? `translateX(${tx}%)` : "";
  }
  document.querySelectorAll(".th button,.toc a").forEach((e) => e.classList.toggle("cur", v.includes(+e.dataset.p - 1)));
  try { history.replaceState(null, "", "#p=" + a); } catch (e) {}
}
function go(i, anim) {
  i = izq(i);
  if (zoomOn) { idx = i; try { pf.turnToPage(i); } catch (e) {} snd(); actualizar(); armarHoja(true); return; }
  if (anim === false || Math.abs(i - idx) > 6) { pf.turnToPage(i); idx = i; actualizar(); snd(); }
  else pf.flip(i);
}
function sig() { const v = visibles(idx); const n = v[v.length - 1] + 1; if (n < N) go(n); }
function ant() { if (idx <= 0) return; go(two ? (idx <= 2 ? 0 : idx - 2) : idx - 1); }

/* ---------- zoom con arrastre, rueda y pellizco (usa las páginas en alta resolución) ---------- */
let S = { s: 1, x: 0, y: 0, w: 0, h: 0 };
const zinfo = $("#zinfo");
function armarHoja(conservar) {
  const v = visibles(idx), r = stage.getBoundingClientRect();
  const aw = r.width - 16, ah = r.height - 16;
  const k = v.length;
  const h = Math.min(ah, aw / (k * ratio));
  S.w = Math.floor(h * ratio * k); S.h = Math.floor(h);
  sheet.style.width = S.w + "px"; sheet.style.height = S.h + "px"; sheet.innerHTML = "";
  v.forEach((p) => {
    const d = document.createElement("div"); d.className = "pp"; d.style.width = (S.w / k) + "px"; d.style.height = S.h + "px";
    const im = document.createElement("img"); im.src = "p/" + pad(p + 1) + ".webp"; im.alt = "Página " + (p + 1);
    const hd = new Image(); hd.onload = () => { if (im.isConnected) im.src = hd.src; }; hd.src = "hd/" + pad(p + 1) + ".webp";
    d.appendChild(im); linksHtml(p, d); sheet.appendChild(d);
  });
  if (!conservar) S.s = 1;
  colocar(r.width / 2, r.height / 2, null);
}
function limitar() {
  const r = stage.getBoundingClientRect(), W = S.w * S.s, H = S.h * S.s;
  S.x = W <= r.width ? (r.width - W) / 2 : Math.min(0, Math.max(r.width - W, S.x));
  S.y = H <= r.height ? (r.height - H) / 2 : Math.min(0, Math.max(r.height - H, S.y));
}
function pintar() {
  limitar();
  sheet.style.transform = `translate(${S.x}px,${S.y}px) scale(${S.s})`;
  zinfo.textContent = Math.round(S.s * 100) + " %";
}
function colocar(cx, cy, previo) { // mantiene fijo el punto (cx,cy) al cambiar de escala
  if (previo) { S.x = cx - (cx - S.x) * (S.s / previo); S.y = cy - (cy - S.y) * (S.s / previo); }
  else { S.x = (stage.clientWidth - S.w * S.s) / 2; S.y = (stage.clientHeight - S.h * S.s) / 2; }
  pintar();
}
function zoomA(ns, cx, cy) {
  ns = Math.max(1, Math.min(5, ns)); const p = S.s; S.s = ns; colocar(cx, cy, p);
  if (ns <= 1.001) cerrarZoom();
}
function abrirZoom(cx, cy) {
  if (zoomOn) return;
  zoomOn = true; const r = stage.getBoundingClientRect();
  armarHoja(false); zoomEl.classList.add("on"); zinfo.classList.add("on");
  stage.querySelector(".book").style.visibility = "hidden";
  const ts = 2.2; if (cx != null) zoomA(ts, cx - r.left, cy - r.top); else zoomA(ts, r.width / 2, r.height / 2);
  $("#bZin").classList.add("act"); $("#app").classList.add("zo");
}
function cerrarZoom() {
  if (!zoomOn) return; zoomOn = false;
  zoomEl.classList.remove("on"); zinfo.classList.remove("on"); sheet.innerHTML = "";
  const b = stage.querySelector(".book"); if (b) b.style.visibility = ""; $("#bZin").classList.remove("act"); $("#app").classList.remove("zo");
  actualizar();
}
const ptr = new Map(); let pin0 = null, mov = 0, dx0 = 0, tIni = 0;
zoomEl.addEventListener("pointerdown", (e) => {
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); mov = 0; dx0 = e.clientX; tIni = Date.now();
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pin0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.s }; }
  zoomEl.classList.add("drag");
});
zoomEl.addEventListener("pointermove", (e) => {
  const p = ptr.get(e.pointerId); if (!p) return;
  const r = stage.getBoundingClientRect();
  if (ptr.size === 2 && pin0) {
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const prev = S.s; S.s = Math.max(1, Math.min(5, pin0.s * d / pin0.d));
    colocar((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, prev); mov += 10; return;
  }
  const ddx = e.clientX - p.x, ddy = e.clientY - p.y; mov += Math.abs(ddx) + Math.abs(ddy);
  if (mov > 6) { try { zoomEl.setPointerCapture(e.pointerId); } catch (_) {} }
  p.x = e.clientX; p.y = e.clientY; S.x += ddx; S.y += ddy; pintar();
});
function soltar(e) {
  if (!ptr.has(e.pointerId)) return;
  const fin = e.clientX - dx0; ptr.delete(e.pointerId); pin0 = null; zoomEl.classList.remove("drag");
  if (ptr.size === 0 && S.s <= 1.05 && Math.abs(fin) > 70 && Date.now() - tIni < 600) { fin < 0 ? sig() : ant(); } // deslizar para pasar
  else if (ptr.size === 0 && S.s < 1.05) cerrarZoom();
}
zoomEl.addEventListener("pointerup", soltar); zoomEl.addEventListener("pointercancel", soltar);
zoomEl.addEventListener("click", (e) => { if (mov > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
zoomEl.addEventListener("dblclick", (e) => {
  const r = stage.getBoundingClientRect(); if (e.target.closest("a")) return;
  S.s > 1.2 ? (S.s = 1, cerrarZoom()) : zoomA(2.6, e.clientX - r.left, e.clientY - r.top);
});
zoomEl.addEventListener("wheel", (e) => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomA(S.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener("wheel", (e) => { if (!zoomOn && e.ctrlKey) { e.preventDefault(); abrirZoom(e.clientX, e.clientY); } }, { passive: false });
function zoomPaso(f) {
  const r = stage.getBoundingClientRect();
  if (!zoomOn) { if (f > 1) abrirZoom(null, null); return; }
  zoomA(S.s * f, r.width / 2, r.height / 2);
}

/* ---------- panel: índice, miniaturas, búsqueda ---------- */
function armarPanel() {
  const toc = $("#c-toc");
  if (!L.toc.length) toc.innerHTML = '<div class="vacio">Este libro no tiene índice. Usa las miniaturas o la búsqueda.</div>';
  L.toc.forEach(([nv, t, p]) => {
    const a = document.createElement("a"); a.dataset.p = p; a.className = "n" + Math.min(nv, 3);
    a.innerHTML = "<span></span><span>" + p + "</span>"; a.firstChild.textContent = t;
    a.addEventListener("click", () => { go(p - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    toc.appendChild(a);
  });
  const th = $("#c-th");
  for (let i = 1; i <= N; i++) {
    const b = document.createElement("button"); b.dataset.p = i; b.setAttribute("aria-label", "Ir a la página " + i);
    b.innerHTML = '<img loading="lazy" alt=""><div>' + i + "</div>"; b.firstChild.src = "t/" + pad(i) + ".webp";
    b.addEventListener("click", () => { go(i - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    th.appendChild(b);
  }
}
const idxN = L.paginas.map((p) => norm(p.t));
let qh = 0;
$("#q").addEventListener("input", () => {
  clearTimeout(qh); qh = setTimeout(() => {
    const q = norm($("#q").value.trim()), out = $("#res"); out.innerHTML = "";
    if (q.length < 2) return;
    let c = 0;
    for (let i = 0; i < N && c < 80; i++) {
      const k = idxN[i].indexOf(q); if (k < 0) continue; c++;
      const t = L.paginas[i].t, a = Math.max(0, k - 40), z = Math.min(t.length, k + q.length + 70);
      const b = document.createElement("button"); b.className = "res";
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      b.innerHTML = "<b>Pág. " + (i + 1) + "</b> · " + (a ? "…" : "") + esc(t.slice(a, k)) + "<mark>" + esc(t.slice(k, k + q.length)) + "</mark>" + esc(t.slice(k + q.length, z)) + (z < t.length ? "…" : "");
      b.addEventListener("click", () => { go(i); if (matchMedia("(max-width:640px)").matches) panel(false); });
      out.appendChild(b);
    }
    if (!c) out.innerHTML = '<div class="vacio">Sin resultados.</div>';
  }, 200);
});
function tab(t) {
  document.querySelectorAll(".tabs [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  for (const k of ["toc", "th", "bq"]) $("#c-" + k).hidden = k !== t;
  if (t === "bq") $("#q").focus();
  if (t === "th") { const c = document.querySelector(".th button.cur"); if (c) c.scrollIntoView({ block: "center" }); }
}
function panel(on, t) { $("#panel").classList.toggle("on", on); if (on && t) tab(t); if (on) mas(false); }
function mas(on) { $("#mas").classList.toggle("on", on); }
document.querySelectorAll(".tabs [data-t]").forEach((b) => b.addEventListener("click", () => tab(b.dataset.t)));
$("#pX").onclick = () => panel(false);
$("#bIdx").onclick = () => panel(!$("#panel").classList.contains("on"), L.toc.length ? "toc" : "th");
$("#bThumbs").onclick = () => panel(true, "th");
$("#bSearch").onclick = () => panel(true, "bq");

/* ---------- barra de herramientas ---------- */
$("#prev").onclick = $("#bPrev2").onclick = ant; $("#next").onclick = $("#bNext2").onclick = sig;
$("#bFirst").onclick = () => go(0); $("#bLast").onclick = () => go(N - 1);
$("#bZin").onclick = () => zoomPaso(1.5); $("#bZout").onclick = () => zoomPaso(1 / 1.5);
$("#scrub").addEventListener("change", (e) => go(+e.target.value - 1));
$("#pgIn").addEventListener("change", (e) => { const v = Math.max(1, Math.min(N, +e.target.value || 1)); go(v - 1); });
$("#bSnd").onclick = $("#mSnd").onclick = () => setSnd(!soundOn);
function compartir() {
  const url = location.href.split("#")[0] + "#p=" + (visibles(idx)[0] + 1);
  if (navigator.share) navigator.share({ title: L.titulo, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
  else toast(url);
  mas(false);
}
$("#bShare").onclick = $("#mShare").onclick = compartir;
const fsEl = document.documentElement, fsOk = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function fs() {
  if (!fsOk) { toast("Tu navegador no permite pantalla completa aquí"); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  mas(false);
}
$("#bFs").onclick = $("#mFs").onclick = fs;
if (!fsOk) { $("#bFs").hidden = true; $("#mFs").hidden = true; }
$("#bMore").onclick = (e) => { e.stopPropagation(); mas(!$("#mas").classList.contains("on")); };
document.addEventListener("click", (e) => { if (!e.target.closest("#mas")) mas(false); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") sig(); else if (k === "ArrowLeft" || k === "PageUp") ant();
  else if (k === "Home") go(0); else if (k === "End") go(N - 1);
  else if (k === "+" || k === "=") zoomPaso(1.5); else if (k === "-") zoomPaso(1 / 1.5);
  else if (k === "Escape") { if ($("#panel").classList.contains("on")) panel(false); else if (zoomOn) cerrarZoom(); }
  else if (k === "f" || k === "F") fs(); else if (k === "/") { e.preventDefault(); panel(true, "bq"); }
});
let rh = 0;
window.addEventListener("resize", () => { clearTimeout(rh); rh = setTimeout(() => { const z = zoomOn; if (z) cerrarZoom(); build(idx); }, 180); });

/* ---------- inicio ---------- */
armarPanel(); setSnd(soundOn);
const m = /#p=(\d+)/.exec(location.hash);
build(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
window.addEventListener("hashchange", () => { const h = /#p=(\d+)/.exec(location.hash); if (h && +h[1] - 1 !== visibles(idx)[0]) go(+h[1] - 1); });
window.__fb = { go, sig, ant, abrirZoom, cerrarZoom, get estado() { return { idx, two, zoomOn, s: S.s, pw, ph }; } };
</script>
