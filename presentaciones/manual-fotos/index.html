<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manual: Fotos y hallazgos</title>

<style>
:root{--bg:#0b1a4a;--ac:#E8B010;--tx:#eef2ff;--mut:#9fb0de;--pnl:#101f55;--lin:rgba(255,255,255,.14);--btn:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 38%,color-mix(in srgb,var(--bg) 70%,#3a63d6) 0%,var(--bg) 62%,#050c26 100%)}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:54px;z-index:5}
header img{height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{background:var(--btn);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--mut)}
.cta{background:var(--ac);color:#0b1a4a;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.book{transition:transform .6s ease;will-change:transform}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.page a.lk,#sheet a.lk{position:absolute;display:block;border-radius:3px;background:rgba(232,176,16,.0);transition:background .15s}
.page a.lk:hover,#sheet a.lk:hover{background:rgba(232,176,16,.28);outline:1px solid rgba(232,176,16,.7)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:84px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(255,255,255,.2)}.nav:disabled{opacity:.25;cursor:default}
#prev{left:8px}#next{right:8px}
#zoom{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;z-index:3;display:none}
#zoom.on{display:block}#zoom.drag{cursor:grabbing}
#sheet{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;background:#fff;box-shadow:0 10px 50px rgba(0,0,0,.55)}
#sheet .pp{position:relative;flex:none}
#sheet img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.zinfo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 14px;font-size:13px;z-index:6;display:none;pointer-events:none}
.zinfo.on{display:block}
footer{z-index:5;padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#scrub{width:100%;margin:0;accent-color:var(--ac);height:14px;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px;justify-content:space-between}
.grp{display:flex;align-items:center;gap:6px}
.credito{font-size:12px;color:var(--mut);white-space:nowrap}
.ib{width:42px;height:42px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:rgba(255,255,255,.2)}.ib.act{background:var(--ac);color:#0b1a4a}.ib:disabled{opacity:.3}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--mut);font-size:14px}
.pin input{width:54px;height:38px;border-radius:8px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);text-align:center;font:inherit}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,86vw);background:var(--pnl);border-right:1px solid var(--lin);z-index:8;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.4)}
#panel.on{transform:none}
.tabs{display:flex;border-bottom:1px solid var(--lin)}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 14px inherit;cursor:pointer}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs .x{flex:none;width:44px;font-size:20px}
.cont{flex:1;overflow:auto;padding:10px}
.cont[hidden]{display:none}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer}
.toc a:hover,.toc a.cur{background:var(--btn)}
.toc a span:last-child{color:var(--mut);flex:none}
.toc a.n2{padding-left:26px;font-size:14px}.toc a.n3{padding-left:42px;font-size:13px}
.vacio{color:var(--mut);padding:14px 6px}
.th{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th button{background:none;border:2px solid transparent;border-radius:8px;padding:4px;color:var(--mut);cursor:pointer;font:12px inherit}
.th button img{width:100%;display:block;border-radius:3px;background:#fff}
.th button.cur{border-color:var(--ac);color:var(--tx)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;margin-bottom:8px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--lin);padding:9px 6px;color:var(--tx);cursor:pointer;font:13px/1.4 inherit}
.res:hover{background:var(--btn)}.res b{color:var(--ac)}.res mark{background:var(--ac);color:#0b1a4a;border-radius:2px}
.acerca{border-top:1px solid var(--lin);padding:10px 14px;font-size:12px;color:var(--mut)}
#mas{position:absolute;right:8px;bottom:78px;background:var(--pnl);border:1px solid var(--lin);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#mas.on{display:flex}
#mas button,#mas a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;color:var(--tx);font:14px inherit;cursor:pointer;border-radius:8px;text-decoration:none;white-space:nowrap}
#mas button:hover,#mas a:hover{background:var(--btn)}
#mas svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:999px;z-index:20;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.m-only{display:none}
@media (max-width:640px){
 header{padding:6px 10px;gap:8px;min-height:48px}header h1{font-size:14px}header img{height:28px;max-width:80px}
 .cta{padding:6px 12px;font-size:13px}.d-only{display:none!important}.m-only{display:inline-flex}
 .nav{width:34px;height:64px}.credito{display:none}.ib{width:40px;height:40px}
 header .pg{display:none}.app.zo .nav{display:none}
 .app:not(.zo) #bZout{display:none}.bar,.grp{gap:4px}.ib{width:38px;height:38px}.pin{font-size:13px}.pin input{width:44px;height:36px}
}
:fullscreen header{min-height:44px}
</style>
</head>

<script>
"use strict";
const L = {"titulo": "Manual: Fotos y hallazgos", "autor": "Johan Tapia, PhD", "n": 7, "ratio": 0.70479, "paginas": [{"t": "M A N U A L PA S O A PA S O Fotos y hallazgos La evidencia del antes y el después Plataforma de Asesores Empresariales · INFOTEP Desarrollado por Johan Tapia, PhD", "l": []}, {"t": "Fotos y hallazgos Antes de empezar Sube las fotos de la visita, deja que Niko sugiera el hallazgo y confírmalo. 1 Sube las fotos 2 Pide una sugerencia a Niko 3 Confirma el hallazgo 4 Usa las fotos en las presentaciones CONSEJO Confirma siempre el momento y el texto de tus fotos para que tus presentaciones se armen correctamente. 2", "l": []}, {"t": "Fotos y hallazgos Paso 1 de 4 1 Sube las fotos QUÉ HACES Elige las fotos de la visita desde tu celular o computadora. Puedes seleccionar y subir varias imágenes a la vez. DEFINICIÓN Las fotos son las evidencias visuales capturadas durante la visita a la empresa para documentar la situación observada. ¿POR QUÉ ASÍ? Subir varias fotos a la vez te ahorra tiempo y reúne todas las evidencias del recorrido en un solo lugar. 3", "l": []}, {"t": "Fotos y hallazgos Paso 2 de 4 2 Pide una sugerencia a Niko QUÉ HACES Pide una sugerencia a Niko para que revise la imagen y proponga el hallazgo y la recomendación correspondiente. DEFINICIÓN La sugerencia de Niko es una propuesta inicial sobre lo que se observa en la foto y qué aconsejarías. ¿POR QUÉ ASÍ? Recibir una sugerencia agiliza tu redacción, permitiéndote decidir libremente si aceptas o ajustas la propuesta recibida. 4", "l": []}, {"t": "Fotos y hallazgos Paso 3 de 4 3 Confirma el hallazgo QUÉ HACES Corrige el texto si es necesario, selecciona el momento correspondiente y pulsa «Guardar». DEFINICIÓN El momento clasifica cuándo se tomó la evidencia: en el levantamiento inicial, en el antes o en el después. ¿POR QUÉ ASÍ? Debes pulsar «Guardar» porque únicamente las fotos que confirmes entrarán en las presentaciones de la plataforma. 5", "l": []}, {"t": "Fotos y hallazgos Paso 4 de 4 4 Usa las fotos en las presentaciones QUÉ HACES Revisa las presentaciones que la plataforma genera automáticamente utilizando todas las fotos que confirmaste. DEFINICIÓN Son los documentos automáticos que exponen la situación del levantamiento y comparan el antes con el después. ¿POR QUÉ ASÍ? Aprovechar estas fotos te permite mostrar de manera visual y clara el avance de la empresa ante los directivos. 6", "l": []}, {"t": "Fotos y hallazgos Lo que lograste ¿TE QUEDÓ ALGUNA DUDA? Pregúntale a Niko, el botón amarillo de la plataforma, o escríbele tu idea en «Ideas y arreglos». Todos los manuales están en «Manuales» del menú. Plataforma de Asesores Empresariales · INFOTEP · Desarrollado por Johan Tapia, PhD. Aprendiste a subir varias fotos de la visita desde el celular o la computadora. ✔ Ya sabes solicitar sugerencias a Niko y confirmar los hallazgos pulsando «Guardar». ✔ Lograste generar las presentaciones de levantamiento y de cierre con el antes y el después. ✔ 7", "l": []}], "toc": [[1, "Portada", 1], [1, "Antes de empezar", 2], [1, "1. Sube las fotos", 3], [1, "2. Pide una sugerencia a Niko", 4], [1, "3. Confirma el hallazgo", 5], [1, "4. Usa las fotos en las presentaciones", 6], [1, "Lo que lograste", 7]], "logo": "logo.png", "pdf": "libro.pdf", "color": "#0b1a4a", "acento": "#E8B010", "cta": {"texto": "Ir a la plataforma", "url": "https://asesor.plataformajt.com/manuales"}};

/* ---------- utilidades ---------- */

  pf.loadFromHTML(pages);
  pf.on("flip", (e) => { idx = e.data; actualizar(); });
  pf.on("changeState", (e) => { if (e.data === "flipping") snd(); });
  idx = pf.getCurrentPageIndex();
  el.addEventListener("dblclick", (ev) => { if (!ev.target.closest("a")) abrirZoom(ev.clientX, ev.clientY); });
  actualizar();
}
function actualizar() {
  const v = visibles(idx), a = v[0] + 1, b = v[v.length - 1] + 1;
  $("#pgInd").textContent = (a === b ? "pág. " + a : "págs. " + a + "–" + b) + " de " + N;
  $("#pgIn").value = a; $("#scrub").value = a;
  $("#prev").disabled = idx <= 0; $("#next").disabled = v[v.length - 1] >= N - 1;
  const el = stage.querySelector(".book");
  if (el && !zoomOn) { // centrar la portada y la contraportada cuando están solas
    let tx = 0;
    if (two && idx === 0) tx = -25; else if (two && N % 2 === 0 && v[0] === N - 1) tx = 25;
    el.style.transform = tx ? `translateX(${tx}%)` : "";
  }
  document.querySelectorAll(".th button,.toc a").forEach((e) => e.classList.toggle("cur", v.includes(+e.dataset.p - 1)));
  try { history.replaceState(null, "", "#p=" + a); } catch (e) {}
}
function go(i, anim) {
  i = izq(i);
  if (zoomOn) { idx = i; try { pf.turnToPage(i); } catch (e) {} snd(); actualizar(); armarHoja(true); return; }
  if (anim === false || Math.abs(i - idx) > 6) { pf.turnToPage(i); idx = i; actualizar(); snd(); }
  else pf.flip(i);
}
function sig() { const v = visibles(idx); const n = v[v.length - 1] + 1; if (n < N) go(n); }
function ant() { if (idx <= 0) return; go(two ? (idx <= 2 ? 0 : idx - 2) : idx - 1); }

/* ---------- zoom con arrastre, rueda y pellizco (usa las páginas en alta resolución) ---------- */
let S = { s: 1, x: 0, y: 0, w: 0, h: 0 };
const zinfo = $("#zinfo");
function armarHoja(conservar) {
  const v = visibles(idx), r = stage.getBoundingClientRect();
  const aw = r.width - 16, ah = r.height - 16;
  const k = v.length;
  const h = Math.min(ah, aw / (k * ratio));
  S.w = Math.floor(h * ratio * k); S.h = Math.floor(h);
  sheet.style.width = S.w + "px"; sheet.style.height = S.h + "px"; sheet.innerHTML = "";
  v.forEach((p) => {
    const d = document.createElement("div"); d.className = "pp"; d.style.width = (S.w / k) + "px"; d.style.height = S.h + "px";
    const im = document.createElement("img"); im.src = "p/" + pad(p + 1) + ".webp"; im.alt = "Página " + (p + 1);
    const hd = new Image(); hd.onload = () => { if (im.isConnected) im.src = hd.src; }; hd.src = "hd/" + pad(p + 1) + ".webp";
    d.appendChild(im); linksHtml(p, d); sheet.appendChild(d);
  });
  if (!conservar) S.s = 1;
  colocar(r.width / 2, r.height / 2, null);
}
function limitar() {
  const r = stage.getBoundingClientRect(), W = S.w * S.s, H = S.h * S.s;
  S.x = W <= r.width ? (r.width - W) / 2 : Math.min(0, Math.max(r.width - W, S.x));
  S.y = H <= r.height ? (r.height - H) / 2 : Math.min(0, Math.max(r.height - H, S.y));
}
function pintar() {
  limitar();
  sheet.style.transform = `translate(${S.x}px,${S.y}px) scale(${S.s})`;
  zinfo.textContent = Math.round(S.s * 100) + " %";
}
function colocar(cx, cy, previo) { // mantiene fijo el punto (cx,cy) al cambiar de escala
  if (previo) { S.x = cx - (cx - S.x) * (S.s / previo); S.y = cy - (cy - S.y) * (S.s / previo); }
  else { S.x = (stage.clientWidth - S.w * S.s) / 2; S.y = (stage.clientHeight - S.h * S.s) / 2; }
  pintar();
}
function zoomA(ns, cx, cy) {
  ns = Math.max(1, Math.min(5, ns)); const p = S.s; S.s = ns; colocar(cx, cy, p);
  if (ns <= 1.001) cerrarZoom();
}
function abrirZoom(cx, cy) {
  if (zoomOn) return;
  zoomOn = true; const r = stage.getBoundingClientRect();
  armarHoja(false); zoomEl.classList.add("on"); zinfo.classList.add("on");
  stage.querySelector(".book").style.visibility = "hidden";
  const ts = 2.2; if (cx != null) zoomA(ts, cx - r.left, cy - r.top); else zoomA(ts, r.width / 2, r.height / 2);
  $("#bZin").classList.add("act"); $("#app").classList.add("zo");
}
function cerrarZoom() {
  if (!zoomOn) return; zoomOn = false;
  zoomEl.classList.remove("on"); zinfo.classList.remove("on"); sheet.innerHTML = "";
  const b = stage.querySelector(".book"); if (b) b.style.visibility = ""; $("#bZin").classList.remove("act"); $("#app").classList.remove("zo");
  actualizar();
}
const ptr = new Map(); let pin0 = null, mov = 0, dx0 = 0, tIni = 0;
zoomEl.addEventListener("pointerdown", (e) => {
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); mov = 0; dx0 = e.clientX; tIni = Date.now();
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pin0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.s }; }
  zoomEl.classList.add("drag");
});
zoomEl.addEventListener("pointermove", (e) => {
  const p = ptr.get(e.pointerId); if (!p) return;
  const r = stage.getBoundingClientRect();
  if (ptr.size === 2 && pin0) {
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const prev = S.s; S.s = Math.max(1, Math.min(5, pin0.s * d / pin0.d));
    colocar((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, prev); mov += 10; return;
  }
  const ddx = e.clientX - p.x, ddy = e.clientY - p.y; mov += Math.abs(ddx) + Math.abs(ddy);
  if (mov > 6) { try { zoomEl.setPointerCapture(e.pointerId); } catch (_) {} }
  p.x = e.clientX; p.y = e.clientY; S.x += ddx; S.y += ddy; pintar();
});
function soltar(e) {
  if (!ptr.has(e.pointerId)) return;
  const fin = e.clientX - dx0; ptr.delete(e.pointerId); pin0 = null; zoomEl.classList.remove("drag");
  if (ptr.size === 0 && S.s <= 1.05 && Math.abs(fin) > 70 && Date.now() - tIni < 600) { fin < 0 ? sig() : ant(); } // deslizar para pasar
  else if (ptr.size === 0 && S.s < 1.05) cerrarZoom();
}
zoomEl.addEventListener("pointerup", soltar); zoomEl.addEventListener("pointercancel", soltar);
zoomEl.addEventListener("click", (e) => { if (mov > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
zoomEl.addEventListener("dblclick", (e) => {
  const r = stage.getBoundingClientRect(); if (e.target.closest("a")) return;
  S.s > 1.2 ? (S.s = 1, cerrarZoom()) : zoomA(2.6, e.clientX - r.left, e.clientY - r.top);
});
zoomEl.addEventListener("wheel", (e) => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomA(S.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener("wheel", (e) => { if (!zoomOn && e.ctrlKey) { e.preventDefault(); abrirZoom(e.clientX, e.clientY); } }, { passive: false });
function zoomPaso(f) {
  const r = stage.getBoundingClientRect();
  if (!zoomOn) { if (f > 1) abrirZoom(null, null); return; }
  zoomA(S.s * f, r.width / 2, r.height / 2);
}

/* ---------- panel: índice, miniaturas, búsqueda ---------- */
function armarPanel() {
  const toc = $("#c-toc");
  if (!L.toc.length) toc.innerHTML = '<div class="vacio">Este libro no tiene índice. Usa las miniaturas o la búsqueda.</div>';
  L.toc.forEach(([nv, t, p]) => {
    const a = document.createElement("a"); a.dataset.p = p; a.className = "n" + Math.min(nv, 3);
    a.innerHTML = "<span></span><span>" + p + "</span>"; a.firstChild.textContent = t;
    a.addEventListener("click", () => { go(p - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    toc.appendChild(a);
  });
  const th = $("#c-th");
  for (let i = 1; i <= N; i++) {
    const b = document.createElement("button"); b.dataset.p = i; b.setAttribute("aria-label", "Ir a la página " + i);
    b.innerHTML = '<img loading="lazy" alt=""><div>' + i + "</div>"; b.firstChild.src = "t/" + pad(i) + ".webp";
    b.addEventListener("click", () => { go(i - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    th.appendChild(b);
  }
}
const idxN = L.paginas.map((p) => norm(p.t));
let qh = 0;
$("#q").addEventListener("input", () => {
  clearTimeout(qh); qh = setTimeout(() => {
    const q = norm($("#q").value.trim()), out = $("#res"); out.innerHTML = "";
    if (q.length < 2) return;
    let c = 0;
    for (let i = 0; i < N && c < 80; i++) {
      const k = idxN[i].indexOf(q); if (k < 0) continue; c++;
      const t = L.paginas[i].t, a = Math.max(0, k - 40), z = Math.min(t.length, k + q.length + 70);
      const b = document.createElement("button"); b.className = "res";
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      b.innerHTML = "<b>Pág. " + (i + 1) + "</b> · " + (a ? "…" : "") + esc(t.slice(a, k)) + "<mark>" + esc(t.slice(k, k + q.length)) + "</mark>" + esc(t.slice(k + q.length, z)) + (z < t.length ? "…" : "");
      b.addEventListener("click", () => { go(i); if (matchMedia("(max-width:640px)").matches) panel(false); });
      out.appendChild(b);
    }
    if (!c) out.innerHTML = '<div class="vacio">Sin resultados.</div>';
  }, 200);
});
function tab(t) {
  document.querySelectorAll(".tabs [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  for (const k of ["toc", "th", "bq"]) $("#c-" + k).hidden = k !== t;
  if (t === "bq") $("#q").focus();
  if (t === "th") { const c = document.querySelector(".th button.cur"); if (c) c.scrollIntoView({ block: "center" }); }
}
function panel(on, t) { $("#panel").classList.toggle("on", on); if (on && t) tab(t); if (on) mas(false); }
function mas(on) { $("#mas").classList.toggle("on", on); }
document.querySelectorAll(".tabs [data-t]").forEach((b) => b.addEventListener("click", () => tab(b.dataset.t)));
$("#pX").onclick = () => panel(false);
$("#bIdx").onclick = () => panel(!$("#panel").classList.contains("on"), L.toc.length ? "toc" : "th");
$("#bThumbs").onclick = () => panel(true, "th");
$("#bSearch").onclick = () => panel(true, "bq");

/* ---------- barra de herramientas ---------- */
$("#prev").onclick = $("#bPrev2").onclick = ant; $("#next").onclick = $("#bNext2").onclick = sig;
$("#bFirst").onclick = () => go(0); $("#bLast").onclick = () => go(N - 1);
$("#bZin").onclick = () => zoomPaso(1.5); $("#bZout").onclick = () => zoomPaso(1 / 1.5);
$("#scrub").addEventListener("change", (e) => go(+e.target.value - 1));
$("#pgIn").addEventListener("change", (e) => { const v = Math.max(1, Math.min(N, +e.target.value || 1)); go(v - 1); });
$("#bSnd").onclick = $("#mSnd").onclick = () => setSnd(!soundOn);
function compartir() {
  const url = location.href.split("#")[0] + "#p=" + (visibles(idx)[0] + 1);
  if (navigator.share) navigator.share({ title: L.titulo, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
  else toast(url);
  mas(false);
}
$("#bShare").onclick = $("#mShare").onclick = compartir;
const fsEl = document.documentElement, fsOk = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function fs() {
  if (!fsOk) { toast("Tu navegador no permite pantalla completa aquí"); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  mas(false);
}
$("#bFs").onclick = $("#mFs").onclick = fs;
if (!fsOk) { $("#bFs").hidden = true; $("#mFs").hidden = true; }
$("#bMore").onclick = (e) => { e.stopPropagation(); mas(!$("#mas").classList.contains("on")); };
document.addEventListener("click", (e) => { if (!e.target.closest("#mas")) mas(false); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") sig(); else if (k === "ArrowLeft" || k === "PageUp") ant();
  else if (k === "Home") go(0); else if (k === "End") go(N - 1);
  else if (k === "+" || k === "=") zoomPaso(1.5); else if (k === "-") zoomPaso(1 / 1.5);
  else if (k === "Escape") { if ($("#panel").classList.contains("on")) panel(false); else if (zoomOn) cerrarZoom(); }
  else if (k === "f" || k === "F") fs(); else if (k === "/") { e.preventDefault(); panel(true, "bq"); }
});
let rh = 0;
window.addEventListener("resize", () => { clearTimeout(rh); rh = setTimeout(() => { const z = zoomOn; if (z) cerrarZoom(); build(idx); }, 180); });

/* ---------- inicio ---------- */
armarPanel(); setSnd(soundOn);
const m = /#p=(\d+)/.exec(location.hash);
build(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
window.addEventListener("hashchange", () => { const h = /#p=(\d+)/.exec(location.hash); if (h && +h[1] - 1 !== visibles(idx)[0]) go(+h[1] - 1); });
window.__fb = { go, sig, ant, abrirZoom, cerrarZoom, get estado() { return { idx, two, zoomOn, s: S.s, pw, ph }; } };
</script>
