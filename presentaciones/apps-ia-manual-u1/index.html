<script>
"use strict";
const L = {"titulo": "Manual de la Unidad 1 · Pensar en producto: de la idea de negocio a la app", "autor": "Johan Tapia, PhD", "n": 17, "ratio": 0.70479, "paginas": [{"t": "MANUAL DE LA UNIDAD 1 Pensar en producto: de la idea de negocio a la app Incluye: la IA desde cero, los tokens y cómo funciona una aplicación por dentro Creación de Aplicaciones con Inteligencia Artificial para Emprendedores INFOTEP · Baní · 60 horas", "l": []}, {"t": "Qué aprenderás en esta unidad Antes de crear una aplicación con inteligencia artificial hay que entender, con palabras sencillas, qué es la IA, cómo “piensa” y cómo se construye una app. Esta unidad no necesita saber de tecnología. Qué aprenderás Qué es la IA, qué son los tokens, cómo escribir buenas instrucciones y cómo funciona una app. Qué harás Mirar un video corto, participar en el foro y crear tu primer cartel con código QR. Qué entregas Una actividad en equipo (80 puntos) y un reactivo individual (20 puntos). Tiempo estimado Una semana: unas 10 horas entre lectura, video, foro y práctica. Piensa y responde: ¿Qué sabes hoy de la inteligencia artificial? Escríbelo en una línea; al final del manual lo compararás con lo aprendido. UNIDAD 1 Desarrollado por Johan Tapia, PhD 2", "l": []}, {"t": "¿Qué es la inteligencia artificial? Imagina un ayudante nuevo en tu colmado que leyó millones de libros, páginas y conversaciones, pero que no conoce tu negocio hasta que se lo explicas. Eso se parece a una IA. Definición: la inteligencia artificial (IA) es un programa de computadora que realiza tareas que normalmente requieren inteligencia humana: entender textos, reconocer imágenes, responder preguntas o recomendar decisiones. Ejemplo en tu negocio: Cuando el teclado de tu celular te sugiere la próxima palabra, o cuando una app te recomienda un video, hay IA trabajando. La UNESCO recomienda usar la IA generativa con criterio humano, protegiendo la privacidad y verificando sus resultados (UNESCO, 2023). UNIDAD 1 Desarrollado por Johan Tapia, PhD 3", "l": []}, {"t": "IA, aprendizaje automático e IA generativa Estos tres términos se mezclan mucho. Piensa en círculos que se contienen: Inteligencia artificial máquinas con tareas inteligentes Aprendizaje automático aprende de ejemplos IA generativa crea textos, imágenes y código Definición: la IA generativa es la que crea contenido nuevo (un texto, una imagen, una app) a partir de lo que le pides. ChatGPT, Gemini, Claude, Kimi y DeepSeek son ejemplos. Ejemplo en tu negocio: Le pides: “Escribe un mensaje de saludo para mi salón de belleza” y te entrega un texto nuevo en segundos. UNIDAD 1 Desarrollado por Johan Tapia, PhD 4", "l": []}, {"t": "¿Cómo aprende una IA? Un niño aprende qué es una fruta viendo muchos ejemplos: mangos, guineos, naranjas. La IA aprende igual, pero con millones de ejemplos. 1. Datos textos y ejemplos › 2. Entrenamiento busca patrones › 3. Modelo el “cerebro” ya listo › 4. Respuesta a tu pregunta Definición: un modelo es el resultado del entrenamiento: un archivo enorme que ya “aprendió” patrones y los usa para responder. Entrenar es mostrarle ejemplos hasta que los patrones se fijan. Piensa y responde: Si una IA solo leyó textos en inglés, ¿qué dificultades tendría con el español dominicano? UNIDAD 1 Desarrollado por Johan Tapia, PhD 5", "l": []}, {"t": "Un modelo de lenguaje adivina la siguiente palabra Los asistentes como ChatGPT o Gemini funcionan con modelos de lenguaje: calculan cuál es la palabra más probable que sigue, una y otra vez, hasta formar una respuesta. “Buenos días, ¿cómo ___?” Posible palabra Qué tan probable es (ilustrativo) está alta estás media amaneció baja manguito casi nula Los porcentajes son ilustrativos, para entender la idea. Definición: un modelo de lenguaje grande (LLM) es un modelo entrenado con muchísimo texto para predecir la siguiente palabra y así conversar, resumir o escribir. Ejemplo en tu negocio: Por eso la IA suena segura aunque a veces se equivoque: está completando frases con lo más probable, no consultando una enciclopedia. UNIDAD 1 Desarrollado por Johan Tapia, PhD 6", "l": []}, {"t": "Los tokens: las piezas de las palabras La IA no lee palabras completas: las corta en piezas llamadas tokens. Una pieza puede ser una palabra, parte de una palabra o un signo. Los tokens son la “moneda” de la IA: limitan cuánto texto cabe y, en servicios de pago, cuánto cuesta (Google, s. f.; OpenAI, s. f.). Texto Palabras Tokens Hola 1 1 Buenos días, ¿cómo está? 4 7 Quiero un cotizador con ITBIS para mi colmado en Baní. 10 18 Anticonstitucionalmente 1 5 Qu iero un cot izador con IT B IS para mi col m ado en Ban í . Conteo real con el tokenizador o200k_base de OpenAI (herramienta tiktoken). Cada modelo corta distinto, pero la idea es igual. Definición: un token es la unidad mínima de texto que procesa un modelo. En español, una palabra suele valer entre 1 y 3 tokens. UNIDAD 1 Desarrollado por Johan Tapia, PhD 7", "l": []}, {"t": "La ventana de contexto: la memoria de la conversación Piensa en una mesa de trabajo: solo caben cierta cantidad de papeles. Si pones más, los primeros se caen al suelo y se olvidan. Definición: la ventana de contexto es la cantidad máxima de tokens (tu pregunta, lo que ya se dijo y la respuesta) que el modelo puede “tener presente” a la vez. Ejemplo en tu negocio: Si le pegas un documento larguísimo y después le haces una pregunta, quizás ya no recuerde el inicio. Por eso conviene dividir los textos y repetir los datos importantes. Piensa y responde: ¿Qué información de tu negocio le repetirías al inicio de cada conversación con una IA? UNIDAD 1 Mensaje 1 Mensaje 2 Mensaje 3 … Tu pregunta Desarrollado por Johan Tapia, PhD 8", "l": []}, {"t": "El prompt: cómo pedirle bien las cosas El prompt es la instrucción que le escribes a la IA. Mientras más claro, mejor respuesta (Anthropic, s. f.). Usa esta receta de cuatro ingredientes: 1. Rol “Eres asesor de ventas de un colmado en Baní.” 2. Contexto “Vendemos arroz, aceite y habichuelas.” 3. Tarea “Escribe un mensaje de WhatsApp para avisar una oferta.” 4. Formato “Máximo 3 líneas, tono amable y un emoji.” Prompt débil “Hazme un mensaje de oferta.” Prompt claro “Eres asesor de un colmado en Baní. Escribe un mensaje de WhatsApp de máximo 3 líneas, amable, para avisar que el arroz de 5 libras está en oferta hasta el sábado.” Definición: prompt es la instrucción o pregunta que le das a un modelo de IA para que haga una tarea. UNIDAD 1 Desarrollado por Johan Tapia, PhD 9", "l": []}, {"t": "Por qué la IA se equivoca (y cómo cuidarte) Como adivina palabras probables, a veces inventa con mucha seguridad. A eso se le llama alucinación. Un caso real de este curso: probamos un asistente de IA pequeño para un colmado cuya lista de productos no incluía pollo. Al preguntarle “¿Venden pollo?”, contestó: “Sí, vendemos pollo.” Era falso. También aceptó una devolución “de ayer” cuando la regla era “solo el mismo día”. Definición: una alucinación es una respuesta que suena correcta pero es falsa o inventada. Verifica precios, fechas, leyes y datos antes de usarlos. Pide fuentes y compruébalas (hay enlaces falsos). Dale tus datos en el prompt en vez de esperar que “los sepa”. Tú decides: la IA propone, tú revisas. UNIDAD 1 Desarrollado por Johan Tapia, PhD 10", "l": []}, {"t": "Tu privacidad y los datos de tus clientes Lo que escribes en una IA puede guardarse o usarse para mejorarla. Cuida la información tuya y de tus clientes (UNESCO, 2023). Nunca pegues Cédulas o pasaportes Números de tarjeta o cuentas Claves y contraseñas Datos personales de clientes Sí puedes usar Información pública de tu negocio Textos con datos ficticios Descripciones de productos Preguntas generales Definición: datos personales son los que identifican a una persona: nombre completo, cédula, teléfono, dirección o fotos. Ejemplo en tu negocio: Para practicar, usa clientes inventados (“Cliente de práctica”) y tu propio número de negocio. UNIDAD 1 Desarrollado por Johan Tapia, PhD 11", "l": []}, {"t": "¿Cómo funciona una aplicación por dentro? Cuando la IA construye una app, está armando estas partes. Estudia la infografía con la analogía del colmado: UNIDAD 1 Desarrollado por Johan Tapia, PhD 12", "l": []}, {"t": "Las partes de una app, una por una Parte En el colmado Qué hace Frontend El mostrador Lo que ve y toca el cliente: pantallas, botones. API El camarero Lleva los pedidos entre la pantalla y la cocina. Backend La cocina Aplica las reglas del negocio. Base de datos El almacén y la libreta Guarda productos, pedidos y clientes. Servidor El local abierto siempre La computadora donde vive la app. Dominio La dirección El nombre para encontrarla en internet. Tipos de app: web (se abre en el navegador, costo bajo), nativa (Android o iPhone, rendimiento alto y costo alto), híbrida (un solo código para ambas tiendas, costo medio) y PWA (una web que se instala como app). Ejemplo en tu negocio: Un cartel con código QR que abre un chat de WhatsApp es una “app” mínima: el frontend es el cartel, el servidor es WhatsApp y tú eres el backend. UNIDAD 1 Desarrollado por Johan Tapia, PhD 13", "l": []}, {"t": "De la idea de negocio a la app 1. Problema qué duele hoy › 2. Idea app mínima › 3. Prueba con clientes reales › 4. Mejora según lo aprendido Definición: un producto mínimo viable (MVP) es la versión más sencilla de tu app que ya resuelve el problema principal y sirve para aprender de los clientes sin gastar de más. Ejemplo en tu negocio: Problema: tus clientes te escriben a toda hora para preguntar precios. MVP: un cartel con QR que abre WhatsApp con el mensaje “Quiero precios” ya escrito (Práctica 1 de esta unidad). Piensa y responde: ¿Qué problema de tu negocio resolverías con una app sencilla? Descríbelo en tres líneas. UNIDAD 1 Desarrollado por Johan Tapia, PhD 14", "l": []}, {"t": "Glosario de la unidad Término Significado sencillo IA generativa IA que crea textos, imágenes o código nuevos. Modelo El “cerebro” ya entrenado que responde. Token Pieza de texto que procesa la IA. Ventana de contexto La memoria de corto plazo de la conversación. Prompt La instrucción que le das a la IA. Alucinación Respuesta falsa dicha con seguridad. Frontend / Backend Lo que ve el cliente / lo que trabaja por detrás. API El mensajero que conecta las partes de una app. MVP La versión mínima de la app para probar la idea. PWA Página web que se instala como aplicación. Piensa y responde: Vuelve a la primera página: ¿qué escribirías ahora sobre la IA? ¿Qué cambió? UNIDAD 1 Desarrollado por Johan Tapia, PhD 15", "l": []}, {"t": "Autoevaluación rápida 1. ¿Qué es un token y por qué importa? 2. ¿Por qué una IA puede responder con seguridad algo que es falso? 3. Escribe un prompt con los cuatro ingredientes (rol, contexto, tarea y formato) para tu negocio. 4. ¿Qué datos de tus clientes no debes pegar en una IA? 5. Explica con la analogía del colmado qué hacen el frontend, la API y el backend. Siguiente paso: mira el video del foro de la unidad, responde las 2 preguntas y empieza la Práctica 1: tu primer cartel con código QR de WhatsApp. UNIDAD 1 Desarrollado por Johan Tapia, PhD 16", "l": []}, {"t": "Referencias Anthropic. (s. f.). Prompt engineering overview. Claude Docs. https://platform.claude.com/docs/en/build-with-claude/prompt- engineering/overview Google. (s. f.). Understand and count tokens. Gemini API. https://aistudio.google.com/docs/tokens OpenAI. (s. f.). tiktoken [Software]. GitHub. https://github.com/openai/tiktoken OpenAI. (s. f.). Understanding and counting tokens. OpenAI Help Center. https://help.openai.com/en/articles/4936856-understanding-and-counting- tokens UNESCO. (2023). Guidance for generative AI in education and research. https://www.unesco.org/en/articles/guidance-generative-ai-education-and- research ABAMobile. (s. f.). ¿Qué es un MVP? Valida tu app sin gastar de más [Video]. YouTube. https://www.youtube.com/watch?v=FS1LI5MOyuA Los ejemplos de tokens se contaron con la herramienta tiktoken; el caso del asistente que “vende pollo” viene de una prueba real de la Práctica 5 de este curso. Ilustraciones generadas con IA en una computadora local; infografía elaborada con NotebookLM. Desarrollado por Johan Tapia, PhD · INFOTEP · 2026 UNIDAD 1 Desarrollado por Johan Tapia, PhD 17", "l": []}], "toc": [[1, "Portada", 1], [1, "Qué aprenderás en esta unidad", 2], [1, "¿Qué es la inteligencia artificial?", 3], [1, "IA, aprendizaje automático e IA generativa", 4], [1, "¿Cómo aprende una IA?", 5], [1, "Un modelo de lenguaje adivina la siguiente palabra", 6], [1, "Los tokens: las piezas de las palabras", 7], [1, "La ventana de contexto", 8], [1, "El prompt: cómo pedirle bien las cosas", 9], [1, "Por qué la IA se equivoca", 10], [1, "Privacidad y datos de tus clientes", 11], [1, "¿Cómo funciona una aplicación por dentro?", 12], [1, "Las partes de una app, una por una", 13], [1, "De la idea de negocio a la app", 14], [1, "Glosario de la unidad", 15], [1, "Autoevaluación rápida", 16], [1, "Referencias", 17]], "logo": "logo.png", "pdf": "libro.pdf", "color": "#0b1a4a", "acento": "#E8B010", "cta": {"texto": "Ir al curso", "url": "https://aulavirtual.plataformajt.com/course/view.php?id=42"}};

let pf = null, two = true, pw = 0, ph = 0, idx = 0, zoomOn = false, soundOn = true, ac = null;
try { if (localStorage.getItem("fb_snd") === "0") soundOn = false; } catch (e) {}

/* ---------- utilidades ---------- */
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 1800); }
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function visibles(i) { // índices (0-based) de las páginas a la vista cuando la "izquierda" es i
  if (!two) return [i];
  if (i === 0) return [0];
  return i + 1 < N ? [i, i + 1] : [i];
}
function izq(i) { i = Math.max(0, Math.min(N - 1, i)); return !two ? i : (i === 0 ? 0 : (i % 2 === 1 ? i : i - 1)); }
function linksHtml(pag, parent) {
  for (const e of L.paginas[pag].l) {
    const a = document.createElement("a");
    a.className = "lk";
    a.style.cssText = `left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${e.h}%`;
    if (e.u) { a.href = e.u; a.target = "_blank"; a.rel = "noopener"; a.title = e.u; }
    else { a.href = "#p=" + e.p; a.title = "Ir a la página " + e.p; a.addEventListener("click", (ev) => { ev.preventDefault(); go(e.p - 1); }); }
    parent.appendChild(a);
  }
}

/* ---------- sonido (sintetizado, sin archivos) ---------- */
function snd() {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const sr = ac.sampleRate, len = Math.floor(sr * 0.32), buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.4) * (t < 0.04 ? t / 0.04 : 1); }
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = 0.6;
    const g = ac.createGain(); g.gain.value = 0.35;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  } catch (e) {}
}
function setSnd(v) {
  soundOn = v; try { localStorage.setItem("fb_snd", v ? "1" : "0"); } catch (e) {}
  $("#bSnd").classList.toggle("act", v); $("#mSnd span").textContent = "Sonido: " + (v ? "sí" : "no");
}

/* ---------- libro (StPageFlip) ---------- */
function medir() {
  const r = stage.getBoundingClientRect();
  const aw = r.width - (r.width > 700 ? 120 : 16), ah = r.height - 16; // los lados dejan sitio a las flechas
  two = aw >= ah * 1.05 && r.width >= 640;
  let h = two ? Math.min(ah, aw / 2 / ratio) : Math.min(ah, aw / ratio);
  ph = Math.floor(h); pw = Math.floor(h * ratio);
}
function build(start) {
  if (pf) { try { pf.destroy(); } catch (e) {} pf = null; }
  medir();
  const el = document.createElement("div"); el.className = "book";
  el.style.width = (two ? 2 * pw : pw) + "px"; el.style.height = ph + "px";
  stage.insertBefore(el, stage.firstChild);
  const pages = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement("div"); d.className = "page";
    d.dataset.density = (i === 0 || i === N - 1) ? "hard" : "soft";
    const im = document.createElement("img"); im.src = "p/" + pad(i + 1) + ".webp"; im.alt = "Página " + (i + 1); im.draggable = false;
    d.appendChild(im); linksHtml(i, d); pages.push(d);
  }
  pf = new St.PageFlip(el, { width: pw, height: ph, size: "fixed", showCover: true, usePortrait: true, autoSize: false,
    maxShadowOpacity: 0.45, flippingTime: 750, mobileScrollSupport: false, disableFlipByClick: true, clickEventForward: true,
    swipeDistance: 25, startPage: izq(start) });
  pf.loadFromHTML(pages);
  pf.on("flip", (e) => { idx = e.data; actualizar(); });
  pf.on("changeState", (e) => { if (e.data === "flipping") snd(); });
  idx = pf.getCurrentPageIndex();
  el.addEventListener("dblclick", (ev) => { if (!ev.target.closest("a")) abrirZoom(ev.clientX, ev.clientY); });
  actualizar();
}
function actualizar() {
  const v = visibles(idx), a = v[0] + 1, b = v[v.length - 1] + 1;
  $("#pgInd").textContent = (a === b ? "pág. " + a : "págs. " + a + "–" + b) + " de " + N;
  $("#pgIn").value = a; $("#scrub").value = a;
  $("#prev").disabled = idx <= 0; $("#next").disabled = v[v.length - 1] >= N - 1;
  const el = stage.querySelector(".book");
  if (el && !zoomOn) { // centrar la portada y la contraportada cuando están solas
    let tx = 0;
    if (two && idx === 0) tx = -25; else if (two && N % 2 === 0 && v[0] === N - 1) tx = 25;
    el.style.transform = tx ? `translateX(${tx}%)` : "";
  }
  document.querySelectorAll(".th button,.toc a").forEach((e) => e.classList.toggle("cur", v.includes(+e.dataset.p - 1)));
  try { history.replaceState(null, "", "#p=" + a); } catch (e) {}
}
function go(i, anim) {
  i = izq(i);
  if (zoomOn) { idx = i; try { pf.turnToPage(i); } catch (e) {} snd(); actualizar(); armarHoja(true); return; }
  if (anim === false || Math.abs(i - idx) > 6) { pf.turnToPage(i); idx = i; actualizar(); snd(); }
  else pf.flip(i);
}
function sig() { const v = visibles(idx); const n = v[v.length - 1] + 1; if (n < N) go(n); }
function ant() { if (idx <= 0) return; go(two ? (idx <= 2 ? 0 : idx - 2) : idx - 1); }

/* ---------- zoom con arrastre, rueda y pellizco (usa las páginas en alta resolución) ---------- */
let S = { s: 1, x: 0, y: 0, w: 0, h: 0 };
const zinfo = $("#zinfo");
function armarHoja(conservar) {
  const v = visibles(idx), r = stage.getBoundingClientRect();
  const aw = r.width - 16, ah = r.height - 16;
  const k = v.length;
  const h = Math.min(ah, aw / (k * ratio));
  S.w = Math.floor(h * ratio * k); S.h = Math.floor(h);
  sheet.style.width = S.w + "px"; sheet.style.height = S.h + "px"; sheet.innerHTML = "";
  v.forEach((p) => {
    const d = document.createElement("div"); d.className = "pp"; d.style.width = (S.w / k) + "px"; d.style.height = S.h + "px";
    const im = document.createElement("img"); im.src = "p/" + pad(p + 1) + ".webp"; im.alt = "Página " + (p + 1);
    const hd = new Image(); hd.onload = () => { if (im.isConnected) im.src = hd.src; }; hd.src = "hd/" + pad(p + 1) + ".webp";
    d.appendChild(im); linksHtml(p, d); sheet.appendChild(d);
  });
  if (!conservar) S.s = 1;
  colocar(r.width / 2, r.height / 2, null);
}
function limitar() {
  const r = stage.getBoundingClientRect(), W = S.w * S.s, H = S.h * S.s;
  S.x = W <= r.width ? (r.width - W) / 2 : Math.min(0, Math.max(r.width - W, S.x));
  S.y = H <= r.height ? (r.height - H) / 2 : Math.min(0, Math.max(r.height - H, S.y));
}
function pintar() {
  limitar();
  sheet.style.transform = `translate(${S.x}px,${S.y}px) scale(${S.s})`;
  zinfo.textContent = Math.round(S.s * 100) + " %";
}
function colocar(cx, cy, previo) { // mantiene fijo el punto (cx,cy) al cambiar de escala
  if (previo) { S.x = cx - (cx - S.x) * (S.s / previo); S.y = cy - (cy - S.y) * (S.s / previo); }
  else { S.x = (stage.clientWidth - S.w * S.s) / 2; S.y = (stage.clientHeight - S.h * S.s) / 2; }
  pintar();
}
function zoomA(ns, cx, cy) {
  ns = Math.max(1, Math.min(5, ns)); const p = S.s; S.s = ns; colocar(cx, cy, p);
  if (ns <= 1.001) cerrarZoom();
}
function abrirZoom(cx, cy) {
  if (zoomOn) return;
  zoomOn = true; const r = stage.getBoundingClientRect();
  armarHoja(false); zoomEl.classList.add("on"); zinfo.classList.add("on");
  stage.querySelector(".book").style.visibility = "hidden";
  const ts = 2.2; if (cx != null) zoomA(ts, cx - r.left, cy - r.top); else zoomA(ts, r.width / 2, r.height / 2);
  $("#bZin").classList.add("act"); $("#app").classList.add("zo");
}
function cerrarZoom() {
  if (!zoomOn) return; zoomOn = false;
  zoomEl.classList.remove("on"); zinfo.classList.remove("on"); sheet.innerHTML = "";
  const b = stage.querySelector(".book"); if (b) b.style.visibility = ""; $("#bZin").classList.remove("act"); $("#app").classList.remove("zo");
  actualizar();
}
const ptr = new Map(); let pin0 = null, mov = 0, dx0 = 0, tIni = 0;
zoomEl.addEventListener("pointerdown", (e) => {
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); mov = 0; dx0 = e.clientX; tIni = Date.now();
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pin0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.s }; }
  zoomEl.classList.add("drag");
});
zoomEl.addEventListener("pointermove", (e) => {
  const p = ptr.get(e.pointerId); if (!p) return;
  const r = stage.getBoundingClientRect();
  if (ptr.size === 2 && pin0) {
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const prev = S.s; S.s = Math.max(1, Math.min(5, pin0.s * d / pin0.d));
    colocar((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, prev); mov += 10; return;
  }
  const ddx = e.clientX - p.x, ddy = e.clientY - p.y; mov += Math.abs(ddx) + Math.abs(ddy);
  if (mov > 6) { try { zoomEl.setPointerCapture(e.pointerId); } catch (_) {} }
  p.x = e.clientX; p.y = e.clientY; S.x += ddx; S.y += ddy; pintar();
});
function soltar(e) {
  if (!ptr.has(e.pointerId)) return;
  const fin = e.clientX - dx0; ptr.delete(e.pointerId); pin0 = null; zoomEl.classList.remove("drag");
  if (ptr.size === 0 && S.s <= 1.05 && Math.abs(fin) > 70 && Date.now() - tIni < 600) { fin < 0 ? sig() : ant(); } // deslizar para pasar
  else if (ptr.size === 0 && S.s < 1.05) cerrarZoom();
}
zoomEl.addEventListener("pointerup", soltar); zoomEl.addEventListener("pointercancel", soltar);
zoomEl.addEventListener("click", (e) => { if (mov > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
zoomEl.addEventListener("dblclick", (e) => {
  const r = stage.getBoundingClientRect(); if (e.target.closest("a")) return;
  S.s > 1.2 ? (S.s = 1, cerrarZoom()) : zoomA(2.6, e.clientX - r.left, e.clientY - r.top);
});
zoomEl.addEventListener("wheel", (e) => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomA(S.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener("wheel", (e) => { if (!zoomOn && e.ctrlKey) { e.preventDefault(); abrirZoom(e.clientX, e.clientY); } }, { passive: false });
function zoomPaso(f) {
  const r = stage.getBoundingClientRect();
  if (!zoomOn) { if (f > 1) abrirZoom(null, null); return; }
  zoomA(S.s * f, r.width / 2, r.height / 2);
}

/* ---------- panel: índice, miniaturas, búsqueda ---------- */
function armarPanel() {
  const toc = $("#c-toc");
  if (!L.toc.length) toc.innerHTML = '<div class="vacio">Este libro no tiene índice. Usa las miniaturas o la búsqueda.</div>';
  L.toc.forEach(([nv, t, p]) => {
    const a = document.createElement("a"); a.dataset.p = p; a.className = "n" + Math.min(nv, 3);
    a.innerHTML = "<span></span><span>" + p + "</span>"; a.firstChild.textContent = t;
    a.addEventListener("click", () => { go(p - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    toc.appendChild(a);
  });
  const th = $("#c-th");
  for (let i = 1; i <= N; i++) {
    const b = document.createElement("button"); b.dataset.p = i; b.setAttribute("aria-label", "Ir a la página " + i);
    b.innerHTML = '<img loading="lazy" alt=""><div>' + i + "</div>"; b.firstChild.src = "t/" + pad(i) + ".webp";
    b.addEventListener("click", () => { go(i - 1); if (matchMedia("(max-width:640px)").matches) panel(false); });
    th.appendChild(b);
  }
}
const idxN = L.paginas.map((p) => norm(p.t));
let qh = 0;
$("#q").addEventListener("input", () => {
  clearTimeout(qh); qh = setTimeout(() => {
    const q = norm($("#q").value.trim()), out = $("#res"); out.innerHTML = "";
    if (q.length < 2) return;
    let c = 0;
    for (let i = 0; i < N && c < 80; i++) {
      const k = idxN[i].indexOf(q); if (k < 0) continue; c++;
      const t = L.paginas[i].t, a = Math.max(0, k - 40), z = Math.min(t.length, k + q.length + 70);
      const b = document.createElement("button"); b.className = "res";
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      b.innerHTML = "<b>Pág. " + (i + 1) + "</b> · " + (a ? "…" : "") + esc(t.slice(a, k)) + "<mark>" + esc(t.slice(k, k + q.length)) + "</mark>" + esc(t.slice(k + q.length, z)) + (z < t.length ? "…" : "");
      b.addEventListener("click", () => { go(i); if (matchMedia("(max-width:640px)").matches) panel(false); });
      out.appendChild(b);
    }
    if (!c) out.innerHTML = '<div class="vacio">Sin resultados.</div>';
  }, 200);
});
function tab(t) {
  document.querySelectorAll(".tabs [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  for (const k of ["toc", "th", "bq"]) $("#c-" + k).hidden = k !== t;
  if (t === "bq") $("#q").focus();
  if (t === "th") { const c = document.querySelector(".th button.cur"); if (c) c.scrollIntoView({ block: "center" }); }
}
function panel(on, t) { $("#panel").classList.toggle("on", on); if (on && t) tab(t); if (on) mas(false); }
function mas(on) { $("#mas").classList.toggle("on", on); }
document.querySelectorAll(".tabs [data-t]").forEach((b) => b.addEventListener("click", () => tab(b.dataset.t)));
$("#pX").onclick = () => panel(false);
$("#bIdx").onclick = () => panel(!$("#panel").classList.contains("on"), L.toc.length ? "toc" : "th");
$("#bThumbs").onclick = () => panel(true, "th");
$("#bSearch").onclick = () => panel(true, "bq");

/* ---------- barra de herramientas ---------- */
$("#prev").onclick = $("#bPrev2").onclick = ant; $("#next").onclick = $("#bNext2").onclick = sig;
$("#bFirst").onclick = () => go(0); $("#bLast").onclick = () => go(N - 1);
$("#bZin").onclick = () => zoomPaso(1.5); $("#bZout").onclick = () => zoomPaso(1 / 1.5);
$("#scrub").addEventListener("change", (e) => go(+e.target.value - 1));
$("#pgIn").addEventListener("change", (e) => { const v = Math.max(1, Math.min(N, +e.target.value || 1)); go(v - 1); });
$("#bSnd").onclick = $("#mSnd").onclick = () => setSnd(!soundOn);
function compartir() {
  const url = location.href.split("#")[0] + "#p=" + (visibles(idx)[0] + 1);
  if (navigator.share) navigator.share({ title: L.titulo, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
  else toast(url);
  mas(false);
}
$("#bShare").onclick = $("#mShare").onclick = compartir;
const fsEl = document.documentElement, fsOk = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function fs() {
  if (!fsOk) { toast("Tu navegador no permite pantalla completa aquí"); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  mas(false);
}
$("#bFs").onclick = $("#mFs").onclick = fs;
if (!fsOk) { $("#bFs").hidden = true; $("#mFs").hidden = true; }
$("#bMore").onclick = (e) => { e.stopPropagation(); mas(!$("#mas").classList.contains("on")); };
document.addEventListener("click", (e) => { if (!e.target.closest("#mas")) mas(false); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") sig(); else if (k === "ArrowLeft" || k === "PageUp") ant();
  else if (k === "Home") go(0); else if (k === "End") go(N - 1);
  else if (k === "+" || k === "=") zoomPaso(1.5); else if (k === "-") zoomPaso(1 / 1.5);
  else if (k === "Escape") { if ($("#panel").classList.contains("on")) panel(false); else if (zoomOn) cerrarZoom(); }
  else if (k === "f" || k === "F") fs(); else if (k === "/") { e.preventDefault(); panel(true, "bq"); }
});
let rh = 0;
window.addEventListener("resize", () => { clearTimeout(rh); rh = setTimeout(() => { const z = zoomOn; if (z) cerrarZoom(); build(idx); }, 180); });

/* ---------- inicio ---------- */
armarPanel(); setSnd(soundOn);
const m = /#p=(\d+)/.exec(location.hash);
build(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
window.addEventListener("hashchange", () => { const h = /#p=(\d+)/.exec(location.hash); if (h && +h[1] - 1 !== visibles(idx)[0]) go(+h[1] - 1); });
window.__fb = { go, sig, ant, abrirZoom, cerrarZoom, get estado() { return { idx, two, zoomOn, s: S.s, pw, ph }; } };
</script>
