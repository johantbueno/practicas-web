<script>
"use strict";
const L = {"titulo": "IA aplicada a MIPYMES · Unidad 1", "autor": "Johan Tapia, PhD", "n": 27, "ratio": 0.70667, "paginas": [{"t": "IA GUÍA DEL PARTICIPANTE Fundamentos y conceptos esenciales de la Inteligencia Artificial Unidad I · 7 horas IA aplicada a MIPYMES Material de estudio para asesores empresariales de INFOTEP Johan Tapia, PhD Elaborado con fuentes verificadas · Distribución para los participantes del curso", "l": []}, {"t": "2 IA aplicada a MIPYMES · Unidad I Contenido Cómo aprovechar esta guía 3 Qué es la inteligencia artificial 4 Diferencia entre automatización tradicional e IA 6 Casos de uso de IA en MIPYMES dominicanas 9 Límites, sesgos, alucinaciones y uso responsable de la IA 11 Privacidad de los datos de la empresa al usar IA 13 Comparar, relacionar y desmentir 16 Caso de análisis y práctica guiada 18 Lo que se le pedirá en el aula virtual 20 Compruebe lo aprendido 22 Glosario, videos y referencias 24 Glosario 24 Para seguir aprendiendo 24 Referencias consultadas 25 Respuestas y explicaciones 26", "l": []}, {"t": "3 IA aplicada a MIPYMES · Unidad I Esta unidad ofrece a los asesores empresariales de INFOTEP las bases conceptuales indispensables para orientar a las MIPYMES dominicanas en la adopción de la inteligencia artificial. A través de la comprensión de los tipos de sistemas, el aprendizaje automático y la diferencia respecto a la automatización tradicional, el asesor podrá identificar oportunidades reales de mejora. Además, se analizan los principales casos de uso prácticos para elevar la eficiencia operativa del tejido empresarial local. Asimismo, la unidad aborda de manera rigurosa la gestión de límites técnicos, sesgos algorítmicos y alucinaciones en los modelos generativos. El profesional conocerá los marcos de uso responsable y los protocolos de privacidad necesarios para proteger los datos confidenciales de las empresas. Con estos fundamentos, el asesor estará equipado para guiar a los pequeños empresarios hacia una transformación digital ética, segura y sostenible que impulse la competitividad del negocio. Lo que logrará Resultado de aprendizaje Explicar los conceptos esenciales de la inteligencia artificial y reconocer sus usos y límites en los servicios empresariales a MIPYMES. Mapa de la unidad Fundamentos de IA en MIPYMES 1 1. Qué es la IA y tipos Conceptos clave, evolución histórica y modelos de aprendizaje. 2 2. Automatización vs IA Diferencia entre reglas fijas y sistemas adaptativos con datos. 3 3. Casos de uso MIPYME Aplicaciones prácticas en ventas, atención y gestión de datos. 4 4. Límites y uso ético Mitigación de alucinaciones, sesgos y supervisión humana. 5 5. Privacidad de datos Protocolos de anonimización y protección de información sensible. Los 5 temas de Unidad I y cómo se conectan. Cómo aprovechar esta guía BIENVENIDA", "l": []}, {"t": "4 IA aplicada a MIPYMES · Unidad I Ruta de estudio sugerida Cómo se evalúa en Unidad I (solo puntúan las actividades de la plataforma) Actividad Puntos Modalidad Foro de discusión 4 puntos Individual Reactivo (cuestionario) 6 puntos Individual Actividad grupal 6 puntos Grupal Esta guía no puntúa Es material de estudio y práctica. Las respuestas modelo y de la autoevaluación están al final para que pueda comprobar su avance. La inteligencia artificial (IA) es un conjunto de tecnologías de software capaces de realizar tareas asociadas a la inteligencia humana, como la comprensión del lenguaje, la predicción y la generación de contenidos. En su desarrollo histórico, el aprendizaje automático (Machine Learning) ha permitido a los sistemas aprender a partir de datos dinámicos, mientras que los modelos de lenguaje y modelos fundacionales procesan patrones complejos para responder o ejecutar instrucciones. Actualmente se diferencian tipos clave como la IA analítica o predictiva y la IA generativa, la cual crea texto, imágenes, audio o código a partir de indicaciones. Por qué importa a una MIPYME Comprender estos términos permite a una MIPYME identificar las herramientas de IA más adecuadas para mejorar el desempeño de su personal sin incurrir en grandes costos. Además, ayuda al negocio a adoptar la tecnología de forma segura, reduciendo cargas de trabajo repetitivas y compensando brechas de habilidades en el equipo. Cómo funciona La inteligencia artificial es una rama de la ciencia de la computación que busca desarrollar sistemas capaces de realizar tareas que normalmente requieren inteligencia humana, tales como el razonamiento, el aprendizaje y la resolución de problemas. A lo largo de su historia, la inteligencia artificial ha evolucionado desde sistemas conceptuales basados en Lea el tema completo y subraye lo que no le quede claro. 1 Reproduzca el ejemplo trabajado con sus propios datos (ficticios o de una empresa que asesora, con autorización). 2 Complete la plantilla y la lista de verificación del tema. 3 Responda la pregunta de reflexión y llévela al foro. 4 Resuelva la autoevaluación sin mirar las respuestas; después compare. 5 Qué es la inteligencia artificial TEMA 1 DE 5", "l": []}, {"t": "5 IA aplicada a MIPYMES · Unidad I reglas fijas hasta modelos modernos capaces de procesar grandes volúmenes de datos. En el contexto empresarial, estas herramientas permiten automatizar labores analíticas y operativas rutinarias. 1 1. Captura de datos 2 2. Entrenamiento modelo 3 3. Patrones e ideas 4 4. Generación de salida 5 5. Control de calidad Proceso del tema 1 en pasos ordenados. Ejemplo trabajado: Clasificación inteligente de consultas de clientes en una comercializadora Una empresa distribuidora de productos para el hogar recibe decenas de mensajes diarios con solicitudes de precios, reclamos y pedidos especiales. Esta acumulación manual de mensajes provocaba retrasos de hasta dos días en la atención y pérdida de oportunidades de venta. Para solucionar esta situación, la empresa decidió estructurar un modelo de prueba que organiza automáticamente las consultas entrantes. Resultado (ilustrativo). La empresa redujo el tiempo de clasificación de mensajes de horas a pocos segundos. Esto permitió al equipo comercial responder las cotizaciones el mismo día e incrementar la satisfacción de sus clientes. Paso a paso para aplicarlo Error común Confundir los diferentes tipos de IA e introducir información sensible o confidencial en herramientas gratuitas sin entender cómo funcionan sus modelos ni aplicar supervisión humana. Recopilar y clasificar un historial de cien mensajes de clientes según su categoría: cotización, reclamo o información general. 1 Ingresar los datos organizados en un modelo de aprendizaje automático sencillo para que identifique las palabras clave de cada categoría. 2 Probar el modelo con diez mensajes nuevos para verificar la precisión del sistema al asignar la categoría correspondiente. 3 Establecer una ruta de respuesta automática donde las cotizaciones se envían directamente al área de ventas para su atención inmediata. 4 Identificar las tareas repetitivas o de comunicación en la MIPYME que pueden apoyarse en modelos de IA. 1 Seleccionar herramientas aprobadas que protejan los datos corporativos y cuenten con licencias empresariales adecuadas. 2 Capacitar al personal en el funcionamiento básico de los modelos y en la redacción de instrucciones claras. 3 Establecer un protocolo de revisión humana obligatoria sobre todo contenido producido antes de su uso final. 4", "l": []}, {"t": "6 IA aplicada a MIPYMES · Unidad I Plantilla: Ficha de diagnóstico de madurez digital y uso de IA para MIPYMES Área del negocio a diagnosticar Identifique el departamento o proceso específico de la empresa que presenta mayor carga de trabajo administrativo. Tipo de datos disponibles Especifique el formato de la información existente en la empresa, como registros en hojas de cálculo, textos de correos o archivos físicos. Herramienta de IA seleccionada Describa la solución digital gratuita o de costo bajo que se utilizará para asistir en el proceso. Métrica de éxito e impacto Defina la forma cuantitativa o cualitativa con la que se medirá la mejora en la productividad del negocio. Verifique antes de seguir (tema 1) Identificar los procesos del negocio que requieren análisis de datos o redacción de contenidos. Verificar la calidad y organización de los datos históricos guardados por la empresa. Diferenciar entre inteligencia artificial general y modelos de aprendizaje automático aplicados. Seleccionar herramientas digitales de costo accesible que no requieran conocimientos de programación. Establecer normas claras para la protección de la información confidencial de la empresa. Designar un supervisor humano encargado de validar la veracidad de las salidas del modelo. Pregunta frecuente P. ¿Cuál es la diferencia entre la inteligencia artificial y el aprendizaje automático? R. La inteligencia artificial es el concepto amplio de crear máquinas inteligentes, mientras que el aprendizaje automático es el método específico donde el sistema aprende analizando patrones en los datos sin ser programado explícitamente. Es similar a comparar la categoría general de vehículos con el motor específico que los hace mover. Para reflexionar y llevar al foro ¿Qué tareas rutinarias de atención o comunicación en la MIPYME que usted asesora podrían beneficiarse hoy del uso asistido de un modelo de IA generativa bajo supervisión humana? La automatización tradicional ejecuta secuencias de instrucciones y reglas fijas previamente programadas para realizar tareas mecánicas y repetitivas de forma rígida. Por su parte, la inteligencia artificial utiliza modelos capaces de analizar datos dinámicos, reconocer patrones y adaptarse a situaciones cambiantes para resolver problemas no estructurados. Mientras que la Diferencia entre automatización tradicional e IA TEMA 2 DE 5", "l": []}, {"t": "7 IA aplicada a MIPYMES · Unidad I automatización convencional requiere programación explícita para cada variante, la IA evalúa información diversa y genera respuestas o recomendaciones adaptativas. Por qué importa a una MIPYME Comprender esta diferencia permite a una MIPYME identificar cuándo basta con un software de reglas fijas y cuándo conviene integrar soluciones inteligentes para optimizar procesos y reducir cargas de trabajo. Esto evita gastos innecesarios en tecnologías complejas para tareas sencillas y garantiza una adopción tecnológica adecuada. Cómo funciona La automatización tradicional se basa en reglas de programación rígidas y predefinidas, donde un sistema ejecuta secuencias de instrucciones del tipo 'si ocurre A, entonces haz B'. Este enfoque resulta altamente eficiente para tareas estructuradas y repetitivas, como calcular impuestos o enviar notificaciones programadas, pero carece de flexibilidad para adaptarse cuando se presentan variaciones en los datos o en las solicitudes de los usuarios. Si las condiciones cambian, el sistema tradicional requiere ser reprogramado manualmente. 1 Mapear procesos 2 Seleccionar herramientas 3 Establecer directrices 4 Capacitar equipo Proceso del tema 2 en pasos ordenados. Ejemplo trabajado: Comparativa de gestión de pedidos en una distribuidora textil Una pequeña empresa distribuidora de confecciones textiles procesa las órdenes de compra enviadas por sus clientes a través de correos electrónicos y mensajes de texto. Inicialmente, utilizaban un sistema tradicional que solo registraba pedidos si el cliente llenaba un formulario con un formato idéntico e inflexible. Debido a que la mayoría enviaba mensajes informales, el personal debía digitar los datos manualmente provocando demoras. Resultado (ilustrativo). La empresa logró automatizar la recepción de pedidos sin exigir formularios rígidos a sus clientes. Esto redujo el tiempo de procesamiento de cada orden de quince minutos a solo unos segundos. Paso a paso para aplicarlo Mapear los campos fijos que el sistema tradicional exigía en el formulario estándar de pedidos. 1 Configurar una herramienta de inteligencia artificial para extraer el nombre, producto y cantidad desde mensajes de texto informales. 2 Comparar la tasa de procesamiento automático entre la automatización rígida previa y el modelo adaptativo actual. 3 Integrar el modelo con la hoja de cálculo de inventarios para actualizar las existencias de forma inmediata. 4 Mapear los procesos operativos del negocio para diferenciar las tareas rígidas basadas en reglas de aquellas que requieren análisis o generación de contenido. 1 Evaluar las herramientas disponibles en el mercado y seleccionar las que respondan a la necesidad real de automatización o IA. 2", "l": []}, {"t": "8 IA aplicada a MIPYMES · Unidad I Error común Intentar implementar inteligencia artificial para resolver tareas sencillas que se gestionan eficientemente con automatización tradicional o asumir que la IA opera sin necesidad de revisión humana. Plantilla: Matriz de evaluación: Automatización tradicional vs. Inteligencia Artificial Proceso empresarial analizado Describa la tarea operativa o administrativa específica de la empresa que se desea optimizar. Nivel de estructuración de los datos Indique si la información se encuentra en tablas fijas o si proviene de textos informales y documentos variados. Reglas de decisión requeridas Especifique si la tarea sigue una lógica fija de pasos o si exige interpretar el contexto de forma flexible. Tecnología sugerida (Tradicional vs IA) Determine cuál enfoque resulta más costo-eficiente considerando la complejidad del proceso y el presupuesto. Verifique antes de seguir (tema 2) Identificar las tareas repetitivas del negocio que manejan datos estructurados. Evaluar si el proceso requiere tomar decisiones adaptativas basadas en texto o imágenes. Comparar los costos de implementar reglas tradicionales frente a herramientas inteligentes. Verificar que los datos de entrada posean la calidad necesaria para el entrenamiento o consulta. Seleccionar soluciones de costo accesible que no requieran desarrollo de código a medida. Establecer puntos de supervisión humana para validar los casos con alta variabilidad. Pregunta frecuente P. ¿Cuándo conviene usar automatización tradicional en lugar de inteligencia artificial? R. La automatización tradicional es ideal cuando el proceso tiene reglas fijas que nunca cambian y datos totalmente estructurados, como la emisión de facturas estándar. Resulta más económica y predecible para tareas mecánicas sencillas. Para reflexionar y llevar al foro ¿Cuáles de los procesos actuales de la MIPYME que usted asesora operan de forma rígida y cuáles podrían transformar su productividad mediante la capacidad adaptativa de la inteligencia artificial? Establecer directrices de uso claro y protección de datos para garantizar el tratamiento seguro de la información corporativa. 3 Capacitar al equipo de trabajo e implementar la revisión humana obligatoria sobre las salidas producidas por herramientas de IA. 4", "l": []}, {"t": "9 IA aplicada a MIPYMES · Unidad I Los casos de uso de inteligencia artificial en las MIPYMES se concentran principalmente en actividades de soporte como la atención al cliente, el marketing, las ventas y la gestión administrativa. En lugar de transformar radicalmente los procesos productivos centrales de inmediato, la IA se aplica para apoyar al personal en tareas periféricas rutinarias como la redacción de contenidos, traducción de documentos y respuesta a consultas. Esta aplicación práctica permite optimizar el tiempo de trabajo operativo y compensar la falta de personal especializado en áreas específicas. Por qué importa a una MIPYME Adoptar casos de uso prácticos de IA permite a una MIPYME incrementar la productividad de sus colaboradores y reducir la carga de trabajo rutinaria sin elevar los costos operativos. Esto ayuda al negocio a responder más rápido a sus clientes y competir en mejores condiciones en el mercado. Cómo funciona Los casos de uso de la inteligencia artificial en las pequeñas y medianas empresas dominicanas abarcan la automatización de la atención al cliente, la optimización del inventario y la simplificación de tareas administrativas. Mediante el uso de herramientas digitales accesibles que no requieren programación, las empresas pueden procesar mensajes entrantes, redactar cotizaciones comerciales y analizar hábitos de compra. Esta implementación permite transformar datos operativos cotidianos en decisiones estratégicas, mejorando la respuesta del negocio sin incurrir en elevados costos de infraestructura o personal especializado. 1 Mapear tareas 2 Seleccionar herramientas 3 Establecer directrices 4 Capacitar personal 5 Medir mejoras Proceso del tema 3 en pasos ordenados. Ejemplo trabajado: Optimización de atención y cotizaciones en un taller mecánico Un taller de servicios mecánicos en Santo Domingo recibía decenas de solicitudes diarias de presupuestos a través de mensajes instantáneos. La redacción manual de cada cotización provocaba demoras de varias horas, afectando la conversión de clientes y la organización del trabajo operativo. Para agilizar este proceso, el taller decidió implementar un caso de uso práctico basado en plantillas inteligentes de atención. Casos de uso de IA en MIPYMES dominicanas TEMA 3 DE 5 Categorizar las solicitudes más frecuentes en servicios de mantenimiento preventivo, diagnóstico eléctrico y reparación de frenos. 1 Diseñar una plantilla de instrucción para el asistente digital definiendo el formato estándar de cotización y los servicios del taller. 2 Configurar la herramienta para generar un borrador automático de presupuesto a partir de la descripción enviada por el cliente. 3", "l": []}, {"t": "10 IA aplicada a MIPYMES · Unidad I Resultado (ilustrativo). El taller redujo el tiempo de entrega de cotizaciones de tres horas a menos de diez minutos por solicitud. Esto permitió incrementar las ventas mensuales de servicios en un quince por ciento ilustrativo. Paso a paso para aplicarlo Error común Intentar transformar de golpe el proceso principal del negocio con IA en lugar de iniciar con casos de uso sencillos en tareas de soporte administrativo. Plantilla: Matriz de identificación de casos de uso de IA para MIPYMES Proceso empresarial a optimizar Especifique el área operativa o comercial de la empresa que presenta mayor consumo de tiempo administrativo. Problema operativo detectado Describa el cuello de botella o la dificultad específica que afecta la productividad diaria del negocio. Solución tecnológica sugerida Indique la herramienta o asistente digital de bajo costo que se utilizará para apoyar la tarea. Métrica de impacto esperada Defina el indicador cuantitativo con el cual se evaluará el ahorro de tiempo o el incremento en ventas. Verifique antes de seguir (tema 3) Identificar los procesos administrativos y comerciales con mayor carga repetitiva. Seleccionar soluciones tecnológicas gratuitas o de costo accesible para la empresa. Definir metas claras de ahorro de tiempo para cada caso de uso implementado. Establecer reglas para proteger la información confidencial de la empresa y clientes. Designar al personal encargado de realizar la supervisión humana de las respuestas. Capacitar al equipo de trabajo en el uso práctico de las instrucciones prediseñadas. Revisar y validar el borrador por parte del encargado del taller antes de realizar el envío definitivo al cliente. 4 Mapear las tareas administrativas y de atención al cliente más repetitivas en la MIPYME. 1 Seleccionar herramientas de IA aprobadas que se adapten a las necesidades inmediatas de soporte. 2 Establecer directrices claras sobre qué información de clientes o del negocio no debe ingresarse en las herramientas. 3 Capacitar al personal e instaurar la revisión humana obligatoria sobre las respuestas y textos generados. 4 Medir las mejoras en el tiempo de respuesta y la eficiencia del equipo para ajustar el uso de la herramienta. 5", "l": []}, {"t": "11 IA aplicada a MIPYMES · Unidad I Pregunta frecuente P. ¿Qué áreas de una MIPYME dominicana se benefician más rápido de la inteligencia artificial? R. Las áreas de atención al cliente, ventas y gestión documental obtienen resultados inmediatos al automatizar respuestas y borradores. Esto libera tiempo operacional que el personal puede dedicar a actividades estratégicas. Para reflexionar y llevar al foro ¿Qué actividades de atención al cliente o redacción comercial en las MIPYMES que usted acompaña consumen más tiempo diario y podrían apoyarse en un asistente de IA? Aunque los modelos de inteligencia artificial generan respuestas verosímiles, presentan limitaciones técnicas como las alucinaciones o generación de información inventada, así como sesgos derivados de los datos de entrenamiento. Asimismo, el uso desinformado de herramientas de IA puede comprometer la confidencialidad de la empresa y la protección de datos personales si no existen normas claras. Por ello, un uso responsable requiere implementar protocolos de gobernanza, clasificación de datos y supervisión humana obligatoria sobre los resultados producidos. Por qué importa a una MIPYME Para una MIPYME, gestionar los límites de la IA previene la difusión de errores comerciales y protege la información confidencial de sus clientes y finanzas. Esto evita daños reputacionales y garantiza que la adopción tecnológica aporte valor de forma segura. Cómo funciona Los modelos de inteligencia artificial generativa operan mediante el cálculo de probabilidades estadísticas para predecir la siguiente palabra en una secuencia, lo que significa que no poseen comprensión conceptual ni conciencia de la verdad. Debido a esta arquitectura, los sistemas pueden generar alucinaciones, es decir, redactar respuestas gramaticalmente coherentes y convincentes pero totalmente falsas o imprecisas. Asimismo, si los datos de entrenamiento contienen sesgos históricos, la herramienta reproducirá y amplificará esos prejuicios en sus recomendaciones operativas y comerciales. 1 Establecer clasificación 2 Prohibir uso 3 Aprobar cuentas 4 Revisión obligatoria 5 Capacitar personal Proceso del tema 4 en pasos ordenados. Límites, sesgos, alucinaciones y uso responsable de la IA TEMA 4 DE 5", "l": []}, {"t": "12 IA aplicada a MIPYMES · Unidad I Ejemplo trabajado: Gestión de alucinaciones en cotizaciones de una tienda de repuestos Una empresa distribuidora de repuestos automotrices implementó un asistente digital para redactar borradores de propuestas comerciales a sus clientes. Durante una prueba, el sistema generó la descripción de una pieza inexistente con un precio erróneo debido a una alucinación del modelo. El asesor detectó el fallo antes de enviar el documento y aplicó el protocolo de verificación de la empresa. Resultado (ilustrativo). La empresa evitó pérdidas financieras y protegió su reputación comercial ante el cliente. Además, reforzó el protocolo interno de validación previa en todos los departamentos. Paso a paso para aplicarlo Error común Asumir que los contenidos generados por la IA son siempre verídicos y enviarlos a los clientes sin realizar una verificación previa. Plantilla: Protocolo de verificación y uso responsable de IA en la MIPYME Proceso empresarial o documento evaluado Indique la tarea o el informe generado por la herramienta digital que será sometido a revisión. Puntos de verificación de veracidad Especifique los datos críticos como precios, fechas y normativas que deben cotejarse con fuentes oficiales. Evaluación de sesgos e imparcialidad Verifique que el lenguaje utilizado no contenga discriminación ni prejuicios hacia clientes o proveedores. Medidas de anonimización de datos Confirme que se hayan eliminado nombres, cédulas y números bancarios antes de realizar la consulta. Identificar las discrepancias de precios y códigos de repuestos en el borrador comparándolos con el catálogo oficial. 1 Ajustar la instrucción (prompt) agregando la restricción explícita de no inventar datos y usar solo la lista adjunta. 2 Implementar una hoja de control de calidad donde el personal firma la revisión humana antes de emitir la cotización. 3 Documentar el incidente en la biblioteca de casos del negocio para prevenir errores similares en el equipo. 4 Establecer una política simple que clasifique la información del negocio en pública, interna y confidencial. 1 Prohibir la introducción de datos personales de clientes, finanzas o contraseñas en herramientas gratuitas o no autorizadas. 2 Aprobar el uso exclusivo de cuentas corporativas revisadas y configurar las opciones para no entrenar modelos con los datos ingresados. 3 Instaurar la revisión humana obligatoria («human-in-the-loop») sobre todo texto, cifra o imagen antes de su difusión o envío a clientes. 4 Capacitar al personal en alfabetización de IA para identificar alucinaciones y comunicar rápidamente cualquier error detectado. 5", "l": []}, {"t": "13 IA aplicada a MIPYMES · Unidad I Verifique antes de seguir (tema 4) Verificar que no se hayan ingresado datos confidenciales en la herramienta digital. Cotejar todas las cifras y precios generados contra el sistema administrativo oficial. Evaluar si el tono de la respuesta cumple con los estándares éticos de la empresa. Detectar posibles alucinaciones analizando la coherencia de la información técnica. Ajustar las instrucciones para limitar las respuestas solo al contexto proporcionado. Confirmar la firma de revisión humana antes de enviar cualquier documento al cliente. Pregunta frecuente P. ¿Por qué la inteligencia artificial genera información falsa con tanta seguridad? R. La herramienta funciona prediciendo palabras probables y no verificando hechos reales. Por ello, redacta textos con estructura convincente aunque el contenido sea completamente inventado. Para reflexionar y llevar al foro ¿Qué tipo de datos de sus clientes o de su negocio deben quedar terminantemente prohibidos de ingresar en asistentes de IA en las MIPYMES que usted asesora? La privacidad de los datos al utilizar inteligencia artificial se refiere a la protección de la información corporativa, financiera y de clientes frente al almacenamiento o uso no autorizado por parte de los proveedores de IA. Al introducir datos en herramientas gratuitas o sin acuerdos de tratamiento adecuados, existe el riesgo de que las plataformas utilicen esa información confidencial para entrenar sus modelos futuros o sufran fugas de datos. Para mitigar estos riesgos, las empresas deben implementar políticas internas de gobernanza, clasificar la sensibilidad de su información y exigir herramientas corporativas con garantías de confidencialidad. Por qué importa a una MIPYME Para una MIPYME, proteger los datos evita la pérdida de secretos comerciales, sanciones por incumplimiento de protección de datos y el daño a la confianza de los clientes. Mantener reglas claras de privacidad garantiza que la empresa aproveche la tecnología sin poner en riesgo su reputación ni sus finanzas. Cómo funciona La privacidad de los datos empresariales al utilizar inteligencia artificial comprende el conjunto de medidas organizativas y técnicas orientadas a proteger la información confidencial de la MIPYME. Al interactuar con proveedores y modelos de inteligencia artificial generativa, los datos ingresados en los campos de consulta pueden ser almacenados o utilizados para reentrenar los sistemas públicos. Para mitigar la exposición no autorizada, las empresas deben adoptar políticas claras de tratamiento de datos, clasificando la información según su sensibilidad antes de cualquier procesamiento digital. Privacidad de los datos de la empresa al usar IA TEMA 5 DE 5", "l": []}, {"t": "14 IA aplicada a MIPYMES · Unidad I 1 Clasificar datos 2 Inventariar herramientas 3 Establecer política 4 Capacitar personal 5 Exigir acuerdos Proceso del tema 5 en pasos ordenados. Ejemplo trabajado: Anonimización de datos de clientes en una oficina de servicios contables Una firma de asesoría contable en Santiago deseaba utilizar un asistente digital para redactar informes ejecutivos de gestión financiera. Sin embargo, el envío de nombres de clientes y estados financieros reales a la plataforma representaba un riesgo alto de violar la confidencialidad. La gerencia decidió implementar un procedimiento estricto de anonimización previa para proteger la información antes del procesamiento digital. Resultado (ilustrativo). La firma generó sus informes ejecutivos de forma eficiente sin exponer datos sensibles en servidores externos. Esto protegió la privacidad de los clientes y mantuvo el cumplimiento de las normas de confidencialidad. Paso a paso para aplicarlo Error común Permitir que los empleados copien información confidencial o datos personales en herramientas gratuitas de IA asumiendo erróneamente que las conversaciones son privadas y no se utilizarán para entrenar modelos externos. Clasificar la información del informe financiero identificando variables confidenciales como montos exactos, números de cuenta y nombres de los clientes. 1 Reemplazar los nombres reales por etiquetas genéricas como 'Cliente A' y redondear las cifras financieras en montos ilustrativos antes de ingresar la consulta. 2 Procesar la estructura del informe en el asistente digital utilizando la información anonimizada para generar el borrador ejecutivo. 3 Reinsertar manualmente la información confidencial en el documento final interno bajo la supervisión directa del contador responsable. 4 Clasificar los datos de la empresa en niveles como público, interno, confidencial y de especial protección. 1 Identificar las herramientas de IA en uso e inventariar si se emplean cuentas personales o corporativas aprobadas. 2 Establecer una política interna que prohíba explícitamente introducir datos personales, contraseñas o secretos comerciales en herramientas no verificadas. 3 Capacitar al personal en alfabetización de IA para que comprendan los riesgos de fuga de datos y la necesidad de anonimizar la información. 4 Exigir o configurar acuerdos de procesamiento de datos y la opción de exclusión de entrenamiento en las plataformas utilizadas. 5", "l": []}, {"t": "15 IA aplicada a MIPYMES · Unidad I Plantilla: Protocolo de clasificación y anonimización de datos para la MIPYME Tipo de información procesada Especifique si los datos corresponden a clientes, proveedores, finanzas o procesos internos del negocio. Nivel de sensibilidad de la información Indique si la información es de uso público, de uso interno restringido o estrictamente confidencial. Procedimiento de anonimización aplicado Describa la técnica utilizada para eliminar nombres, números de cédula, códigos y montos exactos. Herramienta o entorno de procesamiento autorizado Mencione la plataforma digital o asistente que cumple con las políticas de confidencialidad aprobadas. Verifique antes de seguir (tema 5) Clasificar la información del negocio según su nivel de confidencialidad. Eliminar nombres, cédulas y teléfonos antes de realizar la consulta digital. Reemplazar cifras financieras reales por valores redondos ilustrativos. Verificar los términos de privacidad de la herramienta tecnológica seleccionada. Establecer normas claras sobre qué datos está prohibido ingresar en la plataforma. Capacitar al personal de la empresa en técnicas básicas de anonimización. Pregunta frecuente P. ¿Qué sucede con los datos que una MIPYME ingresa en una herramienta digital de acceso público? R. En las versiones de acceso público, la información ingresada puede ser almacenada en servidores externos y utilizada para reentrenar el modelo. Por esta razón, nunca se deben compartir datos confidenciales sin anonimización previa. Para reflexionar y llevar al foro ¿Qué datos sensibles de sus clientes o de la gestión financiera de la MIPYME que usted asesora podrían estar ingresándose hoy en herramientas de IA sin las debidas garantías de privacidad?", "l": []}, {"t": "16 IA aplicada a MIPYMES · Unidad I Comparación entre Automatización Tradicional e Inteligencia Artificial Criterio Automatización Tradicional Inteligencia Artificial Lógica de operación Sigue reglas fijas y secuencias rígidas programadas previamente. Analiza datos para identificar patrones y adaptarse a situaciones complejas. Manejo de imprevistos Se detiene o genera error ante datos no estructurados o inesperados. Interpreta información ambigua y genera respuestas ajustadas al contexto. Capacidad de creación Limitada a ejecutar tareas repetitivas de procesamiento de datos. Genera contenidos originales como textos, borradores, listas y resúmenes. Mantenimiento requerido Exige reprogramación manual para cada cambio en el proceso de negocio. Aprende de nuevos datos e instrucciones sin reescribir el código base. Supervisión requerida Requiere verificación de reglas lógicas iniciales por el programador. Exige supervisión humana continua para validar la veracidad del contenido. Comparar, relacionar y desmentir PROFUNDICE", "l": []}, {"t": "17 IA aplicada a MIPYMES · Unidad I Ciclo de adopción responsable de IA en la MIPYME 1 Diagnóstico 2 Anonimización 3 Ejecución 4 Validación 5 Medición 1. Diagnóstico. Identificar procesos repetitivos y cuellos de botella en la empresa. 2. Anonimización. Eliminar datos confidenciales de clientes y finanzas antes de consultar. 3. Ejecución. Aplicar instrucciones estructuradas en herramientas digitales accesibles. 4. Validación. Revisar los borradores generados mediante supervisión humana obligatoria. 5. Medición. Evaluar el ahorro de tiempo y el impacto real en la productividad diaria. Ciclo de adopción responsable de IA en la MIPYME Mitos y realidades Mito Realidad La inteligencia artificial comprende el significado real de los textos y no comete errores en sus respuestas. La IA opera prediciendo patrones probabilísticos de lenguaje y puede generar alucinaciones o datos completamente falsos de forma convincente. Implementar inteligencia artificial en una pequeña empresa requiere contratar programadores y realizar inversiones millonarias. Existen múltiples herramientas gratuitas y de bajo costo que se utilizan escribiendo en español sencillo sin necesidad de saber programar. Las herramientas digitales sustituirán por completo al personal administrativo de las pequeñas empresas. La tecnología actúa como un asistente de apoyo que aumenta la productividad, requiriendo siempre el juicio crítico y la supervisión humana. Es seguro ingresar cualquier información de la empresa en aplicaciones públicas de inteligencia artificial. Los datos ingresados en plataformas públicas pueden ser almacenados, por lo que es obligatorio anonimizar la información confidencial.", "l": []}, {"t": "18 IA aplicada a MIPYMES · Unidad I Buenas prácticas de la unidad Establecer una política interna escrita que defina las herramientas digitales permitidas y los niveles de autorización en la empresa. Anonimizar estrictamente todos los datos personales y financieros antes de procesar cualquier consulta en la plataforma. Mantener la supervisión humana obligatoria como filtro final de veracidad en cada borrador generado por la herramienta. Crear una biblioteca compartida de plantillas de instrucción efectivas para estandarizar la calidad del trabajo en el equipo. Capacitar de manera continua al personal en alfabetización digital para comprender las capacidades y límites de la tecnología. Caso de estudio: Diagnóstico y adopción responsable de IA en una empresa distribuidora de alimentos La empresa 'Distribuidora del Cibao' es una pequeña comercializadora de productos alimenticios ubicada en Santiago con diez empleados. El propietario nota que el personal administrativo dedica más de cuatro horas diarias a responder mensajes repetitivos de clientes y elaborar cotizaciones manualmente. Con el deseo de modernizar las operaciones, el gerente decide implementar un asistente digital de inteligencia artificial de acceso libre para automatizar las respuestas comerciales. Sin embargo, en la primera semana de pruebas, el sistema generó un borrador de presupuesto con un descuento inexistente y el precio equivocado de un saco de arroz debido a una alucinación del modelo. Además, el encargado de ventas ingresó por error el listado completo con los nombres, cédulas y saldos pendientes de los clientes en la consulta pública. Ante esta situación, el asesor empresarial de INFOTEP es convocado para evaluar los riesgos operativos y reorganizar la estrategia de transformación digital de la empresa. Preguntas de análisis 1. ¿Qué factores técnicos causaron el error en el precio del presupuesto y cómo debe gestionarse? 2. ¿Qué falla de privacidad ocurrió al ingresar el listado de clientes y cómo debe prevenirse en el futuro? 3. ¿Cuál es la diferencia entre la automatización tradicional y la solución de IA que intentó aplicar la distribuidora? Caso de análisis y práctica guiada APLIQUE", "l": []}, {"t": "19 IA aplicada a MIPYMES · Unidad I 4. ¿Qué pasos inmediatos debe recomendar el asesor de INFOTEP para lograr una adopción segura en la empresa? Práctica guiada: Auditoría de privacidad y diseño de consultas estructuradas para el asesor Objetivo y materiales Evaluar los procesos de una MIPYME para identificar riesgos de privacidad y estructurar borradores de trabajo seguros utilizando plantillas de consulta. Materiales: Ficha de diagnóstico de procesos operativos de la MIPYME., Matriz de clasificación y anonimización de datos confidenciales, Acceso a una herramienta de IA generativa de acceso libre o bajo costo, Lista de verificación de supervisión humana y control de calidad. Resultado esperado Un protocolo práctico de consulta validado y libre de datos confidenciales, junto con un borrador comercial auditado mediante supervisión humana que optimice el tiempo del negocio. Paso 1: Seleccionar una tarea administrativa específica y repetitiva dentro de la empresa cliente, como la elaboración de borradores para atención al cliente. 1 Paso 2: Revisar los documentos de origen e identificar todos los datos sensibles, como nombres reales, teléfonos, cédulas y montos financieros confidenciales. 2 Paso 3: Aplicar la técnica de anonimización reemplazando los identificadores reales por etiquetas genéricas como 'Cliente A' o 'Producto 1'. 3 Paso 4: Redactar la consulta utilizando el marco RTF, definiendo claramente el Rol del asistente, la Tarea exacta y el Formato de respuesta deseado. 4 Paso 5: Introducir la instrucción anonimizada en la herramienta digital y generar el borrador de respuesta correspondiente. 5 Paso 6: Auditar el texto generado para identificar posibles alucinaciones, sesgos o lenguaje inconsistente con los valores de la empresa. 6 Paso 7: Reinsertar manualmente los datos reales en el documento verificado y obtener la firma de aprobación del supervisor responsable. 7", "l": []}, {"t": "20 IA aplicada a MIPYMES · Unidad I Conocer de antemano las actividades y sus rúbricas le permite estudiar con un propósito. Los detalles y fechas están en el aula virtual. Foro de discusión (4 puntos) Tras visualizar el video sobre los fundamentos de la inteligencia artificial y su impacto en el entorno empresarial, es momento de analizar cómo estos conceptos se traducen en el acompañamiento diario a las MIPYMES dominicanas. Como asesores de INFOTEP, nuestra labor no solo es promover la innovación tecnológica, sino orientar a los empresarios hacia un uso práctico, eficiente y responsable de estas herramientas. Preguntas para debatir Cómo se valora Se valoran el aporte argumentado con ejemplos de MIPYMES, la relación con el video y el contenido, y la respuesta respetuosa a un compañero. Los detalles están en el aula virtual. Reactivo (cuestionario, 6 puntos) Preguntas de opción múltiple sobre los conceptos de la unidad; mide comprensión y aplicación, no memoria. Se responde en el aula virtual dentro del plazo indicado; la autoevaluación de esta guía le sirve de práctica. Actividad grupal: Taller colaborativo de adopción de IA: Hoja de ruta, plantilla de política y diseño de prompts para una MIPYME dominicana Qué entrega Un documento estructurado de propuesta de adopción que incluya el mapa de procesos, el prompt bajo marco RTF, la plantilla de política de gobernanza y las recomendaciones de implementación para la MIPYME ficticia. Lo que se le pedirá en el aula virtual ACTIVIDADES DE L A PL ATAFORMA ¿En qué procesos rutinarios de las MIPYMES que usted asesora (como un colmado, una ferretería o un salón de belleza) identifica que sería más conveniente recomendar soluciones de inteligencia artificial en lugar de automatización tradicional, y por qué? 1 Al recomendar herramientas de IA a un empresario dominicano, ¿qué estrategias o reglas sencillas de gobernanza y privacidad de datos aplicaría usted para evitar la fuga de información confidencial y prevenir errores derivados de alucinaciones del modelo? 2", "l": []}, {"t": "21 IA aplicada a MIPYMES · Unidad I Rúbrica (se conoce de antemano) Criterio Nivel excelente (puntaje máximo) Trabajo colaborativo y división de roles El equipo demuestra una integración fluida en la distribución de tareas, articulando aportes sustantivos e interconectados desde los roles asignados para responder a las necesidades de la MIPYME. Diferenciación de tecnologías y selección de casos de uso Distingue con rigor técnico la automatización tradicional de la inteligencia artificial, seleccionando casos de uso viables en tareas de soporte que optimizan la productividad del personal. Ingeniería de prompts estructurada Diseña un prompt completo y preciso alineado al marco RTF (Rol, Tarea, Formato) que guía eficazmente al modelo de IA garantizando respuestas adaptadas al contexto comercial. Marco de gobernanza, privacidad y uso responsable Establece directrices de privacidad sólidas que protegen los datos confidenciales de la empresa, prohíben herramientas gratuitas no reguladas e imponen la revisión humana obligatoria. Puntaje: 6 puntos en total. Cada criterio se valora según el nivel alcanzado; la ponderación exacta está en el aula virtual.", "l": []}, {"t": "22 IA aplicada a MIPYMES · Unidad I Responda primero; las respuestas con su explicación están en el anexo final. Esta autoevaluación no puntúa. Preguntas de repaso 1. Para calentar motores, ¿cuál es la característica fundamental que define a la Inteligencia Artificial frente a otros sistemas de software? A. Su funcionamiento basado únicamente en hardware especializado que no requiere conexión ni software. B. Su necesidad de ser reprogramada manualmente cada vez que ingresa una nueva instrucción o consulta. C. Su capacidad exclusiva de reemplazar de forma total e independiente a todo el personal de una empresa. D. Su capacidad para analizar datos dinámicos, aprender patrones y adaptarse para resolver problemas no estructurados. 2. Imagina un colmado que usa tecnología en su caja. ¿Qué situación representa un ejemplo de automatización tradicional y NO de inteligencia artificial? A. Un programa que genera ideas de ofertas promocionales combinando productos según tendencias de venta. B. Un modelo que traduce automáticamente mensajes de proveedores internacionales interpretando el contexto. C. Un sistema de código de barras que descuenta mecánicamente del inventario la cantidad fija de un producto escaneado. D. Un asistente virtual que redacta respuestas adaptadas para cada cliente según su historial de consultas. 3. Al asesorar a una ferretería dominicana que desea dar sus primeros pasos con IA, ¿en qué área es más recomendable iniciar según la evidencia de adopción? A. En la reestructuración completa e inmediata del sistema contable y fiscal autónomo de la empresa. B. En tareas periféricas de soporte, como la redacción de publicaciones promocionales y la atención básica a consultas de clientes. C. En la sustitución directa del gerente para la toma de decisiones estratégicas de inversión a largo plazo. D. En el desarrollo desde cero de un modelo de lenguaje propio programado por los empleados del negocio. 4. Un asesor enseña a un salón de belleza a redactar un 'prompt' efectivo usando la estructura RTF. ¿Qué significan estas siglas en la ingeniería de prompts? A. Registro, Tiempo y Finanzas. B. Revisión, Transferencia y Firma. C. Riesgo, Tecnología y Filtros. D. Rol, Tarea y Formato. 5. Durante una demostración, el asistente de IA redacta una cotización para un cliente pero inventa el precio de un servicio con total seguridad formal. ¿Qué fenómeno ocurrió y cómo debe gestionarse? A. Es un ciberataque externo y se resuelve cambiando el router del establecimiento. B. Es un sesgo de algoritmo y se corrige reiniciando el equipo de cómputo. C. Es una alucinación técnica del modelo y requiere establecer siempre la revisión humana obligatoria antes de enviar información a clientes. D. Es un error de automatización tradicional que indica que el código fuente del programa expiró. Compruebe lo aprendido AUTOEVALUACIÓN", "l": []}, {"t": "23 IA aplicada a MIPYMES · Unidad I 6. Si una herramienta de IA para selección de personal favorece sistemáticamente a ciertos perfiles sobre otros sin justificación objetiva, ¿a qué se debe este comportamiento? A. A que la herramienta alcanzó su capacidad máxima de memoria RAM en el servidor local. B. A que el modelo tiene sesgos derivados de patrones desequilibrados o prejuicios presentes en los datos con los que fue entrenado. C. A que el sistema aplicó correctamente una regla fija de automatización tradicional. D. A un error de formato en el prompt redactado por el usuario al solicitar la consulta. 7. Una MIPYME decide clasificar su información para usar IA de forma segura. ¿Qué información debe quedar estrictamente prohibida de ingresar en herramientas públicas o gratuitas? A. Los datos personales de clientes, números de cédula, registros financieros confidenciales y contraseñas. B. Los nombres de los productos estándar y las descripciones generales del catálogo. C. Los horarios de apertura al público y la ubicación geográfica del local comercial. D. Las listas de preguntas frecuentes que los clientes realizan habitualmente por redes sociales. 8. Para lograr una adopción sostenible e integral de la IA en una MIPYME dominicana, ¿cuál es el orden correcto de acciones que debe orientar el asesor de INFOTEP? A. Definir una política de uso con reglas de privacidad, capacitar al personal en alfabetización de IA, seleccionar herramientas aprobadas y mantener la revisión humana. B. Prohibir totalmente el uso de computadoras en la empresa para evitar alucinaciones y fugas de información. C. Permitir que cada empleado use cualquier herramienta gratuita en su teléfono personal sin establecer normas internas. D. Comprar licencias costosas sin capacitar al personal y delegar en la IA toda la atención al cliente de forma autónoma. Tarjetas de repaso: tape la columna derecha y responda Pregunta Respuesta ¿Qué es la Inteligencia Artificial (IA)? Es un conjunto de tecnologías de software capaces de realizar tareas asociadas a la inteligencia humana, como comprender el lenguaje, razonar y generar contenidos. ¿En qué se diferencia la automatización tradicional de la Inteligencia Artificial? La automatización tradicional ejecuta reglas e instrucciones fijas preprogramadas, mientras que la IA analiza datos dinámicos y se adapta para resolver problemas no estructurados. ¿Qué es el Aprendizaje Automático o Machine Learning? Es la rama de la IA que permite a los sistemas aprender y mejorar su desempeño a partir del análisis de datos sin necesidad de ser programados explícitamente para cada regla. ¿Qué es la IA Generativa? Es una categoría de la IA capaz de crear nuevos contenidos originales, como texto, imágenes, audio o código, a partir de instrucciones o datos de entrada. ¿Qué es un modelo de lenguaje? Es un sistema de IA entrenado con grandes volúmenes de texto para procesar, comprender y generar lenguaje natural de forma coherente. ¿Qué es un prompt en inteligencia artificial? Es la instrucción, texto o petición inicial que se proporciona a un modelo de IA para guiar su respuesta o producción de contenido.", "l": []}, {"t": "24 IA aplicada a MIPYMES · Unidad I Glosario Inteligencia Artificial (IA) Es un conjunto de tecnologías de software capaces de realizar tareas asociadas a la inteligencia humana, como la comprensión del lenguaje, el razonamiento y la generación de contenidos. Automatización tradicional Es un sistema informático que ejecuta secuencias de instrucciones y reglas fijas previamente programadas para realizar tareas mecánicas de forma rígida. Aprendizaje automático (Machine Learning) Es la rama de la inteligencia artificial que permite a los sistemas aprender y mejorar su desempeño automáticamente a partir del análisis de datos dinámicos sin ser programados explícitamente para cada regla. IA Generativa Es un tipo de inteligencia artificial diseñada para crear nuevos contenidos originales, tales como texto, imágenes, audio o código, a partir de instrucciones o indicaciones. Modelo de lenguaje Es un sistema de inteligencia artificial entrenado con amplios volúmenes de texto para comprender, procesar y generar lenguaje natural de forma coherente. Prompt Es la instrucción, texto o petición inicial que se le proporciona a una herramienta de inteligencia artificial para guiar su respuesta o producción de contenido. Ingeniería de prompts Es la disciplina que consiste en diseñar y estructurar de manera sistemática las instrucciones dirigidas a un modelo de IA para obtener resultados más precisos y útiles. Alucinación Es un error técnico en el que un modelo de inteligencia artificial genera información inexacta, falsa o inventada mostrándola de manera verosímil. Sesgo en IA Es una desviación o prejuicio en los resultados de un modelo de inteligencia artificial provocado por patrones desequilibrados o discriminatorios presentes en sus datos de entrenamiento. Supervisión humana Es el protocolo de control mediante el cual un profesional calificado revisa, verifica y aprueba las salidas generadas por la IA antes de su publicación o uso definitivo. Alfabetización en IA Es el conjunto de conocimientos, habilidades y comprensión que permite al personal de una empresa utilizar herramientas de inteligencia artificial de forma informada, crítica y segura. Gobernanza de IA Es el marco de políticas, directrices y controles internos que establece una empresa para regular el uso aceptable, la privacidad de datos y la gestión de riesgos al utilizar inteligencia artificial. Para seguir aprendiendo Videos gratuitos y verificados. Úselos con las MIPYMES que asesora, citando siempre al canal. Glosario, videos y referencias RECURSOS", "l": []}, {"t": "25 IA aplicada a MIPYMES · Unidad I Entender la inteligencia artificial para avanzar como Pyme BBVA en España · 5 min La IA aplicada a las Pymes BBVA en España · 9 min La inteligencia artificial en las PyMES y Startups CPA UNLPam · 8 min La Diferencia entre Automatizaciones e Inteligencia Artificial - ¿Cuál necesita tu empresa? - E05 Atypia - Inteligencia Artificial para Negocios · 21 min Referencias consultadas 1. AI Adoption Statistics 2026: Businesses, Workers & Industries - Articsledge 2. Guía paso a paso: IA generativa para su empresa - IBM 3. How are SMEs using generative AI?: Generative AI and the SME Workforce | OECD 4. Generative AI and the SME Workforce - OECD 5. Directrices sobre IA para pymes: Política de IA con plantilla y plan de 90 días. 6. Política de uso de Inteligencia Artificial en la empresa: Guía y Plantilla - SocraTech 7. Política de uso de IA en la empresa: plantilla y contenido 8. Politica de Uso de IA para Empresas: Plantilla y Guia Completa | Javadex Autoría Guía elaborada por Johan Tapia, PhD, con base en las fuentes citadas. Los casos y los datos son ficticios o ilustrativos.", "l": [{"x": 7.311, "y": 5.434, "w": 41.725, "h": 16.926, "u": "https://www.youtube.com/watch?v=m_aNDrMy_HQ"}, {"x": 51.18, "y": 5.434, "w": 41.725, "h": 16.926, "u": "https://www.youtube.com/watch?v=DSiDEhh3Qvs"}, {"x": 7.311, "y": 23.874, "w": 41.725, "h": 18.351, "u": "https://www.youtube.com/watch?v=f8czc7gRivE"}, {"x": 51.18, al que define a la Inteligencia Artificial frente a otros sistemas de software? D) Su capacidad para analizar datos dinámicos, aprender patrones y adaptarse para resolver problemas no estructurados. Por qué: La IA se distingue por procesar información dinámica y adaptarse, a diferencia de los programas rígidos. 2. Imagina un colmado que usa tecnología en su caja. ¿Qué situación representa un ejemplo de automatización tradicional y NO de inteligencia artificial? C) Un sistema de código de barras que descuenta mecánicamente del inventario la cantidad fija de un producto escaneado. Por qué: El descuento mecánico por lectura de código de barras es un proceso rígido basado en reglas fijas prefijadas. 3. Al asesorar a una ferretería dominicana que desea dar sus primeros pasos con IA, ¿en qué área es más recomendable iniciar según la evidencia de adopción? B) En tareas periféricas de soporte, como la redacción de publicaciones promocionales y la atención básica a consultas de clientes. Por qué: Las MIPYMES obtienen victorias rápidas iniciando con tareas de soporte administrativo y comunicación comercial. 4. Un asesor enseña a un salón de belleza a redactar un 'prompt' efectivo usando la estructura RTF. ¿Qué significan estas siglas en la ingeniería de prompts? D) Rol, Tarea y Formato. Por qué: El marco RTF define qué papel asume el modelo (Rol), qué debe hacer (Tarea) y cómo entregar la respuesta (Formato). Respuestas y explicaciones ANE XO", "l": []}, {"t": "27 IA aplicada a MIPYMES · Unidad I 5. Durante una demostración, el asistente de IA redacta una cotización para un cliente pero inventa el precio de un servicio con total seguridad formal. ¿Qué fenómeno ocurrió y cómo debe gestionarse? C) Es una alucinación técnica del modelo y requiere establecer siempre la revisión humana obligatoria antes de enviar información a clientes. Por qué: Las alucinaciones son respuestas inventadas por la IA que exigen supervisión humana obligatoria antes de su uso. 6. Si una herramienta de   if (t === "th") { const c = document.querySelector(".th button.cur"); if (c) c.scrollIntoView({ block: "center" }); }
}
function panel(on, t) { $("#panel").classList.toggle("on", on); if (on && t) tab(t); if (on) mas(false); }
function mas(on) { $("#mas").classList.toggle("on", on); }
document.querySelectorAll(".tabs [data-t]").forEach((b) => b.addEventListener("click", () => tab(b.dataset.t)));
$("#pX").onclick = () => panel(false);
$("#bIdx").onclick = () => panel(!$("#panel").classList.contains("on"), L.toc.length ? "toc" : "th");
$("#bThumbs").onclick = () => panel(true, "th");
$("#bSearch").onclick = () => panel(true, "bq");

/* ---------- barra de herramientas ---------- */
$("#prev").onclick = $("#bPrev2").onclick = ant; $("#next").onclick = $("#bNext2").onclick = sig;
$("#bFirst").onclick = () => go(0); $("#bLast").onclick = () => go(N - 1);
$("#bZin").onclick = () => zoomPaso(1.5); $("#bZout").onclick = () => zoomPaso(1 / 1.5);
$("#scrub").addEventListener("change", (e) => go(+e.target.value - 1));
$("#pgIn").addEventListener("change", (e) => { const v = Math.max(1, Math.min(N, +e.target.value || 1)); go(v - 1); });
$("#bSnd").onclick = $("#mSnd").onclick = () => setSnd(!soundOn);
function compartir() {
  const url = location.href.split("#")[0] + "#p=" + (visibles(idx)[0] + 1);
  if (navigator.share) navigator.share({ title: L.titulo, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
  else toast(url);
  mas(false);
}
$("#bShare").onclick = $("#mShare").onclick = compartir;
const fsEl = document.documentElement, fsOk = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function fs() {
  if (!fsOk) { toast("Tu navegador no permite pantalla completa aquí"); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  mas(false);
}
$("#bFs").onclick = $("#mFs").onclick = fs;
if (!fsOk) { $("#bFs").hidden = true; $("#mFs").hidden = true; }
$("#bMore").onclick = (e) => { e.stopPropagation(); mas(!$("#mas").classList.contains("on")); };
document.addEventListener("click", (e) => { if (!e.target.closest("#mas")) mas(false); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") sig(); else if (k === "ArrowLeft" || k === "PageUp") ant();
  else if (k === "Home") go(0); else if (k === "End") go(N - 1);
  else if (k === "+" || k === "=") zoomPaso(1.5); else if (k === "-") zoomPaso(1 / 1.5);
  else if (k === "Escape") { if ($("#panel").classList.contains("on")) panel(false); else if (zoomOn) cerrarZoom(); }
  else if (k === "f" || k === "F") fs(); else if (k === "/") { e.preventDefault(); panel(true, "bq"); }
});
let rh = 0;
window.addEventListener("resize", () => { clearTimeout(rh); rh = setTimeout(() => { const z = zoomOn; if (z) cerrarZoom(); build(idx); }, 180); });

/* ---------- inicio ---------- */
armarPanel(); setSnd(soundOn);
const m = /#p=(\d+)/.exec(location.hash);
build(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
window.addEventListener("hashchange", () => { const h = /#p=(\d+)/.exec(location.hash); if (h && +h[1] - 1 !== visibles(idx)[0]) go(+h[1] - 1); });
window.__fb = { go, sig, ant, abrirZoom, cerrarZoom, get estado() { return { idx, two, zoomOn, s: S.s, pw, ph }; } };
</script>
