<style>
:root{--bg:#0b1a4a;--ac:#E8B010;--tx:#eef2ff;--mut:#9fb0de;--pnl:#101f55;--lin:rgba(255,255,255,.14);--btn:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 38%,color-mix(in srgb,var(--bg) 70%,#3a63d6) 0%,var(--bg) 62%,#050c26 100%)}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:54px;z-index:5}
header img{height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{background:var(--btn);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--mut)}
.cta{background:var(--ac);color:#0b1a4a;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.book{transition:transform .6s ease;will-change:transform}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.page a.lk,#sheet a.lk{position:absolute;display:block;border-radius:3px;background:rgba(232,176,16,.0);transition:background .15s}
.page a.lk:hover,#sheet a.lk:hover{background:rgba(232,176,16,.28);outline:1px solid rgba(232,176,16,.7)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:84px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(255,255,255,.2)}.nav:disabled{opacity:.25;cursor:default}
#prev{left:8px}#next{right:8px}
#zoom{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;z-index:3;display:none}
#zoom.on{display:block}#zoom.drag{cursor:grabbing}
#sheet{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;background:#fff;box-shadow:0 10px 50px rgba(0,0,0,.55)}
#sheet .pp{position:relative;flex:none}
#sheet img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.zinfo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 14px;font-size:13px;z-index:6;display:none;pointer-events:none}
.zinfo.on{display:block}
footer{z-index:5;padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#scrub{width:100%;margin:0;accent-color:var(--ac);height:14px;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px;justify-content:space-between}
.grp{display:flex;align-items:center;gap:6px}
.credito{font-size:12px;color:var(--mut);white-space:nowrap}
.ib{width:42px;height:42px;border:0;border-radius:10px;background:var(--btn);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:rgba(255,255,255,.2)}.ib.act{background:var(--ac);color:#0b1a4a}.ib:disabled{opacity:.3}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--mut);font-size:14px}
.pin input{width:54px;height:38px;border-radius:8px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);text-align:center;font:inherit}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,86vw);background:var(--pnl);border-right:1px solid var(--lin);z-index:8;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.4)}
#panel.on{transform:none}
.tabs{display:flex;border-bottom:1px solid var(--lin)}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 14px inherit;cursor:pointer}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs .x{flex:none;width:44px;font-size:20px}
.cont{flex:1;overflow:auto;padding:10px}
.cont[hidden]{display:none}

.toc a.n2{padding-left:26px;font-size:14px}.toc a.n3{padding-left:42px;font-size:13px}
.vacio{color:var(--mut);padding:14px 6px}
.th{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th button{background:none;border:2px solid transparent;border-radius:8px;padding:4px;color:var(--mut);cursor:pointer;font:12px inherit}
.th button img{width:100%;display:block;border-radius:3px;background:#fff}
.th button.cur{border-color:var(--ac);color:var(--tx)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--lin);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;margin-bottom:8px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--lin);padding:9px 6px;color:var(--tx);cursor:pointer;font:13px/1.4 inherit}
.res:hover{background:var(--btn)}.res b{color:var(--ac)}.res mark{background:var(--ac);color:#0b1a4a;border-radius:2px}
.acerca{border-top:1px solid var(--lin);padding:10px 14px;font-size:12px;color:var(--mut)}
#mas{position:absolute;right:8px;bottom:78px;background:var(--pnl);border:1px solid var(--lin);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#mas.on{display:flex}
#mas button,#mas a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;color:var(--tx);font:14px inherit;cursor:pointer;border-radius:8px;text-decoration:none;white-space:nowrap}
#mas button:hover,#mas a:hover{background:var(--btn)}
#mas svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:999px;z-index:20;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.m-only{display:none}
@media (max-width:640px){
 header{padding:6px 10px;gap:8px;min-height:48px}header h1{font-size:14px}header img{height:28px;max-width:80px}
 .cta{padding:6px 12px;font-size:13px}.d-only{display:none!important}.m-only{display:inline-flex}
 .nav{width:34px;height:64px}.credito{display:none}.ib{width:40px;height:40px}
 header .pg{display:none}.app.zo .nav{display:none}
 .app:not(.zo) #bZout{display:none}.bar,.grp{gap:4px}.ib{width:38px;height:38px}.pin{font-size:13px}.pin input{width:44px;height:36px}
}
:fullscreen header{min-height:44px}

<script>
"use strict";
const L = {"titulo": "Manual de la Unidad 1 · Pensar en producto", "autor": "Johan Tapia, PhD", "n": 14, "ratio": 0.70593, "paginas": [{"t": "MANUAL DEL PARTICIPANTE · UNIDAD 1 Pensar en producto: de la idea de negocio a la app Empezamos desde cero: qué es la inteligencia artificial, cómo funciona y cómo usarla en tu negocio. Desarrollado por Johan Tapia, PhD", "l": []}, {"t": "UNIDAD 1 DE 5 Antes de empezar 🎯 Qué aprenderás Qué es la inteligencia artificial y qué no es. Qué son los tokens, el contexto y el prompt, con ejemplos de tu negocio. Cómo evitar errores y proteger tus datos. Cómo pasar de una idea a una primera versión simple de una app. 🛠️ Qué harás Leer este manual y ver el video del foro. Hacer la Práctica 1: un cartel con código QR de WhatsApp. Participar en el foro y entregar la actividad en equipo. 📦 Qué entregas 1 participación en el foro (10 pts) · 1 evidencia grupal de la actividad (70 pts) · 1 reactivo individual (20 pts). ⏱️ Duración 1 semana, con un encuentro por Microsoft Teams. CÓMO USAR ESTE MANUAL Cada página tiene definiciones (azul), ejemplos de negocios dominicanos (amarillo) y consejos (verde). No necesitas saber de tecnología: empezamos desde cero. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 2", "l": []}, {"t": "TEMA 1 ¿Qué es la inteligencia artificial? La inteligencia artificial (IA) es un programa de computadora que aprendió patrones leyendo millones de ejemplos y ahora puede ayudarte a escribir, resumir, traducir, calcular o crear imágenes. DEFINICIÓN Inteligencia artificial: programas que realizan tareas que antes requerían inteligencia humana, como entender textos o reconocer imágenes. PIÉNSALO ASÍ Imagina un ayudante nuevo en tu colmado que leyó miles de libros de negocios pero nunca ha entrado a tu tienda. Sabe mucho en general, pero tú tienes que explicarle tu caso. No es magia ni una persona: no piensa ni siente; calcula qué respuesta es la más probable. Ya la usas sin darte cuenta: el corrector del celular, las sugerencias de videos, el traductor y los asistentes de WhatsApp. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 3", "l": []}, {"t": "TEMA 2 ¿Cómo aprende la IA? Un niño aprende a distinguir un mango de un aguacate viendo muchos ejemplos. La IA aprende igual, pero con millones de ejemplos y mucha práctica. 📚 1. Datos muchos ejemplos 🏋️ 2. Entrenamiento practica y ajusta 🧠 3. Modelo lo aprendido 💬 4. Respuesta cuando le preguntas DEFINICIONES Modelo: el “cerebro” ya entrenado; es un archivo que recibe tu pregunta y devuelve una respuesta. IA generativa: la que crea contenido nuevo (textos, imágenes, código) a partir de lo que le pides. EJEMPLO DE TU NEGOCIO Le pides a la IA: “escribe 3 ofertas para el fin de semana de mi colmado”. No copia un texto guardado: arma uno nuevo según lo que aprendió. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 4", "l": []}, {"t": "TEMA 3 Los tokens: los “pedacitos” que lee la IA Los modelos de lenguaje no leen palabras completas: las cortan en pedacitos llamados tokens (palabras, partes de palabras o signos). Ejemplo real 1 · “Hola, ¿cómo está usted?” → 7 tokens Hola , ¿ cómo está usted ? Ejemplo real 2 · “Quiero un pedido de arroz y habichuelas para mañana.” → 13 tokens Qu iero un pedido de arroz y hab ich uelas para mañana . Conteo hecho con el tokenizador o200k_base. Cada modelo corta de forma distinta. DEFINICIÓN Token: la unidad más pequeña de texto que procesa un modelo. En español, una palabra suele ser de 1 a 3 tokens (aproximado). ¿Por qué te importan? Costo: muchos servicios de pago cobran por tokens. Límite: cada modelo solo acepta una cantidad máxima por conversación. Velocidad: más tokens, respuesta más lenta. CONSEJO Escribe instrucciones claras y cortas: ahorras tokens y la IA responde mejor. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 5", "l": []}, {"t": "TEMA 4 La memoria de la IA: el contexto La IA no “recuerda” todo lo que hablaron. Solo puede tener presente una cantidad limitada de tokens a la vez: tu pregunta, sus respuestas anteriores y los documentos que le pegaste. DEFINICIÓN Ventana de contexto: la cantidad máxima de tokens que el modelo puede considerar al mismo tiempo. PIÉNSALO ASÍ Es como una mesa de trabajo: si la llenas de papeles, lo más viejo se cae al suelo y la IA lo olvida. Qué hacer en la práctica Si la conversación se vuelve larguísima, pídele: “resume lo acordado” y empieza un chat nuevo pegando ese resumen. Pega solo la parte del documento que necesitas, no todo. Repite los datos importantes (nombre del negocio, tono, precios) al inicio de cada chat. Mini repaso Concepto En una frase Token Pedacito de texto que lee la IA Contexto Lo que cabe en su “mesa de trabajo” Modelo El cerebro ya entrenado Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 6", "l": []}, {"t": "TEMA 5 El prompt: cómo pedirle bien las cosas El prompt es la instrucción que le escribes a la IA. Mientras más claro, mejor la respuesta. Parte Qué dices Rol “Eres el administrador de un colmado en Baní.” Contexto “Desde el lunes hay delivery gratis en pedidos de RD$ 1,000 o más.” Tarea “Escribe un mensaje de WhatsApp para avisar.” Formato “Máximo 3 líneas, tono amigable, con un emoji.” PROMPT FLOJO “Hazme un mensaje.” PROMPT CLARO “Eres el administrador de un colmado en Baní. Desde el lunes hay delivery gratis en pedidos de RD$ 1,000 o más. Escribe un mensaje de WhatsApp para avisar a los clientes. Máximo 3 líneas, tono amigable y con un emoji.” Trucos que funcionan Itera: “hazlo más corto”, “más formal”, “agrega el horario”. Da un ejemplo de cómo quieres la respuesta. Pide el formato: lista, tabla o pasos numerados. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 7", "l": []}, {"t": "TEMA 6 ¿Por qué la IA se equivoca? DEFINICIÓN Alucinación: cuando la IA responde con mucha seguridad algo que no es cierto. Pasa porque la IA predice la respuesta más probable; no consulta una verdad. Si no sabe, a veces inventa. CASO REAL DE ESTE CURSO En una prueba, un asistente de un colmado respondió “Sí, vendemos pollo” aunque el pollo no estaba en su lista de productos. Sonaba seguro… y era falso. Tu lista de verificación ☐ Revisa nombres, cifras, fechas y leyes antes de usarlos. ☐ Pídele fuentes y compruébalas tú mismo. ☐ Usa la IA para borradores; la decisión final es tuya. ☐ Si es algo importante (impuestos, contratos), consulta a un profesional. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 8", "l": []}, {"t": "TEMA 7 Cuida tus datos Lo que escribes en una herramienta de IA sale de tu computadora y puede guardarse. Piensa antes de pegar. NUNCA PEGUES Cédulas, pasaportes o números de tarjeta. Claves, códigos de verificación o tokens. Datos personales de tus clientes (nombres con teléfonos y direcciones). Contratos o información confidencial de tu negocio. SÍ PUEDES USAR Información pública de tu negocio (horario, productos, precios). Datos ficticios para practicar. Textos sin nombres propios. Una opción más privada Hay herramientas que corren en tu propia computadora, sin internet, como Ollama (la verás en la Unidad 5). Tus preguntas no salen de tu equipo. REGLA DE ORO Si no lo dirías en voz alta en una plaza llena de gente, no lo pegues en una IA. Y revisa los términos de cada herramienta. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 9", "l": []}, {"t": "Creación de Aplicaciones con IA para Emprendedores Unidad 1 Infografía: cómo funciona una aplicación por dentro 10", "l": []}, {"t": "TEMA 8 De la idea a la primera versión (MVP) DEFINICIONES Problema de negocio: algo manual, lento o que se pierde en tu negocio. MVP (producto mínimo viable): la versión más simple que ya resuelve el problema principal y que puedes probar con clientes. EJEMPLO Problema: los pedidos de delivery se anotan en una libreta y a veces se pierden. MVP: un catálogo con botón “Pedir por WhatsApp” (lo harás en la Unidad 3), sin sistemas complicados. Tu plantilla de 4 preguntas Pregunta Tu respuesta 1. ¿Quién es mi cliente? 2. ¿Qué problema tiene que hoy se resuelve mal? 3. ¿Cómo lo resuelve hoy? 4. ¿Cuál sería la versión más simple que sirva? CONSEJO Empieza con UN solo problema. Es mejor una app pequeña que se use todos los días que una gigante que nunca se termina. Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 11", "l": []}, {"t": "PRÁCTICA Y FORO Tu práctica y tu foro 📱 Práctica 1: cartel con código QR de WhatsApp 1. Define para qué quieres el QR (pedidos, precios o citas). 2. Pídele a la IA un mensaje de saludo corto. 3. Arma tu enlace de WhatsApp con la plantilla. 4. Crea el código QR y pruébalo con otro celular. 5. Imprime tu cartel y mide durante una semana. La guía completa con la plantilla está en el aula virtual, en la unidad. 🎬 Foro: mira el video y responde 2 preguntas Video: “¿Qué es un MVP? Valida tu app sin gastar de más” (ABAMobile, 3:25 min, en español). Está en el foro de la unidad. 1. ¿Qué es un MVP y por qué conviene empezar con uno? 2. ¿Cuál sería el MVP de tu negocio y qué problema resolvería? 📊 Cómo se califica la unidad Actividad Puntos Foro (individual) 10 Actividad grupal (un archivo por equipo) 70 Reactivo (individual) 20 Creación de Aplicaciones con IA para Emprendedores Unidad 1 Manual de la Unidad 1 · INFOTEP Baní 12", "l": []}, {"t": "REPASO Glosario rápido Término Significa IA Programas que hacen tareas que antes requerían inteligencia humana. IA generativa La que crea textos, imágenes o código nuevos. Modelo El “cerebro” ya entrenado. Token Pedacito de texto que lee la IA. Contexto Lo que el modelo puede tener presente a la vez. Prompt La instrucción que le escribes a la IA. Alucinación Res });
function tab(t) {
  document.querySelectorAll(".tabs [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  for (const k of ["toc", "th", "bq"]) $("#c-" + k).hidden = k !== t;
  if (t === "bq") $("#q").focus();
  if (t === "th") { const c = document.querySelector(".th button.cur"); if (c) c.scrollIntoView({ block: "center" }); }
}
function panel(on, t) { $("#panel").classList.toggle("on", on); if (on && t) tab(t); if (on) mas(false); }
function mas(on) { $("#mas").classList.toggle("on", on); }
document.querySelectorAll(".tabs [data-t]").forEach((b) => b.addEventListener("click", () => tab(b.dataset.t)));
$("#pX").onclick = () => panel(false);
$("#bIdx").onclick = () => panel(!$("#panel").classList.contains("on"), L.toc.length ? "toc" : "th");
$("#bThumbs").onclick = () => panel(true, "th");
$("#bSearch").onclick = () => panel(true, "bq");

/* ---------- barra de herramientas ---------- */
$("#prev").onclick = $("#bPrev2").onclick = ant; $("#next").onclick = $("#bNext2").onclick = sig;
$("#bFirst").onclick = () => go(0); $("#bLast").onclick = () => go(N - 1);
$("#bZin").onclick = () => zoomPaso(1.5); $("#bZout").onclick = () => zoomPaso(1 / 1.5);
$("#scrub").addEventListener("change", (e) => go(+e.target.value - 1));
$("#pgIn").addEventListener("change", (e) => { const v = Math.max(1, Math.min(N, +e.target.value || 1)); go(v - 1); });
$("#bSnd").onclick = $("#mSnd").onclick = () => setSnd(!soundOn);
function compartir() {
  const url = location.href.split("#")[0] + "#p=" + (visibles(idx)[0] + 1);
  if (navigator.share) navigator.share({ title: L.titulo, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
  else toast(url);
  mas(false);
}
$("#bShare").onclick = $("#mShare").onclick = compartir;
const fsEl = document.documentElement, fsOk = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function fs() {
  if (!fsOk) { toast("Tu navegador no permite pantalla completa aquí"); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  mas(false);
}
$("#bFs").onclick = $("#mFs").onclick = fs;
if (!fsOk) { $("#bFs").hidden = true; $("#mFs").hidden = true; }
$("#bMore").onclick = (e) => { e.stopPropagation(); mas(!$("#mas").classList.contains("on")); };
document.addEventListener("click", (e) => { if (!e.target.closest("#mas")) mas(false); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") sig(); else if (k === "ArrowLeft" || k === "PageUp") ant();
  else if (k === "Home") go(0); else if (k === "End") go(N - 1);
  else if (k === "+" || k === "=") zoomPaso(1.5); else if (k === "-") zoomPaso(1 / 1.5);
  else if (k === "Escape") { if ($("#panel").classList.contains("on")) panel(false); else if (zoomOn) cerrarZoom(); }
  else if (k === "f" || k === "F") fs(); else if (k === "/") { e.preventDefault(); panel(true, "bq"); }
});
let rh = 0;
window.addEventListener("resize", () => { clearTimeout(rh); rh = setTimeout(() => { const z = zoomOn; if (z) cerrarZoom(); build(idx); }, 180); });

/* ---------- inicio ---------- */
armarPanel(); setSnd(soundOn);
const m = /#p=(\d+)/.exec(location.hash);
build(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
window.addEventListener("hashchange", () => { const h = /#p=(\d+)/.exec(location.hash); if (h && +h[1] - 1 !== visibles(idx)[0]) go(+h[1] - 1); });
window.__fb = { go, sig, ant, abrirZoom, cerrarZoom, get estado() { return { idx, two, zoomOn, s: S.s, pw, ph }; } };
</script>
